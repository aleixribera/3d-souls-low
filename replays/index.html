<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e10">
<link rel="icon" href="data:,">
<title>Replays</title>
<script src="/js/ui-theme.js"></script>
<style>
  html{background:#0b0e10;color-scheme:dark}
  body{margin:0;min-height:100vh;background:#0b0e10;color:var(--ui-ink);font:400 var(--ui-size-text)/1.45 var(--ui-text);-webkit-text-size-adjust:100%}
  main{max-width:1080px;margin:0 auto;padding:28px max(20px,env(safe-area-inset-right)) 48px max(20px,env(safe-area-inset-left))}
  .top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;padding-bottom:18px;border-bottom:1px solid var(--ui-line)}
  .filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
  .filters label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ui-muted)}
  select{min-height:44px;min-width:150px;padding:0 34px 0 12px;font:500 var(--ui-size-text)/1 var(--ui-text);color:var(--ui-ink);background:#101316;border:1px solid var(--ui-line);border-radius:2px;
    appearance:none;background-image:linear-gradient(45deg,transparent 50%,#aaa493 50%),linear-gradient(135deg,#aaa493 50%,transparent 50%);background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px;background-repeat:no-repeat}
  select:focus-visible{outline:1px solid var(--ui-accent);outline-offset:-1px}
  .ui-button[aria-pressed=true]{color:var(--ui-accent-hi);border-color:var(--ui-accent);background:var(--ui-accent-wash)}
  .ui-button{min-height:44px}
  a,button,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #status{min-height:22px;margin:14px 0 0;color:var(--ui-muted)}
  #status:empty{min-height:0;margin:0}
  .day{margin:26px 0 0}
  .day h2{margin:0 0 6px;font:600 13px/1.3 var(--ui-text);color:var(--ui-muted)}
  ol{list-style:none;margin:0;padding:0}
  .run{display:flex;align-items:stretch;border-top:1px solid #ffffff12}
  .run:last-child{border-bottom:1px solid #ffffff12}
  .run>a{flex:1;min-width:0;display:grid;grid-template-columns:4.2em minmax(0,1.5fr) minmax(0,1.3fr) 5.6em 4.6em;align-items:center;gap:14px;min-height:56px;padding:8px 10px;
    color:inherit;text-decoration:none;border-left:3px solid transparent}
  .run>a:hover{background:var(--ui-hover)}
  .run>a:focus-visible{outline:1px solid var(--ui-accent);outline-offset:-1px;background:#d9b56b14}
  .time,.len,.reach{font-variant-numeric:tabular-nums}
  .time{color:var(--ui-muted)}
  .what{min-width:0}
  .what strong{display:block;font:400 19px/1.25 var(--ui-display);color:var(--ui-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .what span{display:block;font-size:14px;color:var(--ui-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .what span:empty,.ptime,.filters[hidden]{display:none}
  .empty .ui-primary{width:auto}
  .who{min-width:0;color:#cfc8b6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .reach,.len{text-align:right;color:#cfc8b6}
  .live strong{color:#f3b2a2}
  .live .dot{display:inline-block;width:8px;height:8px;margin-right:8px;background:var(--ui-alarm);vertical-align:2px}
  .won strong{color:var(--ui-good)}
  .tools{display:flex;align-items:center;gap:8px;padding-left:6px}
  .tools button{min-width:44px;min-height:44px;padding:0 10px;font:500 14px/1 var(--ui-text);color:var(--ui-muted);background:transparent;border:0;border-radius:2px;cursor:pointer}
  .tools button:hover{color:var(--ui-ink);background:var(--ui-hover)}
  .tools button:focus-visible{outline:1px solid var(--ui-accent);outline-offset:-1px}
  .star svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;vertical-align:-4px}
  .star[aria-pressed=true]{color:var(--ui-accent)}
  .star[aria-pressed=true] svg{fill:currentColor}
  .del.armed{color:var(--ui-accent-ink);background:var(--ui-alarm)}
  .del.armed:hover{background:#ec9a87;color:var(--ui-accent-ink)}
  .del:disabled{visibility:hidden}
  .empty{margin:40px 0 0;max-width:520px}
  .empty h2{margin:0 0 8px;font:400 26px/1.2 var(--ui-display)}
  .empty p{margin:0 0 18px;color:var(--ui-muted)}
  footer{margin-top:34px;color:var(--ui-muted);font-size:13px}
  @media (max-width:720px){
    main{padding-top:18px}
    .ui-title{font-size:32px}
    .filters{width:100%}
    .filters label{flex:1 1 140px}
    select{min-width:0;width:100%}
    .run>a{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"what len" "who reach";gap:2px 12px;padding:10px 6px 10px 4px}
    .time{display:none}
    .what{grid-area:what}.who{grid-area:who;font-size:14px}.reach{grid-area:reach;font-size:14px}.len{grid-area:len}
    .ptime{display:inline;color:var(--ui-muted)}
    .tools{padding-left:0}
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 class="ui-title">Replays</h1>
    <div class="filters" role="group" aria-label="Filter runs">
      <label>Player<select id="player"><option value="">Everyone</option></select></label>
      <label>When<select id="period"><option value="0">Any time</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select></label>
      <button id="starred" class="ui-button" type="button" aria-pressed="false">Starred</button>
    </div>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="list"></div>
  <footer id="foot" hidden>Runs are kept for 60 days. Starred runs are kept for good.</footer>
</main>
<script src="/replays/list.js"></script>
</body>
</html>
