name: Publish game container

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-game-container
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Resolve stable release tags
        id: release
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -e "const fs=require('fs');console.log(fs.readFileSync('js/config.js','utf8').match(/const VERSION = '([^']+)'/)[1])")"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "$version" ]]; then
            echo "Release tag must match VERSION ($version)." >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Install server dependencies
        run: npm --prefix server ci
      - name: Test shared simulation and deployment
        run: |
          node tests/net-timing.cjs
          node tests/multiplayer.cjs
          node tests/fullscreen.cjs
          node tests/autoquality.cjs
          bash -n deploy/update.sh
          node tests/deployment.cjs
          docker compose config --quiet
      - name: Set up multi-platform emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build native image for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: combat-arena-smoke:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Exercise the actual container
        run: |
          docker run -d --name game-smoke --read-only --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:3080:3000 combat-arena-smoke:local
          node tests/container-smoke.cjs http://127.0.0.1:3080
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish latest and versioned images
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:latest
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container logs
        if: always()
        run: docker logs game-smoke 2>/dev/null || true
