name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --no-audit --no-fund
          npm --prefix server ci --no-audit --no-fund
      - name: Check shell scripts
        run: bash -n deploy/update.sh
      - name: Run the node group
        run: node tests/run-all.cjs --group node
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-test-logs
          path: .scratch/test-logs/
          include-hidden-files: true
          retention-days: 7

  browser:
    name: In-page browser suite (Edge, SwiftShader)
    needs: node
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --no-audit --no-fund
          npm --prefix server ci --no-audit --no-fund
      - name: Install Microsoft Edge and its system libraries
        # --force: the runner image may already ship Edge, which Playwright otherwise refuses to reinstall.
        run: npx playwright install --with-deps --force msedge
      - name: Run the solo in-page suite
        env:
          ARENA_SOFTWARE_GL: '1'
        run: node tests/run-all.cjs solo-browser --timeout 40
      - name: Upload suite results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solo-browser-results
          path: |
            .scratch/multiplayer-solo/results.json
            .scratch/test-logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
