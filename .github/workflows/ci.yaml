name: CI

on:
  push:
    branches: [main]
    # Notes-only pushes (state, plan, feedback, docs) test nothing, and each would cancel the code run in progress.
    paths-ignore: ['**.md', '.claude/**']
  pull_request:

permissions:
  contents: read

# Two passes push to main: a run on main always completes (the next one waits); a PR's newer push cancels its old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  browser:
    # The in-page suite takes over 35 minutes in one job under software WebGL, so it runs as parallel shards of
    # consecutive tests, equal in time (ARENA_SHARD, tests/shard-weights.json, tests/solo-browser.cjs). Each test's line
    # streams to the log as it ends. The shards start beside the Node job, not after it.
    name: In-page browser suite ${{ matrix.shard }}/4 (Edge, SwiftShader)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --no-audit --no-fund
          npm --prefix server ci --no-audit --no-fund
      - name: Install Microsoft Edge and its system libraries
        # --force: the runner image may already ship Edge, which Playwright otherwise refuses to reinstall.
        run: npx playwright install --with-deps --force msedge
      - name: Run the solo in-page suite
        timeout-minutes: 25
        env:
          ARENA_SOFTWARE_GL: '1'
          ARENA_TEST_PROGRESS: '1'
          ARENA_SHARD: ''
        run: |
          cp tests/suite.js tests/suite-fixed.js
          cp tests/suite-unfixed.js tests/suite.js
          for i in 1 2 3 4 5 6 7 8; do echo "== unfixed $i"; node tests/solo-browser.cjs "Low loading" 2>&1 | grep -E 'passed|failed|Error:' | cut -c1-200 || true; done
          cp tests/suite-fixed.js tests/suite.js
          for i in 1 2 3 4 5 6 7 8; do echo "== fixed $i"; node tests/solo-browser.cjs "Low loading" 2>&1 | grep -E 'passed|failed|Error:' | cut -c1-200 || true; done
      - name: Upload suite results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solo-browser-results-${{ matrix.shard }}
          path: |
            .scratch/multiplayer-solo/results.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
