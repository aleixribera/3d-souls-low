name: Browser smoke tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    # Two halves of about 4.5 minutes each, side by side (one job took 8.5); AGENTS.md, Test time budget.
    name: smoke ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        part: [startup-alone-calling, reconnect-story]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install dependencies and Edge
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --no-audit --no-fund
          npm --prefix server ci --no-audit --no-fund
          npx playwright install --with-deps --force msedge
      - name: Check startup, Story saves, and Rush sessions
        env:
          ARENA_SOFTWARE_GL: '1'
        # reconnect-browser loads the game three times under SwiftShader: 3m07s on v7.192.0, past a 4-minute limit
        # from v7.193.0 as the game grew (not a hang: 30 s locally). Each test gets 7 minutes.
        run: |
          if [ "${{ matrix.part }}" = startup-alone-calling ]; then
            node tests/run-all.cjs --bail --timeout 7 startup-browser alone-browser calling-browser
          else
            node tests/run-all.cjs --bail --timeout 7 reconnect-browser
            node tests/solo-browser.cjs 'Story: a new game saves at the level start'
          fi
      - name: Upload browser smoke logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke-logs-${{ matrix.part }}
          path: .scratch/test-logs/
          include-hidden-files: true
          if-no-files-found: ignore
