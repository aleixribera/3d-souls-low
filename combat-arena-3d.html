// Shared body physics: knockback decay, gravity, world bounds.
function integrateBody(b, dt, knockFriction) {
  b.x += (b.vx + b.kx) * dt; b.z += (b.vz + b.kz) * dt;
  const f = Math.exp(-knockFriction * dt); b.kx *= f; b.kz *= f;
  if (b.y > 0 || b.vy > 0) { b.vy -= CONFIG.gravity * dt; b.y += b.vy * dt; }
  if (b.y <= 0) { b.y = 0; b.vy = 0; }
  clampToWorld(b);
}
function approachVel(b, tx, tz, maxDelta) {
  const dx = tx - b.vx, dz = tz - b.vz, d = Math.hypot(dx, dz);
  if (d <= maxDelta || d === 0) { b.vx = tx; b.vz = tz; } else { b.vx += dx / d * maxDelta; b.vz += dz / d * maxDelta; }
}

// ============================================================================
// 5. Player
// ============================================================================
// Inventory: { itemId: { count, max } }, created from the player definition.
const makeInventory = list => Object.fromEntries(list.map(it => [it.item, { count: it.count, max: it.max }]));

class Player {
  // carry: { inventory } kept from a previous life (death keeps flask counts).
  constructor(def, x, z, yaw, carry) {
    this.def = def;
    this.rig = new Rig(def.look);
    this.radius = def.radius; this.height = BODY_HEIGHT * def.look.scale;
    this.maxHp = def.stats.maxHp; this.maxStamina = def.stats.maxStamina; this.maxPoise = def.stats.maxPoise;
    this.inventory = carry ? carry.inventory : makeInventory(def.inventory);
    this.souls = 0;
    this.x = x; this.y = 0; this.z = z; this.yaw = yaw;
    this.vx = this.vy = this.vz = 0; this.kx = this.kz = 0;
    this.hp = this.maxHp; this.stamina = this.maxStamina; this.poise = this.maxPoise;
    this.staminaDelay = 0; this.poiseTimer = 0; this.tint = 0; this.flash = 0; this.brace = 0; this.walkPhase = 0;
    this.riposte = 0;      // timer: > 0 while a riposte is available after a successful parry
    this.state = PS.IDLE; this.stateTime = 0;
    this.attack = null; this.payload = null; this.hitbox = null; this.stunTime = 0; this.usingItem = null;
    this.activeAt = Infinity; this.landTime = 0; this.landHit = false;
    this.savePrev();
  }
  alive() { return this.state !== PS.DEAD; }
  in(group) { return PLAYER_GROUPS[group].has(this.state); }
  isFree() { return this.in('free'); }
  isAttacking() { return this.in('attacking'); }
  savePrev() { this.px = this.x; this.py = this.y; this.pz = this.z; this.pyaw = this.yaw; }
  setState(s) { this.state = s; this.stateTime = 0; this.rollQueued = false; }
  spend(amount) { this.stamina = Math.max(0, this.stamina - amount); this.staminaDelay = CONFIG.player.staminaDelay; }
  attackPhase() { return attackTimeline(this.attack, this.stateTime).phase; }
  invulnerable() { return this.state === PS.ROLL && this.stateTime < CONFIG.player.rollIFrames; }
  // A swing already out is not interrupted by hits.
  isCommitted() {
    return (this.state === PS.ATTACK && this.attackPhase() === PHASE.ACTIVE) || (this.state === PS.JUMP_ATTACK && !!this.hitbox);
  }
  item(id) { return this.inventory[id] || { count: 0, max: 0 }; }
  refillItems() { for (const [id, it] of Object.entries(this.inventory)) if (ITEMS[id].refillOnRest) it.count = it.max; }

  // Any stamina allows one emergency roll; a roll that empties the bar leaves the player winded:
  // no more rolls until stamina is back to a full roll's cost.
  canRoll() {
    if (this.winded && this.stamina >= CONFIG.player.rollCost) this.winded = false;
    return this.stamina > 0 && !this.winded;
  }
  startRoll(mv) {
    if (mv.has) this.yaw = Math.atan2(mv.x, mv.z);
    if (this.stamina - CONFIG.player.rollCost < 1) this.winded = true;   // the bar is (all but) empty after this roll
    this.spend(CONFIG.player.rollCost);
    this.hitbox = null; this.setState(PS.ROLL);
  }
  // Heading toward the best nearby enemy in the direction the player means to swing, or null.
  autoAim(mv, enemies) {
    const A = CONFIG.player.autoTarget, want = mv.has ? Math.atan2(mv.x, mv.z) : this.yaw;
    let best = null, bestScore = Infinity;
    for (const c of findEnemies(this, enemies, { range: A.range, cone: A.cone, yaw: want, surface: true })) {
      const score = c.d + c.ang * A.angleWeight;
      if (score < bestScore) { bestScore = score; best = c.dir; }
    }
    return best;
  }
  // Shared by ground and jump attacks: aim, riposte bonus, stamina.
  beginAttack(a, mv, face, enemies) {
    const auto = face === null ? this.autoAim(mv, enemies) : null;
    if (face !== null) this.yaw = face;                // locked on: always aim at the target
    else if (auto !== null) this.yaw = auto;           // near an enemy: aim at it
    else if (mv.has) this.yaw = Math.atan2(mv.x, mv.z);
    this.attack = a;
    this.payload = makeStrike(a, this.riposte > 0);
    this.riposte = 0;
    this.spend(a.cost || 0);
    this.hitbox = null;
  }
  startParry() { this.spend(CONFIG.parry.cost); this.hitbox = null; this.setState(PS.PARRY); }
  useItem(id) {
    this.inventory[id].count--;
    this.usingItem = ITEMS[id]; this.vx = this.vz = 0;
    this.setState(PS.USE_ITEM);
    events.emit('itemUsed', { item: id, player: this });
  }
  // Free on the ground: start the first action whose input is pressed. Returns true if one started.
  tryGroundAction(mv, face, enemies) {
    const C = CONFIG.player, M = this.def.moveset;
    if (this.canRoll() && input.consume('roll')) { this.startRoll(mv); return true; }
    if (this.stamina > 0 && input.consume('parry')) { this.startParry(); return true; }
    for (const [action, id] of Object.entries(M.ground)) {
      if (this.stamina > 0 && input.consume(action)) { this.beginAttack(M.attacks[id], mv, face, enemies); this.setState(PS.ATTACK); return true; }
    }
    for (const [id, item] of Object.entries(ITEMS)) {
      if (this.item(id).count > 0 && input.consume(item.action)) { this.useItem(id); return true; }
    }
    if (this.stamina > 0 && input.consume('jump')) { this.spend(C.jumpCost); this.vy = C.jumpVelocity; this.setState(PS.JUMP); return true; }
    if (input.isHeld('block')) { this.setState(PS.BLOCK); return true; }
    return false;
  }

  // lock: the locked-on enemy or null.
  update(dt, mv, enemies, lock) {
    const C = CONFIG.player, M = this.def.moveset;
    this.stateTime += dt;
    this.tint = Math.max(0, this.tint - dt / CONFIG.fx.tintTime);
    this.flash = Math.max(0, this.flash - dt / CONFIG.parry.flashTime);
    this.brace = Math.max(0, this.brace - dt / C.braceTime);
    this.riposte = Math.max(0, this.riposte - dt);
    this.staminaDelay = Math.max(0, this.staminaDelay - dt);
    if (!this.in('noRegen') && this.staminaDelay <= 0) this.stamina = Math.min(this.maxStamina, this.stamina + C.staminaRegen * dt);
    tickPoise(this, dt, C.poiseResetTime, this.maxPoise);
    const fx = Math.sin(this.yaw), fz = Math.cos(this.yaw);
    const face = lock ? Math.atan2(lock.x - this.x, lock.z - this.z) : null;

    switch (this.state) {
      case PS.IDLE:
      case PS.WALK: {
        if (this.tryGroundAction(mv, face, enemies)) break;
        if (mv.has && face === null) this.yaw = turnToward(this.yaw, Math.atan2(mv.x, mv.z), C.turnRate * dt);
        approachVel(this, mv.x * C.walkSpeed, mv.z * C.walkSpeed, (mv.has ? C.accel : C.decel) * dt);
        const next = mv.has ? PS.WALK : PS.IDLE;
        if (next !== this.state) this.setState(next);
        break;
      }
      case PS.JUMP:
      case PS.FALL: {
        if (this.stamina > 0) {
          const action = Object.keys(M.air).find(a => input.consume(a));
          if (action) {
            this.beginAttack(M.attacks[M.air[action]], mv, face, enemies);
            this.activeAt = Infinity;   // stateTime when the hitbox opened
            this.setState(PS.JUMP_ATTACK);
            break;
          }
        }
        if (mv.has) {
          if (face === null) this.yaw = turnToward(this.yaw, Math.atan2(mv.x, mv.z), C.turnRate * C.airTurnMul * dt);
          approachVel(this, mv.x * C.walkSpeed, mv.z * C.walkSpeed, C.airControl * dt);
        }
        if (this.state === PS.JUMP && this.vy <= 0) this.setState(PS.FALL);
        break;
      }
      case PS.JUMP_ATTACK: {
        // Momentum carries; steering is weaker than a normal jump.
        if (mv.has) approachVel(this, mv.x * C.walkSpeed, mv.z * C.walkSpeed, C.airControl * C.jumpAttackAirControl * dt);
        const a = this.attack;
        if (!this.hitbox && this.stateTime >= a.hits[0].startup && this.vy <= 0) {
          this.hitbox = new Hitbox(this, a.box, this.payload); this.activeAt = this.stateTime;
        }
        break;
      }
      case PS.LAND: {
        // Committed landing: no roll, block, parry or attack until it ends.
        const a = this.attack, air = a.air;
        approachVel(this, 0, 0, C.decel * dt);
        if (this.hitbox && this.hitbox.hit.size > 0 && !this.landHit) {   // connected: hop and recover a bit sooner
          this.landHit = true; this.vy = air.hop; this.landTime = a.recovery * air.hitRecoveryMul;
        }
        if (this.hitbox && this.stateTime >= air.impactTime) this.hitbox = null;
        if (this.stateTime >= this.landTime && this.y <= 0) this.setState(PS.IDLE);
        break;
      }
      case PS.ROLL: {
        const p = this.stateTime / C.rollTime;
        const sp = C.rollSpeed * (1 - C.rollSlow * p * p);
        this.vx = fx * sp; this.vz = fz * sp;
        if (this.stateTime >= C.rollTime) { this.vx *= C.rollExitKeep; this.vz *= C.rollExitKeep; this.setState(PS.IDLE); }
        break;
      }
      case PS.ATTACK: {
        const a = this.attack, tl = attackTimeline(a, this.stateTime), prev = attackTimeline(a, this.stateTime - dt);
        // A fresh hitbox (and hit list) for each strike of the attack.
        if (tl.phase === PHASE.ACTIVE && (prev.phase !== PHASE.ACTIVE || prev.hitIndex !== tl.hitIndex))
          this.hitbox = new Hitbox(this, a.box, this.payload);
        if (tl.phase !== PHASE.ACTIVE) this.hitbox = null;
        const lunging = tl.phase === PHASE.ACTIVE || (tl.phase === PHASE.STARTUP && tl.p > C.lungeStart);
        approachVel(this, lunging ? fx * a.lunge : 0, lunging ? fz * a.lunge : 0, C.accel * dt);
        // Roll out of a swing: a press during wind-up or strike is kept and fires as recovery begins.
        if (tl.phase !== PHASE.RECOVERY) { if (input.consume('roll')) this.rollQueued = true; }
        else if (this.canRoll() && (this.rollQueued || input.consume('roll'))) { this.startRoll(mv); break; }
        if (tl.done) this.setState(PS.IDLE);
        break;
      }
      case PS.BLOCK: {
        const bs = C.walkSpeed * C.blockSpeedMul;
        approachVel(this, mv.x * bs, mv.z * bs, (mv.has ? C.accel : C.decel) * dt);
        // Parry from block only commits if an attack is about to land; otherwise the press is ignored.
        if (input.consume('parry')) {
          if (this.stamina > 0 && enemies.some(e => parryTiming(this, e, CONFIG.parry.arm) !== null)) { this.startParry(); break; }
        }
        if (!input.isHeld('block')) this.setState(PS.IDLE);
        break;
      }
      case PS.PARRY: {
        approachVel(this, 0, 0, C.decel * dt);
        if (this.stateTime >= CONFIG.parry.time) this.setState(PS.IDLE);   // whiffed: recovery over
        break;
      }
      case PS.USE_ITEM: {
        const I = this.usingItem;
        approachVel(this, 0, 0, C.decel * dt);
        if (I.heal) {   // heal spread over [healStart, healStart + healDuration]
          const t0 = this.stateTime - dt, t1 = this.stateTime;
          const healed = clamp(t1 - I.healStart, 0, I.healDuration) - clamp(t0 - I.healStart, 0, I.healDuration);
          this.hp = Math.min(this.maxHp, this.hp + I.heal * healed / I.healDuration);
        }
        if (this.stateTime >= I.useTime) this.setState(PS.IDLE);
        break;
      }
      case PS.REST: {
        approachVel(this, 0, 0, C.decel * dt);
        if (this.stateTime >= CONFIG.rest.time) this.setState(PS.IDLE);
        break;
      }
      case PS.HURT:
      case PS.STAGGER: {
        approachVel(this, 0, 0, C.decel * dt);
        if (this.stateTime >= this.stunTime) {
          if (this.state === PS.STAGGER) this.poise = this.maxPoise;
          this.setState(PS.IDLE);
        }
        break;
      }
      case PS.DEAD: approachVel(this, 0, 0, C.decel * dt); break;
    }
    // Locked on: keep facing the target, except while committed to a roll or a swing already released.
    const released = (this.state === PS.ATTACK && this.attackPhase() !== PHASE.STARTUP) || (this.state === PS.JUMP_ATTACK && this.hitbox);
    if (face !== null && !this.in('noLockFacing') && !released)
      this.yaw = turnToward(this.yaw, Math.atan2(lock.x - this.x, lock.z - this.z), CONFIG.lock.turnRate * dt);

    integrateBody(this, dt, C.knockFriction);
    if (this.y <= 0 && this.in('airborne') && this.vy <= 0 && this.stateTime > 0) this.setState(PS.IDLE);
    if (this.y <= 0 && this.state === PS.JUMP_ATTACK && this.vy <= 0 && this.stateTime > 0) {
      // Touchdown: a swing still in wind-up strikes on impact; the hitbox lingers for impactTime.
      const a = this.attack;
      if (!this.hitbox) this.hitbox = new Hitbox(this, a.box, this.payload);
      this.landHit = false; this.landTime = a.recovery;
      this.vx *= C.landKeep; this.vz *= C.landKeep;
      this.setState(PS.LAND);
      events.emit('land', { x: this.x, z: this.z, fx: a.air.fx });
    }
    this.walkPhase += Math.hypot(this.vx, this.vz) * dt * 2.6;
  }

  // Damage, block, guard break, hurt and stagger from one strike. Returns { blocked, died }.
  takeHit(strike, from) {
    const B = CONFIG.block, C = CONFIG.player;
    const dx = this.x - from.x, dz = this.z - from.z, d = Math.hypot(dx, dz) || 1;
    let damage = strike.damage, poise = strike.poise, knock = strike.knock, blocked = false, guardBroken = false;
    if (this.state === PS.BLOCK && isInFront(this, from.x, from.z)) {
      this.spend(B.staminaBase + strike.damage * B.staminaPerDamage);
      if (this.stamina <= 0) guardBroken = true;
      else { blocked = true; damage *= B.damageMul; poise *= B.poiseMul; knock *= B.knockMul; }
    }
    this.hp = Math.max(0, this.hp - damage);
    this.kx += dx / d * knock; this.kz += dz / d * knock;
    if (blocked) this.brace = 1; else this.tint = 1;
    if (this.hp <= 0) { this.hitbox = null; this.setState(PS.DEAD); return { blocked, died: true }; }
    if (guardBroken) { this.hitbox = null; this.stunTime = B.breakTime; this.poise = this.maxPoise; this.setState(PS.STAGGER); return { blocked: false }; }
    if (blocked) {
      if (poise > 0) { this.poise = Math.max(1, this.poise - poise); this.poiseTimer = 0; }
      return { blocked: true };
    }
    const r = applyPoise(this, poise, this.isCommitted(), this.maxPoise);
    if (r !== POISE.NONE) {   // a jump attack still in its air wind-up is cancelled too
      this.hitbox = null;
      this.stunTime = r === POISE.STAGGER ? C.staggerTime : C.hurtTime;
      this.setState(r === POISE.STAGGER ? PS.STAGGER : PS.HURT);
    }
    return { blocked: false };
  }

  pose(tt, ctx) {
    const r = this.rig, C = CONFIG.player;
    r.reset(); r.setOpacity(1);
    switch (this.state) {
      case PS.IDLE: r.spin.scale.y = 1 + Math.sin(ctx.t * 1.6) * 0.012; r.armL.rotation.z = 0.04; break;
      case PS.WALK: r.walk(this.walkPhase, 0.6); break;
      case PS.JUMP: case PS.FALL:
        r.legL.rotation.x = -0.5; r.legR.rotation.x = 0.3; r.kneeL.rotation.x = 0.9; r.kneeR.rotation.x = 0.5; r.armL.rotation.x = -0.9; r.armR.rotation.x = -0.9; break;
      case PS.ROLL: {
        const p = clamp(tt / C.rollTime, 0, 1), tuck = Math.sin(p * Math.PI);
        r.spin.rotation.x = p * Math.PI * 2;
        r.spin.scale.setScalar(1 - 0.35 * tuck); r.spin.position.y = HIP - 0.4 * tuck;
        r.legL.rotation.x = r.legR.rotation.x = -1.2 * tuck; r.kneeL.rotation.x = r.kneeR.rotation.x = 2.0 * tuck; r.armL.rotation.x = r.armR.rotation.x = -1.2 * tuck;
        break;
      }
      case PS.ATTACK: {
        const tl = attackTimeline(this.attack, tt);
        poseAttack(r, this.attack, tl.phase, tl.p, tl.hitIndex);
        break;
      }
      case PS.JUMP_ATTACK: {
        const a = this.attack;
        if (tt < this.activeAt) poseAttack(r, a, PHASE.STARTUP, tt / a.hits[0].startup);   // wind-up in the air
        else poseAttack(r, a, PHASE.ACTIVE, ease((tt - this.activeAt) / 0.2));            // driving down
        r.legL.rotation.x += -0.7; r.kneeL.rotation.x = 1.1; r.legR.rotation.x += 0.15; r.kneeR.rotation.x = 0.9;
        break;
      }
      case PS.LAND: {
        const k = 1 - ease(tt / Math.max(this.landTime, 0.01));
        poseAttack(r, this.attack, PHASE.ACTIVE, 1);
        r.crouch(0.08 + 0.3 * k); r.lean(0.3 * k);
        break;
      }
      case PS.BLOCK:
        r.walk(this.walkPhase, 0.3 * clamp(Math.hypot(this.vx, this.vz) / 2, 0, 1));   // short guarded steps
        r.armR.rotation.set(-1.45, 0, -0.5); r.weapon.rotation.set(0.2, 0, 1.2); r.armL.rotation.x = -1.3; r.tip.rotation.x = 0.06; break;
      case PS.PARRY: {
        // Quick outward deflection, then an exposed recovery.
        const out = ease(tt / 0.12), back = ease((tt - 0.12) / (CONFIG.parry.time - 0.12));
        const k = out * (1 - back);
        r.armR.rotation.set(lerp(-0.4, -1.7, k), 0, -0.6 * k); r.spin.rotation.y = 0.9 * k;
        r.weapon.rotation.set(lerp(0.5, 0.1, k), 0, 1.0 * k); r.armL.rotation.x = -0.6 * k;
        break;
      }
      case PS.USE_ITEM: {
        const k = Math.sin(clamp(tt / this.usingItem.useTime, 0, 1) * Math.PI);
        r.armL.rotation.set(-2.3 * k, 0, -0.5 * k); r.head.rotation.x = -0.4 * k; break;
      }
      case PS.REST: {
        const k = Math.sin(clamp(tt / CONFIG.rest.time, 0, 1) * Math.PI);
        r.kneel(k); r.lean(0.2 * k); r.head.rotation.x = 0.4 * k; break;
      }
      case PS.HURT: case PS.STAGGER: flinchPose(r, this.state === PS.STAGGER, tt / this.stunTime, tt); break;
      case PS.DEAD: deathPose(r, tt, C.deathFade); break;
    }
    if (this.brace > 0) { r.crouch(0.12 * this.brace); r.tip.rotation.x -= 0.14 * this.brace; }
    r.applyLag(ctx.yaw, Math.hypot(this.vx, this.vz), ctx.dt);
    if (this.state === PS.JUMP_ATTACK && !this.hitbox) r.setWarning(1);   // same telegraph colour as enemy wind-ups
    else r.setFlash(Math.max(this.flash, this.riposte > 0 ? 0.3 : 0));
    r.setTint(HURT_COLOR, this.tint * 0.9);
  }
}

// ============================================================================
// 6. Enemy
// ============================================================================
// opts: x, z, yaw, behavior (a key of BEHAVIORS), notice, leash, homeLeash, path
class Enemy {
  constructor(def, opts) {
    const E = CONFIG.enemy, B = lookup(BEHAVIORS, opts.behavior, 'behaviour', 'gated');
    this.def = def;
    this.rig = new Rig({ scale: def.scale, bulk: def.bulk, color: def.color, weapon: def.weapon, offhand: def.offhand, visual: def.visual });
    this.radius = def.radius; this.height = BODY_HEIGHT * def.scale;
    this.behavior = opts.behavior; this.notice = opts.notice;
    this.leash = opts.leash ?? Infinity; this.homeLeash = opts.homeLeash ?? Infinity;
    this.home = { x: opts.x, z: opts.z, yaw: opts.yaw, state: B.home };
    this.path = opts.path || null; this.pathZ = opts.z; this.pathDir = 1;
    this.x = opts.x; this.y = 0; this.z = opts.z; this.yaw = opts.yaw;
    this.vx = this.vy = this.vz = 0; this.kx = this.kz = 0;
    this.hp = def.hp; this.poise = def.poise; this.poiseTimer = 0; this.tint = 0; this.walkPhase = 0;
    this.posture = 0; this.chainTime = Infinity;   // boss posture and time since the last landed hit
    this.guardMeter = 0; this.guardTime = 0;         // guard or stagger meter, and time since it last filled
    this.crack = 0;                                  // visual: posture-break flash
    this.recoil = 0; this.recoilF = 0; this.recoilS = 0;   // visual: knockback lean in local axes
    this.seed = rand(0, 1000); this.tempo = rand(0.85, 1.2);   // idle personality offsets
    this.rewarded = false;                           // death already announced (souls granted)
    this.training = !!B.training;                    // tutorial dummy: rooted, never dies
    this.immovable = this.training;
    this.discovered = this.training;                 // has had its one-time auto lock-on (dummies never do)
    this.state = B.start; this.stateTime = 0;
    const fd = def.firstDelay || E.firstDelay;
    this.cooldown = rand(fd[0], fd[1]); this.next = null; this.attack = null; this.hitIndex = 0; this.hitbox = null;
    this.savePrev();
  }
  savePrev() { this.px = this.x; this.py = this.y; this.pz = this.z; this.pyaw = this.yaw; }
  setState(s) { this.state = s; this.stateTime = 0; }
  in(group) { return ENEMY_GROUPS[group].has(this.state); }
  alive() { return this.state !== ES.DEAD; }
  awake() { return !this.in('hidden'); }   // visible and engaged enough to be a target
  isCommitted() { return this.state === ES.ACTIVE; }
  // Shield up: guarding enemies hold it whenever they are not attacking, reeling or down.
  // The shield drops as soon as it picks an attack and closes in to use it (and stays down through the swing).
  guarding() {
    if (!this.def.guard || !ENEMY_GROUPS.guarding.has(this.state)) return false;
    // Lowered only in the last stretch before a swing (within reach of the chosen attack, plus a step).
    return !(this.state === ES.CHASE && this.next && this.playerDist <= this.next.range + this.def.guard.lowerReach);
  }
  // Woken by another enemy's alert. Returns true if this changed anything.
  wake() {
    if (this.training || !this.alive()) return false;
    if (this.state === ES.DORMANT) this.setState(ES.RISE);
    else if (this.in('unaware')) this.setState(ES.CHASE);
    else return false;
    return true;
  }

  update(dt, player) {
    const d = this.def, E = CONFIG.enemy;
    this.stateTime += dt;
    this.tint = Math.max(0, this.tint - dt / CONFIG.fx.tintTime);
    this.crack = Math.max(0, this.crack - dt / CONFIG.fx.crackTime);
    this.recoil = Math.max(0, this.recoil - dt / CONFIG.fx.recoilTime);
    this.chainTime += dt;
    if (this.training) { this.updateTraining(dt); return; }
    const M = d.guard || d.stagger;
    if (M && this.state !== ES.BROKEN && (this.guardTime += dt) > M.decayDelay)
      this.guardMeter = Math.max(0, this.guardMeter - M.decay * dt);
    tickPoise(this, dt, E.poiseResetTime, d.poise);
    // Posture holds while the boss is open from a parry, so the riposte window can build on it.
    if (d.posture && this.state !== ES.BROKEN && this.state !== ES.PARRIED && !player.isAttacking())
      this.posture = Math.max(0, this.posture - d.posture.decay * dt);
    const dx = player.x - this.x, dz = player.z - this.z, dist = Math.hypot(dx, dz) || 1e-6;
    this.playerDist = dist;
    const toPlayer = Math.atan2(dx, dz);
    const playerAlive = player.alive();
    const sees = playerAlive && dist < this.notice && !gateBetween(this, player);
    let tx = 0, tz = 0;

    switch (this.state) {
      case ES.IDLE:
        if (sees) this.setState(ES.CHASE);
        break;
      case ES.PATROL: {
        if (sees) { this.setState(ES.CHASE); break; }
        const goal = this.path[this.pathDir > 0 ? 1 : 0], gx = goal - this.x, gz = this.pathZ - this.z, gd = Math.hypot(gx, gz);
        if (gd < 0.3) this.pathDir *= -1;
        else {
          const sp = d.speed * E.patrolSpeedMul;
          tx = gx / gd * sp; tz = gz / gd * sp;
          this.yaw = turnToward(this.yaw, Math.atan2(gx, gz), d.turnRate * dt);
        }
        break;
      }
      case ES.LURK:   // hidden in an alcove until the player passes close
        if (sees) {
          this.yaw = toPlayer; this.vy = E.leapVelocity;
          this.vx = dx / dist * E.leapSpeed; this.vz = dz / dist * E.leapSpeed;
          this.setState(ES.LEAP);
        }
        break;
      case ES.LEAP:
        tx = this.vx; tz = this.vz;
        if (this.stateTime >= E.leapTime && this.y <= 0) { this.cooldown = d.cooldown[0]; this.setState(ES.CHASE); }
        break;
      case ES.DORMANT:   // lying on the floor
        if (sees) this.setState(ES.RISE);
        break;
      case ES.RISE:
        if (this.stateTime >= E.riseTime) { this.cooldown = d.cooldown[0]; this.setState(ES.CHASE); }
        break;
      case ES.RETURN: {   // lost the player: walk back home, then resume the home behaviour
        if (sees) { this.setState(ES.CHASE); break; }
        const hx = this.home.x - this.x, hz = this.home.z - this.z, hd = Math.hypot(hx, hz);
        if (hd < E.homeArrive) { this.yaw = this.home.yaw; this.setState(this.home.state); break; }
        const sp = d.speed * E.returnSpeedMul;
        tx = hx / hd * sp; tz = hz / hd * sp;
        this.yaw = turnToward(this.yaw, Math.atan2(hx, hz), d.turnRate * dt);
        break;
      }
      case ES.CHASE: {
        const farFromHome = Math.hypot(this.x - this.home.x, this.z - this.home.z) > this.homeLeash;
        if (!playerAlive || dist > this.leash || farFromHome || gateBetween(this, player)) { this.next = null; this.setState(ES.RETURN); break; }
        this.yaw = turnToward(this.yaw, toPlayer, d.turnRate * dt);
        this.cooldown -= dt;
        if (this.cooldown <= 0 && !this.next) this.next = d.attacks[Math.floor(Math.random() * d.attacks.length)];
        const want = this.next ? this.next.range : d.holdRange;
        if (dist > want) { tx = dx / dist * d.speed; tz = dz / dist * d.speed; }
        else if (this.next && Math.abs(angDiff(toPlayer, this.yaw)) < E.attackFacing) {
          this.attack = this.next; this.next = null; this.hitIndex = 0; this.setState(ES.WINDUP);
        }
        break;
      }
      case ES.WINDUP: {
        const hit = this.attack.hits[this.hitIndex];
        if (this.stateTime < hit.startup * E.windupTrack) this.yaw = turnToward(this.yaw, toPlayer, d.trackRate * dt);
        if (this.stateTime >= hit.startup) this.strike();
        break;
      }
      case ES.ACTIVE: {
        tx = Math.sin(this.yaw) * this.attack.lunge; tz = Math.cos(this.yaw) * this.attack.lunge;
        this.endStrikeWhenDone();
        break;
      }
      case ES.RECOVER:
        if (this.stateTime >= this.attack.recovery) { this.cooldown = rand(d.cooldown[0], d.cooldown[1]); this.setState(ES.CHASE); }
        break;
      case ES.HURT:
        if (this.stateTime >= d.flinchTime) { this.cooldown = Math.max(this.cooldown, d.cooldown[0]); this.setState(ES.CHASE); }
        break;
      case ES.STAGGER:
        if (this.stateTime >= d.staggerTime) { this.poise = d.poise; this.cooldown = d.cooldown[0]; this.setState(ES.CHASE); }
        break;
      case ES.PARRIED:
        if (this.stateTime >= d.parriedTime) { this.poise = d.poise; this.cooldown = d.cooldown[0]; this.setState(ES.CHASE); }
        break;
      case ES.BROKEN:
        if (this.stateTime >= (d.posture || d.guard || d.stagger).breakTime) { this.posture = 0; this.guardMeter = 0; this.cooldown = d.cooldown[0]; this.setState(ES.CHASE); }
        break;
      case ES.DEAD: break;
    }

    approachVel(this, tx, tz, E.accel * dt);
    integrateBody(this, dt, E.knockFriction);
    this.walkPhase += Math.hypot(this.vx, this.vz) * dt * 2.6 / d.scale;
  }
  // The strike timeline shared by all enemies: windup -> active (per hit) -> recover.
  strike() { this.hitbox = new Hitbox(this, this.attack.box, makeStrike(this.attack)); this.setState(ES.ACTIVE); }
  endStrikeWhenDone() {
    if (this.stateTime < this.attack.hits[this.hitIndex].active) return;
    this.hitbox = null;
    if (this.hitIndex + 1 < this.attack.hits.length) { this.hitIndex++; this.setState(ES.WINDUP); }
    else this.setState(ES.RECOVER);
  }
  // Training dummies stay rooted. The sparring variant loops one slow, telegraphed swing.
  updateTraining() {
    if (!this.def.attacks.length) return;
    switch (this.state) {
      case ES.IDLE: if (this.stateTime >= this.def.restTime) { this.attack = this.def.attacks[0]; this.hitIndex = 0; this.setState(ES.WINDUP); } break;
      case ES.WINDUP: if (this.stateTime >= this.attack.hits[this.hitIndex].startup) this.strike(); break;
      case ES.ACTIVE: this.endStrikeWhenDone(); break;
      case ES.RECOVER: if (this.stateTime >= this.attack.recovery) this.setState(ES.IDLE); break;
      case ES.PARRIED: if (this.stateTime >= this.def.parriedTime) this.setState(ES.IDLE); break;
    }
  }

  // Boss posture: add, and break when full. Returns true if this broke the posture.
  addPosture(amount) {
    const P = this.def.posture;
    if (!P || this.state === ES.BROKEN) return false;
    this.posture = Math.min(P.max, this.posture + amount);
    if (this.posture < P.max) return false;
    this.hitbox = null; this.next = null; this.crack = 1;
    this.setState(ES.BROKEN);
    return true;
  }
  // A successful parry ends the current attack and leaves the enemy open. Returns true on a posture break.
  getParried() {
    this.hitbox = null; this.next = null;
    if (this.def.posture) {
      this.chainTime = 0;   // a parry starts a hit chain: the riposte builds posture straight away
      if (this.addPosture(this.def.posture.parry)) return true;
    }
    this.setState(ES.PARRIED);
    return false;
  }

  // One strike from `from`. Returns { broke (posture), died }.
  takeHit(strike, from) {
    const dx = this.x - from.x, dz = this.z - from.z, d = Math.hypot(dx, dz) || 1;
    const kx = dx / d * strike.knock, kz = dz / d * strike.knock;
    const s = Math.sin(this.yaw), c = Math.cos(this.yaw);
    this.recoil = 1; this.recoilF = (dx * s + dz * c) / d; this.recoilS = (dz * s - dx * c) / d;
    this.tint = 1;
    if (this.training) { this.hp = Math.max(1, this.hp - strike.damage); return { broke: false, died: false }; }   // flash and recoil only
    const def = this.def, P = def.posture;
    if (this.guarding() && Math.abs(angDiff(Math.atan2(from.x - this.x, from.z - this.z), this.yaw)) < def.guard.arc)
      return this.blockHit(strike, kx, kz);
    this.hp = Math.max(0, this.hp - strike.damage * (P && this.state === ES.BROKEN ? P.damageMul : 1));
    this.kx += kx; this.kz += kz;
    if (this.hp <= 0) { this.hitbox = null; this.next = null; this.setState(ES.DEAD); return { broke: false, died: true }; }
    if (P) {
      // Bosses ignore interrupts; only chained hits build posture.
      const chained = this.chainTime <= P.chainGap;
      this.chainTime = 0;
      if (this.in('unaware') || this.state === ES.DORMANT) this.setState(ES.CHASE);
      return { broke: chained && this.addPosture(strike.postureDmg), died: false };
    }
    if (this.in('shrugsHits') || this.state === ES.BROKEN) return { broke: false, died: false };   // a broken guard: no flinch
    if (this.state === ES.DORMANT) { this.setState(ES.RISE); return { broke: false, died: false }; }
    const unaware = this.in('unaware');
    const M = def.stagger || def.guard;
    if (M) {   // stagger/guard meter instead of poise: hits never interrupt until the meter fills
      if (unaware) this.setState(ES.CHASE);
      return { broke: this.fillMeter(M, strike.attackId), died: false };
    }
    const r = applyPoise(this, strike.poise, this.isCommitted(), def.poise);
    if (r === POISE.STAGGER) { this.hitbox = null; this.next = null; this.setState(ES.STAGGER); }
    else if (r === POISE.FLINCH && def.flinchTime > 0 && this.in('canFlinch')) this.setState(ES.HURT);
    else if (unaware) this.setState(ES.CHASE);
    return { broke: false, died: false };
  }

  // A strike taken on the shield: reduced damage, little push, and it fills the guard meter
  // (heavy attacks more than light ones). A full meter breaks the guard.
  blockHit(strike, kx, kz) {
    const G = this.def.guard;
    this.hp = Math.max(0, this.hp - strike.damage * G.damageMul);
    this.kx += kx * G.knockMul; this.kz += kz * G.knockMul;
    this.tint = 0.3;
    if (this.hp <= 0) { this.hitbox = null; this.next = null; this.setState(ES.DEAD); return { broke: false, died: true }; }
    if (this.in('unaware')) this.setState(ES.CHASE);
    if (this.fillMeter(G, strike.attackId, G.blockedMul)) return { broke: true, died: false };
    return { broke: false, died: false, blocked: true };
  }
  // Shared by the shield guard and the stagger meter (`guardMeter` holds either): heavy attacks fill
  // more than light ones; a full meter breaks the enemy (kneels, open) for M.breakTime. Returns true on a break.
  fillMeter(M, attackId, mul = 1) {
    this.guardTime = 0;
    this.guardMeter = Math.min(M.max, this.guardMeter + (M.breakers.includes(attackId) ? M.heavy : M.light) * mul);
    if (this.guardMeter < M.max - 1e-6) return false;
    this.hitbox = null; this.next = null; this.crack = 1;
    this.setState(ES.BROKEN);
    return true;
  }

  // Idle personality layered on top of the base pose, weighted by how idle the enemy is.
  idleLayer(r, ctx, w) {
    if (w <= 0.001) return;
    const t = ctx.t * this.tempo + this.seed;
    // Head turns toward the player now and then.
    const look = ease((Math.sin(t * 0.37) - 0.2) * 1.5);
    const rel = angDiff(Math.atan2(ctx.px - this.x, ctx.pz - this.z), this.yaw);
    r.head.rotation.y += clamp(rel, -1.0, 1.0) * look * w;
    lookup(IDLE_STYLES, this.def.idle || 'none', 'idle style', 'none')(r, t, w);
  }

  pose(tt, ctx) {
    const r = this.rig, d = this.def, E = CONFIG.enemy;
    r.reset(); r.setOpacity(1); r.root.visible = true;
    let warn = 0;
    const a = this.attack;
    switch (this.state) {
      case ES.CHASE: case ES.PATROL: case ES.RETURN: r.walk(this.walkPhase, 0.5); break;
      case ES.LURK:
        r.crouch(0.38); r.tip.rotation.x = 0.3; r.armL.rotation.x = -0.9; r.armR.rotation.x = -0.7; break;
      case ES.LEAP: r.legL.rotation.x = -0.9; r.kneeL.rotation.x = 1.2; r.legR.rotation.x = 0.4; r.kneeR.rotation.x = 0.6; r.armR.rotation.x = -2.2; r.armL.rotation.x = -1.2; r.tip.rotation.x = 0.3; break;
      case ES.DORMANT: r.tip.rotation.x = -Math.PI / 2; r.armL.rotation.x = r.armR.rotation.x = -0.3; break;
      case ES.RISE: {
        const p = ease(tt / E.riseTime);
        r.tip.rotation.x = -Math.PI / 2 * (1 - p); r.legL.rotation.x = -1.2 * Math.sin(p * Math.PI);
        r.kneeL.rotation.x = 1.6 * Math.sin(p * Math.PI); r.armR.rotation.x = lerp(-0.3, -0.4, p); break;
      }
      case ES.WINDUP:
        poseAttack(r, a, PHASE.STARTUP, tt / a.hits[this.hitIndex].startup, this.hitIndex);
        warn = clamp(tt / CONFIG.fx.windupGlowTime, 0, 1);
        break;
      case ES.ACTIVE: poseAttack(r, a, PHASE.ACTIVE, tt / a.hits[this.hitIndex].active, this.hitIndex); break;
      case ES.RECOVER: poseAttack(r, a, PHASE.RECOVERY, tt / a.recovery, this.hitIndex); break;
      case ES.HURT: flinchPose(r, false, tt / d.flinchTime, tt); break;
      case ES.STAGGER: flinchPose(r, true, tt / d.staggerTime, tt); break;
      case ES.PARRIED: {
        // Weapon knocked wide, torso thrown back, slow to recover.
        const k = 1 - ease((tt - d.parriedTime * 0.6) / (d.parriedTime * 0.4));
        r.tip.rotation.x = -0.38 * k; r.spin.rotation.y = 0.7 * k; r.spin.rotation.z = Math.sin(tt * 7) * 0.08 * k;
        r.armR.rotation.set(lerp(-0.4, -2.5, k), 0, -0.9 * k); r.armL.rotation.x = lerp(-0.1, 0.5, k); break;
      }
      case ES.BROKEN: {
        // Sinks to one knee, club on the floor, then hauls itself back up.
        const T = (d.posture || d.guard || d.stagger).breakTime, k = ease(tt / 0.4) * (1 - ease((tt - T + 0.6) / 0.6));
        r.kneel(k); r.lean(0.3 * k);
        r.armR.rotation.x = lerp(-0.4, 0.1, k); r.weapon.rotation.x = lerp(0.5, 1.4, k); r.head.rotation.x = 0.4 * k;
        r.spin.rotation.z = Math.sin(tt * 5) * 0.04 * k; break;
      }
      case ES.DEAD: deathPose(r, tt, E.deathFade); r.root.visible = tt < E.deathFade; break;
    }
    if (this.guarding()) { r.armL.rotation.x = -0.75; r.armL.rotation.z = -0.25; }   // shield held up in front
    // Blend idle personality in and out so aggro never pops.
    r.idleW += ((IDLE_BLEND[this.state] || 0) - r.idleW) * (1 - Math.exp(-CONFIG.fx.idleBlendRate * ctx.dt));
    if (this.alive() && this.state !== ES.DORMANT && !this.training) this.idleLayer(r, ctx, r.idleW);
    if (this.recoil > 0) {
      const k = Math.sin(this.recoil * Math.PI) * CONFIG.fx.recoilLean;
      r.tip.rotation.x += this.recoilF * k; r.tip.rotation.z += this.recoilS * k * 0.8;
    }
    r.applyLag(ctx.yaw, Math.hypot(this.vx, this.vz), ctx.dt);
    r.setWarning(warn);
    if (this.crack > 0) r.setTint(CRACK_COLOR, this.crack * 1.6);
    else r.setTint(HIT_COLOR, this.tint * 0.8);
  }
}

// ============================================================================
// 7. Hitbox helper
// ============================================================================
// What a landed attack carries, built the same way for both sides.
function makeStrike(attack, riposte = false) {
  const E = CONFIG.enemy, R = (riposte && attack.riposte) || {};
  const hitstop = attack.hitstop ?? clamp(E.hitstopBase + attack.damage * E.hitstopScale, 0, E.hitstopMax);
  return {
    attackId: attack.id, air: !!attack.air, riposte,
    damage: attack.damage * (R.damage || 1), poise: attack.poise * (R.poise || 1),
    knock: attack.knock, postureDmg: attack.postureDmg || 0,
    hitstop: hitstop * (riposte ? CONFIG.parry.riposteHitstop : 1),
  };
}
// An oriented box in the owner's frame, tested against a target's upright body cylinder.
class Hitbox {
  constructor(owner, box, payload) { this.owner = owner; this.box = box; this.payload = payload; this.hit = new Set(); }
  center() {
    const o = this.owner, b = this.box;
    return { x: o.x + Math.sin(o.yaw) * b.fwd, y: o.y + b.y, z: o.z + Math.cos(o.yaw) * b.fwd };
  }
  overlaps(target) {
    if (this.hit.has(target)) return false;
    const o = this.owner, b = this.box, s = Math.sin(o.yaw), c = Math.cos(o.yaw);
    const dx = target.x - o.x, dz = target.z - o.z;
    const lz = dx * s + dz * c - b.fwd, lx = dz * s - dx * c;
    const ex = lx - clamp(lx, -b.w / 2, b.w / 2), ez = lz - clamp(lz, -b.d / 2, b.d / 2);
    if (ex * ex + ez * ez > target.radius * target.radius) return false;
    const y0 = o.y + b.y - b.h / 2, y1 = o.y + b.y + b.h / 2;
    return y1 > target.y && y0 < target.y + target.height;
  }
  markHit(target) { this.hit.add(target); }
}

// ============================================================================
// 8. resolveCombat
// ============================================================================
// Seconds until enemy e's current strike goes active (negative once active) if the player could parry
// it now, allowing `extra` s of look-ahead; null if the strike is not parryable from here.
function parryTiming(p, e, extra) {
  const P = CONFIG.parry;
  let rem;
  if (e.state === ES.WINDUP) rem = e.attack.hits[e.hitIndex].startup - e.stateTime;
  else if (e.state === ES.ACTIVE) rem = -e.stateTime;
  else return null;
  if (rem > P.lead + extra || rem < -P.grace) return null;
  if (!isInFront(p, e.x, e.z) || gateBetween(p, e)) return null;   // same front rule as blocking
  const b = e.attack.box;
  if (Math.hypot(e.x - p.x, e.z - p.z) > b.fwd + b.d / 2 + p.radius + P.reach) return null;
  return rem;
}

// Order each step: parry, then player hitboxes against enemies, then enemy hitboxes against the player.
// Damage itself lives in Player.takeHit / Enemy.takeHit; effects and souls listen to the events.
function resolveCombat(game) {
  const p = game.player, P = CONFIG.parry;
  const live = game.enemies.filter(e => e.alive());
  const contact = (hb, target) => {
    const c = hb.center();
    return { x: (c.x + target.x) / 2, y: clamp(c.y, target.y + 0.3, target.y + target.height - 0.2), z: (c.z + target.z) / 2 };
  };
  // 0. Parry, before any damage: only the strike that lands first is parried.
  if (p.state === PS.PARRY && p.stateTime <= P.arm) {
    let target = null, soonest = Infinity;
    for (const e of live) { const t = parryTiming(p, e, 0); if (t !== null && t < soonest) { soonest = t; target = e; } }
    if (target) {
      const broke = target.getParried();
      p.stamina = Math.min(p.maxStamina, p.stamina + P.cost);   // a successful parry is free
      p.staminaDelay = 0; p.riposte = P.riposteTime; p.flash = 1;
      p.setState(PS.IDLE);
      game.hitstop = Math.max(game.hitstop, P.hitstop);
      events.emit('parry', { target });
      if (broke) { game.hitstop = Math.max(game.hitstop, target.def.posture.hitstop); events.emit('postureBreak', { enemy: target }); }
    }
  }
  // 1. Player hitboxes against enemy bodies.
  const playerHits = p.hitbox ? live.filter(e => p.hitbox.overlaps(e) && !gateBetween(p, e)) : [];
  // 2. Enemy hitboxes against the player's body.
  const enemyHits = p.alive() ? live.filter(e => e.hitbox && e.hitbox.overlaps(p) && !gateBetween(e, p)).map(e => e.hitbox) : [];
  // 3. Apply damage, poise loss, knockback and stagger.
  for (const e of playerHits) {
    const strike = p.hitbox.payload;
    p.hitbox.markHit(e);
    const res = e.takeHit(strike, p);
    game.hitstop = Math.max(game.hitstop, res.blocked ? CONFIG.block.hitstop : strike.hitstop);
    events.emit('strike', { strike, attacker: p, target: e, at: contact(p.hitbox, e), blocked: !!res.blocked });
    if (res.broke) { game.hitstop = Math.max(game.hitstop, (e.def.posture || e.def.guard || e.def.stagger).hitstop); events.emit('postureBreak', { enemy: e }); }
  }
  for (const hb of enemyHits) {
    if (p.invulnerable() || !p.alive()) continue;   // a dodged swing stays live: it can catch the end of a roll
    hb.markHit(p);
    const res = p.takeHit(hb.payload, hb.owner);
    game.hitstop = Math.max(game.hitstop, res.blocked ? CONFIG.block.hitstop : hb.payload.hitstop);
    events.emit('strike', { strike: hb.payload, attacker: hb.owner, target: p, at: contact(hb, p), blocked: res.blocked });
  }
}

// Bodies cannot overlap; enemies barely give way to the player, and dummies never do.
function separatePair(a, b, shareA) {
  if (b.immovable) shareA = 1; else if (a.immovable) shareA = 0;
  if (!a.alive() || !b.alive() || Math.abs(a.y - b.y) >= Math.min(a.height, b.height)) return;
  const dx = a.x - b.x, dz = a.z - b.z, d = Math.hypot(dx, dz), min = a.radius + b.radius;
  if (d >= min) return;

function seeded(seed) {

    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);

function makeNoise(seed) {

    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(seed, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  };

    const ix = Math.floor(x), iy = Math.floor(y), fx = ease(x - ix), fy = ease(y - iy), m = v => ((v % p) + p) % p;
    return lerp(lerp(hash(m(ix), m(iy)), hash(m(ix + 1), m(iy)), fx), lerp(hash(m(ix), m(iy + 1)), hash(m(ix + 1), m(iy + 1)), fx), fy);

    return s / n;
  };
}

// One RGB texture per pattern: R = albedo detail (per-slab shade x fine noise), G = joints and cracks,
// B = large blotches (where moss, grime and rust gather). Built once at load.
function makeSurfaceTexture(name) {

  const rnd = seeded(strSeed(name)), fbm = makeNoise(strSeed(name) & 0xffff);

  const g = jc.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, N, N); g.lineCap = 'round';
  const shade = new Float32Array(N * N).fill(1);
  const line = (x0, y0, x1, y1) => {   // drawn 9 times so it wraps across the tile edges
    for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]) { g.beginPath(); g.moveTo(x0 + ox, y0 + oy); g.lineTo(x1 + ox, y1 + oy); g.stroke(); }
  };
  if (P.rows) {   // courses of blocks or flagstones: each slab its own shade, joints drawn soft then sharp
    for (let y0 = 0; y0 < N;) {
      let h = Math.round(between(rnd, P.rows) * N);
      if (N - y0 - h < P.rows[0] * N * 0.6) h = N - y0;
      const start = rnd() * N, cuts = [];
      for (let x = start; x < start + N - P.slab[0] * N * 0.5; x += between(rnd, P.slab) * N) cuts.push(x % N);
      cuts.sort((a, b) => a - b);
      const vals = cuts.map(() => between(rnd, P.shade)), tilt = cuts.map(() => (rnd() - 0.5) * 6 * px);
      for (const [w, a] of [[P.joint * 4, 0.22], [P.joint, 0.9]]) {
        g.lineWidth = w * px; g.strokeStyle = `rgba(255,255,255,${a})`;
        line(0, y0, N, y0);
        cuts.forEach((cx, i) => line(cx, y0, cx + tilt[i], y0 + h));
      }
      for (let x = 0; x < N; x++) {
        let i = 0; while (i < cuts.length && cuts[i] <= x) i++;
        const v = vals[(i + cuts.length - 1) % cuts.length];   // before the first cut: the slab that wraps round
        for (let y = y0; y < y0 + h; y++) shade[y * N + x] = v;

    if (len < 6 * px || w < 0.5) return;

  for (let i = 0; i < (P.streaks || 0); i++) {   // metal: faint vertical runs (rust streaks, scratches)
    g.lineWidth = (0.5 + rnd() * 1.5) * px; g.strokeStyle = `rgba(255,255,255,${0.1 + rnd() * 0.25})`;
    const x = rnd() * N, y = rnd() * N; line(x, y, x + (rnd() - 0.5) * 4 * px, y + (20 + rnd() * 120) * px);

  function addSilhouettes(G, rnd, layers) {
    const S = VIS.silhouettes, dark = new THREE.Color(S.dark);
    for (let i = 0; i < layers; i++)
      G.add(new THREE.Mesh(silhouetteGeometry(rnd, S.radii[i]), new THREE.MeshBasicMaterial({ color: scene.fog.color.clone().lerp(dark, S.mix[i]), fog: false })));
  }
  // Static level boxes (walls, floor seams, pillars, logs...) merged into one mesh per material: hundreds
  // of draw calls become a handful. Collision never used these meshes (it reads the level data), and
  // moving parts (gates, flames, bonfire cores) are left alone.
  function mergeStatic(G, keep) {
    G.updateMatrixWorld(true);
    const byMat = new Map(), merged = [];
    G.traverse(o => {
      if (!o.isMesh || o.isInstancedMesh || keep.has(o) || !o.geometry.index || !o.geometry.attributes.uv) return;
      for (let a = o.parent; a && a !== G; a = a.parent) if (keep.has(a)) return;
      if (!byMat.has(o.material)) byMat.set(o.material, []);
      byMat.get(o.material).push(o);
    });
    for (const [mat, list] of byMat) {
      if (list.length < 2) continue;
      const geos = list.map(o => {
        const g = o.geometry.clone().applyMatrix4(o.matrixWorld);
        for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
        return g;
      });
      const geo = mergeGeometries(geos);
      geos.forEach(g => g.dispose());
      if (!geo) continue;
      for (const o of list) { o.parent.remove(o); o.geometry.dispose(); }
      merged.push(new THREE.Mesh(geo, mat));
    }
    for (const m of merged) G.add(m);
  }
  // A gate lifts as one piece: merge its bars and rails in the gate's own space.
  function mergeGate(g) {
    const list = g.children.filter(o => o.isMesh);
    if (list.length < 2) return;
    const geo = mergeGeometries(list.map(o => { o.updateMatrix(); return o.geometry.clone().applyMatrix4(o.matrix); }));
    if (!geo) return;
    for (const o of list) { g.remove(o); o.geometry.dispose(); }
    g.add(new THREE.Mesh(geo, list[0].material));
  }
  function insideLevel(x, z) {
    if (def.layout === 'rooms') return insideRooms(def.rooms, x, z, 0.4);
    if (def.layout === 'hall') return x > 0.5 && x < def.length - 0.5 && Math.abs(z) < def.halfZ - 0.3;
    return false;
  }

  return {
    qualityLabel: name => (Q[name] || Q[VIS.defaultQuality]).label,
    nextQuality(name, d) { const k = Object.keys(Q), i = Math.max(0, k.indexOf(name)); return k[(i + d + k.length * 2) % k.length]; },
    setQuality(name) {
      quality = Q[name] || Q[VIS.defaultQuality];
      bloom.enabled = quality.bloom;
      grade.uniforms.uVig.value = quality.vignette ? VIS.vignette.strength : 0;
      grade.uniforms.uVigSoft.value = VIS.vignette.softness;
      grade.uniforms.uGrain.value = quality.grain ? VIS.grain.amount : 0;
      this.resize(window.innerWidth, window.innerHeight);
      applyCounts();
      if (Game.mode === 'pause' && stage) this.draw();   // show the change behind the options menu
    },
    resize(w, h) {
      w = Math.max(1, w); h = Math.max(1, h);
      const pr = Math.min(window.devicePixelRatio || 1, quality.maxPixelRatio);
      renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
      composer.setPixelRatio(pr); composer.setSize(w, h);
      grade.uniforms.uRes.value.set(w * pr, h * pr);
      PT_SCALE.value = h * pr / (2 * Math.tan(THREE.MathUtils.degToRad(CONFIG.camera.fov) / 2));
    },
    // Called once per stage build (loadStage), after applyAtmosphere. Everything added goes in the stage group.
    dressStage(d, built) {
      def = d; A = d.atmosphere || {}; st = { bonfires: [] };
      decals.clear(); debris.clear(); stainGlow = null;
      const G = built.group, rnd = seeded(strSeed(d.id)), pools = [];
      G.traverse(o => { if (o.isMesh && o.material && o.material.isMeshStandardMaterial) weather(o.material, 'stone'); });   // room materials
      dressFlames(G, d, pools);
      for (const b of d.bonfires || []) st.bonfires.push(dressBonfire(G, b, pools));
      if (d.layout === 'hall') dressHall(G, d, rnd, pools);
      else if (d.layout === 'rooms') dressRooms(G, d, rnd, pools);
      else dressArena(G, d, rnd);
      if (A.sky) st.sky = addSky(G, A.sky);
      if (A.silhouettes) addSilhouettes(G, rnd, A.silhouettes);
      if (pools.length) G.add(poolMesh(pools));
      for (const g of built.gates) mergeGate(g.mesh);
      mergeStatic(G, new Set([...built.gates.map(g => g.mesh), ...flames.filter(f => f.group === G).map(f => f.mesh),
                              ...st.bonfires.map(b => b.core), ...(st.sky ? [st.sky] : [])]));
      applyLook();
    },
    render(game, t, dt) {
      vTime.value = t;
      ash.material.uniforms.uCam.value.copy(camera.position);
      if (st.sky) st.sky.position.copy(camera.position);
      const B = VIS.bonfire;
      for (const f of st.bonfires) {   // slow breathing glow; a soft flare after resting
        f.flare = Math.max(0, f.flare - dt / B.flareTime);
        const fl = ease(f.flare), pulse = 1 + Math.sin(t * Math.PI * 2 / B.pulsePeriod + f.b.x) * B.pulse;
        if (f.light) f.light.intensity *= pulse * (1 + fl * B.flareLight);   // the flame flicker set it fresh this frame
        f.core.scale.setScalar(pulse * (1 + fl * B.flareCore)); f.core.scale.y *= 0.6;
        f.core.material.color.copy(f.coreColor).multiplyScalar(pulse * (1 + fl));
        f.embers.material.uniforms.uFlare.value = fl;
      }
      if (stainGlow) {
        if (!game.stain || game.stain.group !== stainGlow.parent) { stainGlow.material.dispose(); stainGlow = null; }
        else stainGlow.material.opacity = 0.55 + Math.sin(t * VIS.stainGlow.rate) * 0.3;
      }
      decals.update(dt);
      const D = VIS.debris, p = game.player;
      if (A.debris && quality.debris && p && p.alive() && def.layout !== 'arena') {
        debrisTimer -= dt;
        if (debrisTimer <= 0) {
          debrisTimer = D.interval / A.debris * rand(0.5, 1.5);
          const a = rand(0, Math.PI * 2), r = rand(2, D.radius), x = p.x + Math.cos(a) * r, z = p.z + Math.sin(a) * r;
          if (insideLevel(x, z)) for (let i = 0, n = 1 + Math.floor(rand(0, 3)); i < n; i++)
            debris.drop(x + rand(-0.4, 0.4), def.wallHeight - 0.3, z + rand(-0.4, 0.4), rand(0.05, 0.14));
        }
      }
      debris.update(dt);
      const V = VIS.vignette, want = p && p.alive() ? clamp((V.lowHealthAt - p.hp / p.maxHp) / V.lowHealthAt, 0, 1) : 0;
      lowHp += (want - lowHp) * (1 - Math.exp(-V.lowHealthRate * dt));
      this.draw();
    },
    draw() {
      if (!quality.post) { renderer.render(scene, camera); return; }
      grade.uniforms.uTime.value = vTime.value; grade.uniforms.uLow.value = quality.vignette ? lowHp : 0;
      composer.render();
    },
    // Event reactions (registerVisualListeners).
    blood(at, size, burst = true) {
      const B = VIS.blood;
      if (burst) spawnBurst(at, B.burst);
      decals.splat(at.x + rand(-B.spread, B.spread), at.z + rand(-B.spread, B.spread), between(Math.random, B.size) * size);
    },
    markStain(game) {
      if (!game.stain) return;
      const S = VIS.stainGlow;
      if (stainGlow) stainGlow.material.dispose();
      stainGlow = glowSprite(S.color, S.boost, S.size, 0.6, 0.8);
      stainGlow.position.y = S.height; game.stain.group.add(stainGlow);
    },
    flare(bonfire) { const f = st.bonfires.find(f => f.b === bonfire); if (f) f.flare = 1; },
    gateDust(g) {
      if (!quality.debris || !def || def.layout === 'arena') return;
      for (let i = 0; i < VIS.debris.gateBurst; i++) {
        const x = g.box ? rand(g.box.x0, g.box.x1) : g.x + rand(-0.3, 0.3), z = g.box ? rand(g.box.z0, g.box.z1) : rand(-def.halfZ, def.halfZ) * 0.9;
        debris.drop(x, def.gateHeight + rand(0, 1.2), z, rand(0.05, 0.12));
      }
    },
  };
})();

// Visual reactions to game events. Read-only: they never touch combat state.
function registerVisualListeners() {
  const chest = b => ({ x: b.x, y: b.y + b.height * 0.55, z: b.z });
  events.on('strike', d => { if (!d.blocked && !d.target.training) visuals.blood(d.at, 1); });
  events.on('enemyDeath', d => { if (!d.enemy.training) visuals.blood({ x: d.enemy.x, y: 0.2, z: d.enemy.z }, VIS.blood.deathSize, false); });
  events.on('playerDeath', d => { visuals.blood(chest(d.player), VIS.blood.deathSize); visuals.markStain(Game); });
  events.on('rest', d => visuals.flare(d.bonfire));
  events.on('gateOpened', d => visuals.gateDust(d.gate));
}

const $ = id => document.getElementById(id);
// A bar that drops at once but drains its trailing highlight slowly.
const trailToward = (trail, value, dt) => value > trail ? value : Math.max(value, trail - dt * CONFIG.fx.trailDrain);
const hud = {
  root: $('hud'), pHp: $('pHpFill'), pTrail: $('pHpTrail'), pSt: $('pStFill'), flaskRow: $('pFlasks'), flasks: [],
  soulsN: $('pSoulsN'),
  eBars: $('eBars'), eHp: $('eHpFill'), eTrail: $('eHpTrail'), eName: $('eName'), ePost: $('ePost'), ePostFill: $('ePostFill'),
  died: $('died'), won: $('won'), complete: $('complete'), rested: $('rested'), prompt: $('prompt'), confirm: $('confirm'),
  tutPrompt: $('tutPrompt'), tutStep: $('tutStep'), tutText: $('tutText'), tutDone: $('tutDone'),
  help: $('help'), toggle: $('hbToggle'),
  pTrailV: 1, eTrailV: 1, target: null, restedTimer: 0, lastPosture: 0, postFlash: 0,
  // Texts built from the live key bindings and the current level.
  buildTexts(game) {
    const rows = [
      ['Move', moveLabel()], ['Camera', 'Mouse (click the view to capture it)'],
      ['Jump', bindLabel('jump')], ['Roll', bindLabel('roll')],
      ['Light attack', bindLabel('light')], ['Heavy attack', bindLabel('heavy')],
      ['Jump attack', 'Light or heavy while airborne'],
      ['Block (hold)', `[ ${ACTIONS.block.map(keyLabel).filter((v, i, a) => a.indexOf(v) === i).join(' / ')} ]`],
      ['Parry', `${bindLabel('parry')} just before the blow lands`],
      ['Lock-on', bindLabel('lock')], ['Switch target', `${bindLabel('switchTarget')} while locked on`],
      ['Zoom in / out', `${bindLabel('zoomIn', 'Wheel up')} ${bindLabel('zoomOut', 'Wheel down')}`],
      ['Rest at bonfire', bindLabel('rest')], ['Use flask', bindLabel('flask')],
      ['Restart', `${systemLabel('restart')} twice`], ['Pause', systemLabel('pause')], ['Help', systemLabel('help')],
    ];
    const table = $('helpTable'); table.textContent = '';
    for (const [k, v] of rows) {
      const tr = table.insertRow(); tr.insertCell().textContent = k; tr.insertCell().textContent = v;
    }
    $('hbLabel').textContent = `Show hitboxes ${systemLabel('hitboxes')}`;
    $('helpLevel').textContent = game.level ? game.level.help || '' : '';
    $('helpWarn').textContent = ACTIONS.block.some(c => c.startsWith('Control'))
      ? `Prefer ${keyLabel(ACTIONS.block[0])} for blocking: the browser reserves Ctrl+W (close tab) and it cannot be overridden.` : '';
    $('helpHint').textContent = `${keyLabel(SYSTEM_KEYS.help)}: help`;
    $('wonHint').textContent = `${systemLabel('restart')} to fight again · ${systemLabel('pause')} to pause`;
    const next = game.level && game.level.next && LEVELS.find(l => l.id === game.level.next);
    $('completeHint').textContent = next ? `Onward to ${next.name}…`
      : `${systemLabel('restart')} to restart · ${systemLabel('pause')} to pause and leave`;

    this.confirm.textContent = `Press ${systemLabel('restart')} again to restart from the beginning`;
  },
  reset(game) {
    this.pTrailV = this.eTrailV = 1; this.target = null; this.restedTimer = 0;
    for (const el of [this.died, this.won, this.complete, this.rested]) el.classList.remove('show');
    this.buildTexts(game);
  },
  showRested() { this.restedTimer = CONFIG.rest.messageTime; },
  // Flask icons follow the inventory's capacity, so upgrades show.
  syncFlasks(it) {

    while (this.flasks.length > it.max) this.flasks.pop().remove();

  // Overhead bars: one per engaged, non-boss enemy in sight. Bosses use the big bar at the top instead.
  tagRoot: $('eTags'), tags: [], tagPos: new THREE.Vector3(),
  updateTags(game, dt) {
    const p = game.player, v = this.tagPos, F = CONFIG.fx;
    const w = window.innerWidth, h = window.innerHeight;
    camera.updateMatrixWorld();
    let n = 0;
    for (const e of game.enemies) {
      if (!e.alive() || !e.awake() || e.training || e.def.posture) continue;
      if (e.in('unaware') && e.hp >= e.def.hp && e !== game.lock) continue;   // untouched and unaware: no bar yet
      const q = e.rig.root.position;
      if (Math.hypot(q.x - p.x, q.z - p.z) > F.tagRange || gateBetween(p, e)) continue;
      v.set(q.x, q.y + e.height + F.tagGap, q.z).project(camera);

        t.gEl.classList.toggle('broken', broken);

      t.el.classList.toggle('locked', e === game.lock);

    }
