<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combat Arena 3D</title>
<style>
  :root { --hud: 1; --died-delay: 0.6s; --died-fade: 2.2s; --died-hint-delay: 2.6s; --dying-fade: 1.4s; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060a; color: #cfc6ad;
    font-family: Georgia, 'Times New Roman', serif; user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; transition: filter 0.6s; }
  canvas#view.dying { filter: grayscale(1) brightness(0.75); transition: filter var(--dying-fade); }

  #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, #17131a 0%, #07060a 75%); z-index: 10; }
  #menu.overlay { background: #07060ab8; }
  #menu.hidden { display: none; }
  #menuBox { border: 2px solid #7d6a3a; padding: 34px 44px 26px; background: #0d0b10; min-width: 420px;
    max-width: 90vw; box-shadow: 0 0 60px #000; }
  #menuBox h1 { margin: 0 0 6px; text-align: center; letter-spacing: 6px; font-weight: normal;
    font-size: 30px; color: #b79d5c; }
  #menuBox .sub { text-align: center; font-size: 13px; color: #6f6753; margin-bottom: 22px; letter-spacing: 2px; min-height: 1em; }
  .menuBtn { display: block; width: 100%; box-sizing: border-box; margin: 10px 0; padding: 12px 16px;
    text-align: left; background: #15121a; border: 1px solid #3a3226; color: #cfc6ad; cursor: pointer;
    font-family: inherit; }
  .menuBtn .n { font-size: 19px; letter-spacing: 2px; }
  .menuBtn .d { font-size: 13px; color: #857c66; margin-top: 3px; }
  .menuBtn .d:empty { display: none; }
  .menuBtn:hover, .menuBtn.sel { background: #262017; border-color: #b79d5c; color: #f0e3bd; }
  .menuBtn.sel .n::before { content: '\25B8  '; color: #b79d5c; }
  #menuBox .hint { text-align: center; font-size: 12px; color: #6f6753; margin-top: 18px; }
  #menuBox .notice { text-align: center; font-size: 17px; line-height: 1.7; color: #d9cda8; margin: 20px 0 8px; white-space: pre-line; }
  #menuBox .notice:empty { display: none; }
  #version { position: absolute; right: 10px; bottom: 6px; font-size: 10px; letter-spacing: 1px; color: #4e473a; pointer-events: none; }

  #fade { position: fixed; inset: 0; z-index: 8; background: #000; opacity: 0; pointer-events: none; transition: opacity var(--fade-time, 1s); }
  #fade.show { opacity: 1; }
  #bootError { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: #07060af0; }
  #bootError.hidden { display: none; }
  #bootError .box { border: 2px solid #8a3a2a; background: #120c0d; padding: 26px 34px; max-width: 640px; }
  #bootError h2 { margin: 0 0 12px; font-weight: normal; letter-spacing: 4px; color: #d0705a; font-size: 20px; }
  #bootError .msg { white-space: pre-line; font-size: 14px; line-height: 1.55; color: #d9cda8; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud.hidden { display: none; }
  /* HUD: dark, minimal, gilt hairlines. Every bar sits on a near-black plate with a dark outline, so it reads
     on bright skies and in black corridors alike. */
  .bar { position: relative; background: linear-gradient(#060506f0, #120f0ef0); border: 1px solid #6e5d36; overflow: hidden;
    box-shadow: 0 0 0 1px #000000d0, inset 0 0 0 1px #00000080, 0 2px 8px #000000a0; }
  .bar > div { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; }
  .bar::after { content: ''; position: absolute; inset: 0; pointer-events: none;   /* faint sheen over the fill */
    background: linear-gradient(#ffffff22, #ffffff00 45%, #00000040); }
  #pBars { position: absolute; left: 30px; top: 22px; padding-left: 12px; transform: scale(var(--hud)); transform-origin: top left; }
  #pBars::before { content: ''; position: absolute; left: 0; top: -4px; height: 40px; width: 1px;   /* gilt spine */
    background: linear-gradient(#c9a85e00, #c9a85e 30%, #c9a85e 70%, #c9a85e00); }
  #pBars::after { content: ''; position: absolute; left: -3px; top: 9px; width: 6px; height: 6px; transform: rotate(45deg);
    background: #c9a85e; box-shadow: 0 0 6px #000; }
  #pHp { width: min(320px, 24vw); height: 13px; }
  #pSt { width: min(260px, 20vw); height: 8px; margin-top: 5px; }
  #pFlasks { margin-top: 14px; height: 18px; }
  .flask { display: inline-block; position: relative; width: 11px; height: 14px; margin-right: 7px; vertical-align: bottom;
    border: 1px solid #5d5132; border-radius: 3px 3px 6px 6px; background: #0d0b0a; box-shadow: 0 0 0 1px #000c; }
  .flask::before { content: ''; position: absolute; left: 3px; top: -5px; width: 3px; height: 4px;
    border: 1px solid #5d5132; border-bottom: none; background: #0d0b0a; }
  .flask.full { border-color: #d9a456; background: radial-gradient(circle at 50% 70%, #ffe09a, #f08a2a 50%, #7a3a0e);
    box-shadow: 0 0 0 1px #000c, 0 0 9px #f0902fb0; }
  .flask.full::before { border-color: #d9a456; }
  .trail { background: linear-gradient(#e6cf8a, #b89a52); }
  .hp { background: linear-gradient(#b8342a, #7c1a13 55%, #4c0c08); }
  .st { background: linear-gradient(#6a9a58, #3c6a34 55%, #22421e); }
  .po { background: linear-gradient(#f0cc70, #b8862e 55%, #7a561a); }
  #eBars { position: absolute; left: 50%; top: 22px; transform: translateX(-50%) scale(var(--hud)); transform-origin: top center; text-align: center; }
  #eBars.hidden { visibility: hidden; }
  #eName { font-size: 16px; letter-spacing: 4px; color: #e2d6b0; text-shadow: 0 0 3px #000, 0 0 10px #000; margin-bottom: 6px;
    font-variant: small-caps; }
  #eName::before, #eName::after { content: '\25C6'; font-size: 8px; color: #c9a85e; vertical-align: middle; margin: 0 12px; }
  #eHp { width: 46vw; max-width: 620px; height: 10px; }
  #ePost { width: 46vw; max-width: 620px; height: 5px; margin-top: 3px; }
  #ePost.hidden { display: none; }
  #eTags { position: absolute; inset: 0; overflow: hidden; }
  .eTag { position: absolute; left: 0; top: 0; width: 64px; height: 5px; background: #060506e0; border: 1px solid #6e5d36;
    box-shadow: 0 0 0 1px #000000c0; overflow: hidden; display: none; }
  .eTag > div { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; }
  .eTag.locked { border-color: #f0e0a8; }
  .eTag.eGuard { height: 3px; }
  .eTag.eGuard.broken .po { filter: brightness(2.2); }
  #helpHint { position: absolute; left: 22px; bottom: 16px; font-size: 13px; color: #8f866c; text-shadow: 0 0 4px #000;
    transform: scale(var(--hud)); transform-origin: bottom left; }
  #help { position: absolute; left: 22px; bottom: 40px; background: #0d0b10e8; border: 1px solid #7d6a3a;
    padding: 12px 16px; font-size: 13px; line-height: 1.5; pointer-events: auto; transform: scale(var(--hud)); transform-origin: bottom left; }
  #help.hidden { display: none; }
  #help table { border-collapse: collapse; }
  #help td { padding: 0 14px 0 0; }
  #help td:first-child { color: #b79d5c; }
  #help label { display: block; margin-top: 8px; cursor: pointer; color: #d9cda8; }
  #help .level { color: #c9b26a; font-size: 12px; margin-top: 8px; max-width: 320px; }
  #help .level:empty { display: none; }
  #died, #won, #complete { position: absolute; left: 0; right: 0; top: 38%; text-align: center; opacity: 0; }
  #died .big { font-size: 78px; letter-spacing: 12px; color: #7a0f0f; text-shadow: 0 0 30px #000;
    background: linear-gradient(90deg, transparent, #000000b0 30%, #000000b0 70%, transparent); padding: 14px 0; }
  #died .small, #won .small, #complete .small { font-size: 16px; color: #a89f86; margin-top: 16px; opacity: 0; letter-spacing: 2px; }
  #died.show { opacity: 1; transition: opacity var(--died-fade) ease-in var(--died-delay); }
  #died.show .small { opacity: 1; transition: opacity 1s linear var(--died-hint-delay); }
  #won .big, #complete .big { font-size: 40px; letter-spacing: 10px; color: #c9b26a; text-shadow: 0 0 20px #000; }
  #complete .big { font-size: 54px; color: #b39a58;
    background: linear-gradient(90deg, transparent, #000000a0 30%, #000000a0 70%, transparent); padding: 12px 0; }
  #won.show, #complete.show { opacity: 1; transition: opacity 2s ease-in 1s; }
  #won.show .small, #complete.show .small { opacity: 1; transition: opacity 1s linear 3s; }
  #tutPrompt { position: absolute; left: 50%; top: 84px; transform: translateX(-50%) scale(var(--hud)); transform-origin: top center;
    padding: 9px 22px; background: #0d0b10d8; border: 1px solid #7d6a3a; color: #e8dcb8; font-size: 18px; letter-spacing: 1px;
    text-shadow: 0 0 6px #000; width: max-content; max-width: 86vw; text-align: center; transition: border-color 0.2s, color 0.2s; }
  #tutPrompt.hidden { display: none; }
  #tutPrompt.done { border-color: #8fbf6a; color: #c8f0a8; }
  #tutStep { color: #8f866c; font-size: 13px; margin-right: 14px; letter-spacing: 2px; }
  #tutHint { margin-top: 5px; text-align: center; font-size: 15px; color: #f0b070; }
  #tutHint:empty { display: none; }
  #tutDone { position: absolute; left: 0; right: 0; top: 36%; text-align: center; font-size: 46px; letter-spacing: 10px;
    color: #c9b26a; text-shadow: 0 0 20px #000; opacity: 0; transition: opacity 0.6s; }
  #tutDone.show { opacity: 1; }
  #rested { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-size: 34px; letter-spacing: 10px;
    color: #e0b060; text-shadow: 0 0 18px #000; opacity: 0; transition: opacity 0.8s; }
  #rested.show { opacity: 1; transition: opacity 0.4s; }
  #prompt, #confirm { position: absolute; left: 0; right: 0; bottom: 18%; text-align: center; font-size: 15px; color: #d9cda8;
    text-shadow: 0 0 6px #000; letter-spacing: 2px; opacity: 0; transition: opacity 0.3s; }
  #confirm { bottom: 24%; color: #e8c080; }
  #prompt.show, #confirm.show { opacity: 1; }
</style>
<script>
  // Load guard (plain script, runs even if the game module never does): if the game fails to start
  // (offline CDN, a data error, a crash at load), show a readable message instead of a dead menu.
  window.__bootError = function (msg) {
    if (window.__bootShown) return;   // keep the first, most specific message
    window.__bootShown = true;
    var show = function () {
      var box = document.getElementById('bootError');
      if (!box) return;
      box.querySelector('.msg').textContent = msg;
      box.classList.remove('hidden');
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show); else show();
  };
  window.addEventListener('error', function (ev) {
    if (!window.__arenaReady) window.__bootError('The game failed to start:\n' + (ev.message || 'a script error') + '.');
  });
  setTimeout(function () {
    if (!window.__arenaReady) window.__bootError('The game did not load.\nIt needs an internet connection once to download Three.js from cdn.jsdelivr.net. Check your connection, then reload the page.');
  }, 10000);
</script>
<!-- Three.js and its addons, all from the same CDN and version. -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" class="hidden">
  <div id="eTags"></div>
  <div id="pBars">
    <div class="bar" id="pHp"><div class="trail" id="pHpTrail"></div><div class="hp" id="pHpFill"></div></div>
    <div class="bar" id="pSt"><div class="st" id="pStFill"></div></div>
    <div id="pFlasks"></div>
  </div>
  <div id="eBars">
    <div id="eName"></div>
    <div class="bar" id="eHp"><div class="trail" id="eHpTrail"></div><div class="hp" id="eHpFill"></div></div>
    <div class="bar hidden" id="ePost"><div class="po" id="ePostFill"></div></div>
  </div>
  <div id="tutPrompt" class="hidden"><span id="tutStep"></span><span id="tutText"></span><div id="tutHint"></div></div>
  <div id="tutDone">TUTORIAL COMPLETE</div>
  <div id="rested">RESTED</div>
  <div id="prompt"></div>
  <div id="confirm"></div>
  <div id="died"><div class="big">YOU DIED</div><div class="small">Returning to the last bonfire&hellip;</div></div>
  <div id="won"><div class="big">ENEMY FELLED</div><div class="small" id="wonHint"></div></div>
  <div id="complete"><div class="big">LEVEL COMPLETE</div><div class="small" id="completeHint"></div></div>
  <div id="help" class="hidden">
    <table id="helpTable"></table>
    <label><input type="checkbox" id="hbToggle" checked> <span id="hbLabel">Show hitboxes</span></label>
    <div class="level" id="helpLevel"></div>
  </div>
  <div id="helpHint"></div>
</div>

<div id="menu">
  <div id="menuBox">
    <h1 id="menuTitle">COMBAT ARENA 3D</h1>
    <div class="sub" id="menuSub"></div>
    <div class="notice" id="menuNotice"></div>
    <div id="menuList"></div>
    <div class="hint" id="menuHint"></div>
  </div>
  <div id="version"></div>
</div>

<div id="fade"></div>
<div id="bootError" class="hidden"><div class="box"><h2>COMBAT ARENA 3D</h2><div class="msg"></div></div></div>

<script type="module" onerror="window.__bootError('The game did not load.
It needs an internet connection once to download Three.js from cdn.jsdelivr.net. Check your connection, then reload the page.')">
// Loader: Three.js and its addons come in as modules, then the game files load in order as classic
// scripts. Classic scripts share one global scope (their top-level const, let and class see each other)
// and load from the file system too, so double-clicking this page keeps working.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
window.THREE = THREE;
window.THREE_ADDONS = { EffectComposer, RenderPass, UnrealBloomPass, ShaderPass, OutputPass, mergeGeometries, mergeVertices };

// Game files in load order (paths under js/). A file may only use, at load time, what earlier files define.
const GAME_FILES = [
  'helpers.js',
  'config.js',
  'terrain.js',
  'data/player.js',
  'data/test-enemies.js',
  'data/enemies.js',
  'data/props.js',
  'data/look.js',
  'levels/arena.js',
  'levels/tutorial.js',
  'levels/long-hall.js',
  'levels/sunken-keep.js',
  'levels/burning-town.js',
  'levels/the-tower.js',
  'levels/test-crowd.js',
  'levels/test-heights.js',
  'levels/test-courtyard.js',
  'levels/test-mixed.js',
  'levels/test-town.js',
  'data/levels.js',
  'states.js',
  'registries.js',
  'validate.js',
  'input.js',
  'gamepad.js',
  'events.js',
  'scene.js',
  'rig.js',
  'character.js',
  'player.js',
  'enemy.js',
  'crowd.js',
  'combat.js',
  'projectiles.js',
  'fx.js',
  'visuals.js',
  'town.js',
  'hud.js',
  'game.js',
  'boot.js',
];
const loadScript = (file, dir = 'js/') => new Promise(resolve => {
  const s = document.createElement('script');
  s.src = dir + file;
  s.onload = () => resolve(true);
  s.onerror = () => resolve(false);
  document.body.appendChild(s);
});
for (const file of GAME_FILES) {
  if (!await loadScript(file)) { window.__bootError(`The game file js/${file} is missing.
Keep the js folder next to this page.`); break; }
  if (window.__bootShown) break;   // the file failed while running: its message is already on screen
}
// Developer builds (#dev) also load the stepped-simulation tests: run them with `await __arena.tests.run()`.
if (location.hash === '#dev' && !window.__bootShown) await loadScript('suite.js', 'tests/');
</script>
</body>
</html>
