<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combat Arena 3D</title>
<style>
  :root { --died-delay: 0.6s; --died-fade: 2.2s; --died-hint-delay: 2.6s; --dying-fade: 1.4s; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060a; color: #cfc6ad;
    font-family: Georgia, 'Times New Roman', serif; user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; transition: filter 0.6s; }
  canvas#view.dying { filter: grayscale(1) brightness(0.75); transition: filter var(--dying-fade); }

  .companion-nameplate { position: fixed; z-index: 4; transform: translate(-50%, -100%); pointer-events: none;
    color: #e5eff5; font: 13px Georgia, serif; text-shadow: 0 1px 2px #000, 0 0 4px #000; text-align: center;
    padding: 4px 9px 6px; background: radial-gradient(ellipse, #080e16b8, #080e1600 75%); }
  .companion-nameplate[hidden] { display: none; }
  .companion-health { display: block; width: 64px; height: 3px; margin-top: 4px; background: #10151bd9; border: 1px solid #a4b5bf55; }
  .companion-health i { display: block; height: 100%; background: #8ea47a; }

  /* Menus (Track B item 3, the mockups' menu style on js/ui-theme.js, like the title below): the screen's title top-left,
     its entries as rows under it, the selected entry's note beside them, and a footer with Back on the left and the keys
     on the right. Pause puts the run's state beside its rows (.pause-menu); Options puts the chosen category's settings
     there (.options-menu). In a game the menu is a veil over the held frame. */
  #menu { position: fixed; inset: 0; z-index: 10; overflow: hidden; background: var(--ui-well); color: var(--ui-ink);
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #menu.overlay { background: #080a0cc7; }
  #menu.hidden { display: none; }
  #menuBox { position: absolute; inset: 0; display: grid; box-sizing: border-box; padding: 56px 64px 104px; align-content: start; justify-content: start;
    grid-template-columns: minmax(0, 380px) minmax(0, 440px); column-gap: 96px; grid-template-rows: auto auto auto minmax(0, 1fr);
    grid-template-areas: "title title" "sub sub" "notice notice" "list desc"; }
  #menuBox h1 { grid-area: title; margin: 0; font: 400 var(--ui-size-title)/1.1 var(--ui-display); letter-spacing: .01em; color: var(--ui-ink); text-wrap: balance; }
  #menuBox .sub { grid-area: sub; margin-top: 10px; font: 500 var(--ui-size-text)/1.4 var(--ui-text); color: var(--ui-muted); font-variant-numeric: tabular-nums; }
  #menuBox .sub:empty, #menuBox .notice:empty, .menuArrow, #version { display: none; }
  #menuBox .notice { grid-area: notice; max-width: 640px; max-height: 30vh; margin-top: 18px; overflow-y: auto; white-space: pre-line;
    font: 400 17px/1.6 var(--ui-text); color: #cfc8b6; }
  #menuList { grid-area: list; align-self: start; display: flex; flex-direction: column; gap: 2px; min-height: 0; max-height: calc(100% - 32px); margin-top: 32px;
    overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #ffffff30 transparent; }
  #menuList:empty { display: none; }
  .menuBtn { position: relative; flex: none; }   /* the row's look is .ui-row's (js/ui-theme.js) */
  .menuBtn .n { flex: 1; min-width: 0; }
  .menuBtn .d { display: none; }
  .menuBtn.unavailable { color: var(--ui-muted); opacity: .55; cursor: default; }
  #menu .ui-row.sel { outline: 1px solid var(--ui-accent); outline-offset: -1px; color: var(--ui-ink); }
  #menu .ui-row.sel:not([aria-pressed=true]) { background: #d9b56b24; }
  #menu .ui-primary.sel { outline: 2px solid var(--ui-ink); outline-offset: 3px; }
  #menu .ui-text-button.sel { color: var(--ui-ink); outline: 1px solid var(--ui-accent); outline-offset: -1px; background: #d9b56b24; }
  #menuDesc { grid-area: desc; align-self: start; min-height: 0; max-height: 100%; margin-top: 40px; overflow-y: auto;
    font: 400 var(--ui-size-text)/1.6 var(--ui-text); color: #cfc8b6; text-wrap: pretty; }
  #menuSide { grid-area: side; min-width: 0; }
  #menuSide:empty { display: none; }
  #menuFoot { position: absolute; left: 64px; right: 64px; bottom: 24px; display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px 24px; padding-top: 12px; border-top: 1px solid var(--ui-line); }
  #menuFootActions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: -10px; }
  #menuBox #menuHint { margin: 0 0 0 auto; font: 400 var(--ui-size-hint)/1.4 var(--ui-text); color: var(--ui-muted); }
  /* Pause: the rows and the selected one's note on the left, the run's state on the right. */
  #menu.pause-menu #menuBox { grid-template-columns: minmax(0, 360px) minmax(0, 420px); column-gap: 136px; grid-template-rows: auto auto auto auto minmax(0, 1fr);
    grid-template-areas: "title side" "sub side" "notice side" "list side" "desc side"; }
  #menu.pause-menu #menuDesc { margin-top: 16px; color: var(--ui-muted); }
  #menu.pause-menu #menuSide { margin-top: 14px; }
  .menu-facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 28px; margin: 0; font: 400 var(--ui-size-text)/1.35 var(--ui-text);
    color: var(--ui-muted); font-variant-numeric: tabular-nums; }
  .menu-facts dt { margin: 0; } .menu-facts dd { margin: 0; color: var(--ui-ink); overflow-wrap: anywhere; } .menu-facts dd span { color: var(--ui-muted); }
  .menu-facts .over { color: var(--ui-alarm); }
  .menu-side-note { margin: 22px 0 0; font: 400 var(--ui-size-text)/1.5 var(--ui-text); color: var(--ui-muted); }
  /* Options: categories as rows on the left, the chosen one's settings as rows on the right, each with the control that
     fits it (a value cycled in place, a slider with its number, an Off/On pair), and the focused one's help under them. */
  #menu.options-menu #menuBox { grid-template-columns: minmax(0, 240px) minmax(0, 640px); column-gap: 72px; grid-template-rows: auto auto auto auto minmax(0, 1fr);
    grid-template-areas: "title title" "sub sub" "notice notice" "list side" "list desc"; }
  #menu.options-menu #menuSide { margin-top: 32px; border-top: 1px solid var(--ui-line); }
  #menu.options-menu #menuDesc { margin-top: 14px; padding-left: 16px; color: var(--ui-muted); }
  .menuBtn.setting { justify-content: space-between; min-height: 56px; border-bottom: 1px solid var(--ui-line); font-size: 18px; }
  .menuBtn.setting[hidden] { display: none; }
  .menuBtn .v { flex: none; display: flex; align-items: center; width: 240px; font: 500 var(--ui-size-text)/1 var(--ui-text); color: var(--ui-ink); }
  .menuBtn .v.cyc { display: grid; grid-template-columns: 36px minmax(0, 1fr) 36px; min-height: 42px; border: 1px solid var(--ui-line); background: var(--ui-well);
    font: 400 17px/1 var(--ui-display); text-align: center; }
  .menuBtn .v.cyc > span { display: grid; place-items: center; min-width: 0; height: 100%; }
  .menuBtn .v.cyc .al, .menuBtn .v.cyc .ar { color: var(--ui-accent); font: 18px/1 var(--ui-text); }
  .menuBtn .v.cyc .al:hover, .menuBtn .v.cyc .ar:hover { background: var(--ui-hover); color: var(--ui-accent-hi); }
  .menuBtn .v.seg > span { flex: 1; display: grid; place-items: center; height: 42px; border: 1px solid var(--ui-line); color: var(--ui-muted); }
  .menuBtn .v.seg > span + span { border-left: 0; }
  .menuBtn .v.seg > span.on { background: var(--ui-accent-wash); border-color: var(--ui-accent); color: var(--ui-accent-hi); }
  .menuBtn .v.seg > span:not(.on):hover { color: var(--ui-ink); background: var(--ui-hover); }
  .menuBtn .v.slide { gap: 14px; }
  .menuBtn .v.slide .track { position: relative; flex: 1; height: 24px; }
  .menuBtn .v.slide .track::before { content: ''; position: absolute; left: 0; right: 0; top: 10px; height: 4px; background: var(--ui-line); }
  .menuBtn .v.slide .track i { position: absolute; left: 0; top: 10px; height: 4px; background: var(--ui-accent); }
  .menuBtn .v.slide .track b { position: absolute; top: 4px; width: 14px; height: 16px; margin-left: -7px; background: var(--ui-ink); }
  .menuBtn .v.slide .num { width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) {   /* a phone upright: one column, the note and the side panel under the rows */
    #menuBox, #menu.pause-menu #menuBox, #menu.options-menu #menuBox { padding: 40px 20px 150px; grid-template-columns: minmax(0, 1fr); column-gap: 0;
      grid-template-rows: auto auto auto minmax(0, max-content) auto; grid-template-areas: "title" "sub" "notice" "list" "desc"; }
    #menu.pause-menu #menuBox { grid-template-rows: auto auto auto auto auto auto; grid-template-areas: "title" "sub" "notice" "list" "desc" "side"; }
    #menu.options-menu #menuBox { grid-template-rows: auto auto auto auto auto auto; grid-template-areas: "title" "sub" "notice" "list" "side" "desc"; overflow-y: auto; }
    #menuBox h1 { font-size: 32px; }
    #menuList { margin-top: 22px; max-height: calc(100% - 22px); }
    #menuDesc { margin-top: 16px; max-height: 7.5em; }
    #menu.pause-menu #menuSide { margin-top: 28px; }
    #menu.options-menu #menuList { display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: 4px; max-height: none; }
    #menu.options-menu #menuList .ui-row { width: auto; padding: 0 10px 0 9px; font-size: 16px; }
    #menu.options-menu #menuSide { margin-top: 18px; }
    #menu.options-menu #menuDesc { padding-left: 0; }
    .menuBtn.setting { gap: 10px; font-size: 16px; padding-right: 8px; }
    .menuBtn .v { width: min(180px, 52%); }
    #menuFoot { left: 20px; right: 20px; bottom: max(28px, env(safe-area-inset-bottom)); }
  }
  @media (max-height: 500px) and (min-width: 560px) {   /* a phone on its side: tighter edges and type */
    #menuBox { padding: 18px 32px 80px; column-gap: 48px; }
    #menu.pause-menu #menuBox, #menu.options-menu #menuBox { column-gap: 48px; }
    #menuBox h1 { font-size: 28px; }
    #menuList, #menu.options-menu #menuSide { margin-top: 14px; }
    #menuList { max-height: calc(100% - 14px); }
    #menuBox .notice { max-height: 22vh; margin-top: 10px; }
    #menuDesc { margin-top: 20px; }
    #menuList .ui-row { min-height: 38px; }
    .menuBtn.setting { min-height: 46px; }
    #menuFoot { left: 32px; right: 32px; bottom: 10px; padding-top: 6px; }
  }
  @media (hover: none) and (pointer: coarse) {   /* a touch screen has no keys to hint */
    #menu:not(.title-menu) #menuHint, #menu .menu-back .ui-key { display: none; }
    #menuList .ui-row { min-height: 44px; }   /* a finger's size, a phone on its side included */
  }

  /* The title (v7.70.0, the mockups' menu style on js/ui-theme.js): the name top-left, the modes as rows under it, the
     chosen mode's line, one primary button, and a footer with quiet entries on the left and key hints and the version on
     the right. The selected entry (keys, pad or pointer) gets the focus outline; the chosen mode is the pressed row. */
  #menu.title-menu { background: var(--ui-well); touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #menu.title-menu #menuBox { display: grid; grid-template-columns: minmax(0, 420px); grid-template-areas: "title" "list" "desc" "act";
    align-content: start; justify-content: start; padding: 56px 64px 128px; }
  #menu.title-menu #menuBox h1 { grid-area: title; padding: 0; text-align: left; white-space: normal; text-shadow: none;
    font: 400 48px/1.1 var(--ui-display); letter-spacing: .01em; color: var(--ui-ink); text-wrap: balance; }
  #menu.title-menu #menuBox h1::before { content: none; }
  #menu.title-menu #menuBox .sub, #menu.title-menu .menuArrow, #menu.title-menu #menuBox .notice, #menu.title-menu #version { display: none; }
  #menu.title-menu #menuList { grid-area: list; display: flex; flex-direction: column; align-items: stretch; gap: 2px; width: auto;
    max-height: none; margin-top: 40px; padding: 0; overflow: visible; -webkit-mask-image: none; mask-image: none; }
  #menu.title-menu #menuDesc { grid-area: desc; max-width: none; min-height: 1.5em; margin-top: 14px; text-align: left;
    font: 400 var(--ui-size-text)/1.5 var(--ui-text); letter-spacing: 0; color: var(--ui-muted); }
  #menuAct:empty, #menuFootActions:empty { display: none; }
  #menu.title-menu #menuAct { grid-area: act; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 18px; }
  #menu.title-menu #menuAct [hidden] { display: none; }
  #menu.title-menu .title-mode { min-height: 46px; }
  #menu.title-menu .title-mode.offline:not([aria-pressed=true]) { color: var(--ui-muted); }
  #menu.title-menu .title-primary { justify-content: space-between; }
  #menu.title-menu .title-second { margin-left: -10px; }
  #menu.title-menu .title-update { color: var(--ui-accent-hi); }
  #menu.title-menu #menuBox #menuHint { position: static; margin: 0; text-align: left; font: 400 var(--ui-size-hint)/1.4 var(--ui-text); letter-spacing: 0; color: var(--ui-muted); }
  @media (max-width: 640px) {   /* a phone upright: tighter edges, a smaller name, the footer's two halves stacked */
    #menu.title-menu #menuBox { padding: 48px 20px 170px; }
    #menu.title-menu #menuBox h1 { font-size: 34px; }
    #menu.title-menu #menuList { margin-top: 28px; }
    #menu.title-menu #menuFoot { left: 20px; right: 20px; bottom: max(34px, env(safe-area-inset-bottom)); }
  }
  @media (max-height: 500px) and (min-width: 560px) {   /* a phone on its side: the modes on the left, the line and the primary beside them */
    #menu.title-menu #menuBox { grid-template-columns: minmax(0, 320px) minmax(0, 320px); grid-template-areas: "title title" "list desc" "list act";
      column-gap: 40px; align-items: start; padding: 20px 32px 96px; }
    #menu.title-menu #menuBox h1 { font-size: 30px; }
    #menu.title-menu #menuList { margin-top: 14px; }
    #menu.title-menu .title-mode { min-height: 42px; }
    #menu.title-menu #menuDesc { margin-top: 22px; }
    #menu.title-menu #menuAct { margin-top: 10px; }
    #menu.title-menu #menuFoot { left: 32px; right: 32px; bottom: 12px; padding-top: 6px; }
  }
  @media (hover: none) and (pointer: coarse) {   /* a touch screen has no keys to hint: only the version stays */
    #menu.title-menu .title-primary .ui-key, #menu.title-menu #menuHint span:not(:last-child) { display: none; }
  }
  /* A newer version on the server (js/version-check.js): an ember-lit row in pause. */
  .menuBtn.update .n { color: #f3c98a; }
  .menuBtn.update .n::before { content: ''; display: inline-block; width: 7px; height: 7px; margin: 0 10px 2px 0; border-radius: 50%;
    vertical-align: middle; background: #ff7a45; box-shadow: 0 0 8px 1px #ff5a2a99; }
  .menuBtn.update.sel .n, .menuBtn.update:hover .n { color: #ffe2b0; }

  /* The pointer only shows in the menus with keyboard and mouse (boot.js); developer labs keep theirs. */
  body.no-cursor, body.no-cursor *:not([data-cursor]):not([data-cursor] *) { cursor: none !important; }
  #qualityNote { position: fixed; left: 50%; top: 7vh; z-index: 12; transform: translateX(-50%); padding: 8px 22px; max-width: 86vw; text-align: center;
    font-size: 13px; letter-spacing: 1px; color: #d9c792; border-top: 1px solid #c9a85e55; border-bottom: 1px solid #c9a85e55;
    background: linear-gradient(90deg, #0000, #000c 20%, #000c 80%, #0000); pointer-events: none; opacity: 1; transition: opacity 1.4s; }
  #qualityNote.out { opacity: 0; }
  #version { position: absolute; right: 10px; bottom: 6px; font-size: 11px; letter-spacing: 1px; color: #6f6753; text-align: right; pointer-events: none; }

  #fade { position: fixed; inset: 0; z-index: 8; background: #000; opacity: 0; pointer-events: none; transition: opacity var(--fade-time, 1s); }
  #fade.show { opacity: 1; }
  /* Loading screen (Game.loading): the level's name and a tip, the controller note with a small pad icon at the foot. */
  #loading { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 45%, #100d0c 0%, #020202 75%); opacity: 0; pointer-events: none; transition: opacity var(--load-fade, 0.6s); }
  #loading.show { opacity: 1; transition: none; }
  #loadName { font-size: clamp(22px, 3.4vw, 44px); letter-spacing: 6px; color: #d9bd7c; text-shadow: 0 0 18px #b8903c50; text-align: center; padding: 0 5vw; }
  #loadTip { margin-top: 18px; font-size: 15px; color: #8f866c; letter-spacing: 1px; text-align: center; max-width: 80vw; }
  #loadTip:empty { display: none; }
  #loadPad { position: absolute; bottom: 7vh; display: flex; align-items: center; gap: 10px; font-size: 13px; letter-spacing: 2px; color: #7a7058; }
  #loadPad svg { width: 30px; height: 20px; }
  #bootError { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: #07060af0; }
  #bootError.hidden { display: none; }
  #bootError .box { border: 2px solid #8a3a2a; background: #120c0d; padding: 26px 34px; max-width: 640px; }
  #bootError h2 { margin: 0 0 12px; font-weight: normal; letter-spacing: 4px; color: #d0705a; font-size: 20px; }
  #bootError .msg { white-space: pre-line; font-size: 14px; line-height: 1.55; color: #d9cda8; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden;
    --u: 1; --mx: 30px; --my: 24px; --calm: 0; --calm-dim: 0.5; --toast-time: 3.2s;
    --gilt: #c9a85e; --gilt-dim: #6e5d36; --ink: #e2d6b0; }
  #hud.hidden { display: none; }
  /* Layout: everything but the overhead tags and the vignette lives on #stage, a box of "design pixels" scaled by
     --u (set from the window size by hud.layout) and pinned to the top-left corner, so the anchors below keep
     their corners and their proportions on any window size or aspect ratio. Each anchor is a flex column: its
     children stack instead of overlapping, and reserve their room even when invisible, so nothing jumps. */
  #stage { position: absolute; left: 0; top: 0; width: calc(100% / var(--u)); height: calc(100% / var(--u));
    transform: scale(var(--u)); transform-origin: 0 0; }
  .anchor { position: absolute; display: flex; flex-direction: column; gap: 10px; }
  #aTL { left: var(--mx); top: var(--my); align-items: flex-start; }
  #aTC { left: 0; right: 0; top: var(--my); align-items: center; }
  #aBC { left: 0; right: 0; bottom: 13%; align-items: center; gap: 6px; }
  #aBL { left: var(--mx); bottom: 16px; align-items: flex-start; justify-content: flex-end; }
  .hud-tip { position: relative; margin-top: 18px; padding: 14px 18px 16px; min-width: 182px;
    background: linear-gradient(90deg, #0b0c1057, #0b0c1010); border-radius: 2px;
    color: #e1ddd2; font: 14px/1.5 Georgia, 'Times New Roman', serif; text-shadow: 0 1px 3px #000c; }
  .hud-tip::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 1px;
    background: linear-gradient(transparent, #c7ad7580 20%, #c7ad7533 80%, transparent); }
  .hud-tip[hidden] { display: none; }
  .hud-tip .title { display: flex; align-items: center; gap: 9px; margin-bottom: 12px;
    font: 10px/1.5 Arial, sans-serif; letter-spacing: 2.5px; color: #c7ad75; }
  .hud-tip .title::before { content: ''; width: 4px; height: 4px; transform: rotate(45deg);
    border: 1px solid #c7ad7599; }
  .hud-tip .title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, #c7ad754d, transparent); }
  #controlsTipsRows { display: grid; gap: 6px; }
  #controlsTipsRows > div { display: flex; align-items: baseline; justify-content: space-between; gap: 26px; }
  #controlsTipsRows > div > span:last-child { color: #f1e4c8; font: 12px/1.5 Arial, sans-serif; }

  /* Meters: a near-black plate in a gilt hairline, bevelled (light edge on top, dark edge below, a shadow cut
     round the rim), so every bar reads on bright skies and in black corridors alike. */
  .bar { position: relative; overflow: hidden; background: linear-gradient(#030203f4, #14100ff0); border: 1px solid var(--gilt-dim);
    box-shadow: 0 0 0 1px #000000d8, inset 0 1px 0 #ffffff14, inset 0 -1px 0 #000000a0, inset 0 0 6px #000000b0, 0 2px 9px #000000a8;
    transition: border-color 0.2s, box-shadow 0.2s; }
  .bar > div { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; }
  .bar::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 3;   /* sheen, and a fine tick every tenth */
    background: linear-gradient(#ffffff2c, #ffffff00 48%, #00000050),
      repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), #00000070 calc(10% - 1px) 10%); }
  .bar > .hp::after, .bar > .st::after, .bar > .po::after {   /* a bright, glowing leading edge on each fill */
    content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 2px; background: #fff6d8c0; box-shadow: 0 0 7px 1px var(--glow, #ffd890); }
  .trail { background: linear-gradient(#ecd896, #b89a52); z-index: 0; }
  .hp { background: linear-gradient(#cc4034, #8a1c14 52%, #50100b); --glow: #ff7a60; z-index: 1; }
  .st { background: linear-gradient(#7cb068, #467a3c 52%, #274c22); --glow: #b8f090; z-index: 1; }
  .po { background: linear-gradient(#f4d27a, #bc8a30 52%, #7c5a1c); --glow: #ffe49a; z-index: 1; }
  #pStTrail { background: linear-gradient(#cfe0a8, #8aa466); opacity: 0.8; }

  /* Player vitals, top left. Dims when calm (--calm 0..1), brightens and swells back at the first threat. */
  #pBars { position: relative; padding: 14px 40px 12px 18px; transform-origin: top left;
    opacity: calc(1 - var(--calm) * var(--calm-dim)); transform: scale(calc(1 - var(--calm) * 0.06)); }
  #pBars::before { content: ''; position: absolute; inset: 0 0 0 0; z-index: -1; pointer-events: none;   /* soft plate behind the bars */
    background: radial-gradient(ellipse at 0 50%, #000000a8, #00000000 72%); }
  #pBars::after { content: ''; position: absolute; left: 0; top: 10px; bottom: 8px; width: 1px;   /* gilt spine, a diamond at its head */
    background: linear-gradient(#c9a85e00, var(--gilt) 25%, var(--gilt) 75%, #c9a85e00); }
  #pHp, #pSt { transform-origin: left center; }
  #pHp { width: 320px; height: 14px; }
