<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combat Arena 3D</title>
<style>
  :root { --hud: 1; --died-delay: 0.6s; --died-fade: 2.2s; --died-hint-delay: 2.6s; --dying-fade: 1.4s; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060a; color: #cfc6ad;
    font-family: Georgia, 'Times New Roman', serif; user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; transition: filter 0.6s; }
  canvas#view.dying { filter: grayscale(1) brightness(0.75); transition: filter var(--dying-fade); }

  #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, #17131a 0%, #07060a 75%); z-index: 10; }
  #menu.overlay { background: #07060ab8; }
  #menu.hidden { display: none; }
  #menuBox { border: 2px solid #7d6a3a; padding: 34px 44px 26px; background: #0d0b10; min-width: 420px;
    max-width: 90vw; box-shadow: 0 0 60px #000; }
  #menuBox h1 { margin: 0 0 6px; text-align: center; letter-spacing: 6px; font-weight: normal;
    font-size: 30px; color: #b79d5c; }
  #menuBox .sub { text-align: center; font-size: 13px; color: #6f6753; margin-bottom: 22px; letter-spacing: 2px; min-height: 1em; }
  .menuBtn { display: block; width: 100%; box-sizing: border-box; margin: 10px 0; padding: 12px 16px;
    text-align: left; background: #15121a; border: 1px solid #3a3226; color: #cfc6ad; cursor: pointer;
    font-family: inherit; }
  .menuBtn .n { font-size: 19px; letter-spacing: 2px; }
  .menuBtn .d { font-size: 13px; color: #857c66; margin-top: 3px; }
  .menuBtn .d:empty { display: none; }
  .menuBtn:hover, .menuBtn.sel { background: #262017; border-color: #b79d5c; color: #f0e3bd; }
  .menuBtn.sel .n::before { content: '\25B8  '; color: #b79d5c; }
  #menuBox .hint { text-align: center; font-size: 12px; color: #6f6753; margin-top: 18px; }

  #fade { position: fixed; inset: 0; z-index: 8; background: #000; opacity: 0; pointer-events: none; transition: opacity var(--fade-time, 1s); }
  #fade.show { opacity: 1; }
  #bootError { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: #07060af0; }
  #bootError.hidden { display: none; }
  #bootError .box { border: 2px solid #8a3a2a; background: #120c0d; padding: 26px 34px; max-width: 640px; }
  #bootError h2 { margin: 0 0 12px; font-weight: normal; letter-spacing: 4px; color: #d0705a; font-size: 20px; }
  #bootError .msg { white-space: pre-line; font-size: 14px; line-height: 1.55; color: #d9cda8; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud.hidden { display: none; }
  .bar { position: relative; background: #0b0a0cd0; border: 1px solid #5d5132; overflow: hidden; }
  .bar > div { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; }
  #pBars { position: absolute; left: 22px; top: 20px; transform: scale(var(--hud)); transform-origin: top left; }
  #pHp { width: min(320px, 24vw); height: 16px; }
  #pSt { width: min(260px, 20vw); height: 10px; margin-top: 6px; }
  #pFlasks { margin-top: 12px; height: 18px; }
  .flask { display: inline-block; position: relative; width: 11px; height: 14px; margin-right: 7px; vertical-align: bottom;
    border: 1px solid #5d5132; border-radius: 3px 3px 6px 6px; background: #14110f; }
  .flask::before { content: ''; position: absolute; left: 3px; top: -5px; width: 3px; height: 4px;
    border: 1px solid #5d5132; border-bottom: none; background: #14110f; }
  .flask.full { border-color: #c9934a; background: radial-gradient(circle at 50% 70%, #ffd27a, #e3872c 55%, #8a4612);
    box-shadow: 0 0 7px #e8902f99; }
  .flask.full::before { border-color: #c9934a; }
  #pSouls { margin-top: 4px; font-size: 14px; color: #d9cda8; text-shadow: 0 0 5px #000; letter-spacing: 1px; }
  #pSouls b { color: #e6dcb8; font-weight: normal; }
  .trail { background: #c9b26a; }
  .hp { background: linear-gradient(#a32a22, #6e1612); }
  .st { background: linear-gradient(#4f9a4a, #2d6a2e); }
  .po { background: linear-gradient(#e8c060, #a87a2a); }
  #eBars { position: absolute; left: 50%; top: 20px; transform: translateX(-50%) scale(var(--hud)); transform-origin: top center; text-align: center; }
  #eBars.hidden { visibility: hidden; }
  #eName { font-size: 17px; letter-spacing: 3px; color: #d9cda8; text-shadow: 0 0 6px #000; margin-bottom: 5px; }
  #eHp { width: 46vw; max-width: 620px; height: 12px; }
  #ePost { width: 46vw; max-width: 620px; height: 6px; margin-top: 3px; }
  #ePost.hidden { display: none; }
  #eTags { position: absolute; inset: 0; overflow: hidden; }
  .eTag { position: absolute; left: 0; top: 0; width: 64px; height: 6px; background: #0b0a0cd0; border: 1px solid #5d5132;
    overflow: hidden; display: none; }
  .eTag > div { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; }
  .eTag.locked { border-color: #e8d8a0; }
  .eTag.eGuard { height: 3px; }
  .eTag.eGuard.broken .po { filter: brightness(2.2); }
  #helpHint { position: absolute; left: 22px; bottom: 16px; font-size: 13px; color: #8f866c; text-shadow: 0 0 4px #000;
    transform: scale(var(--hud)); transform-origin: bottom left; }
  #help { position: absolute; left: 22px; bottom: 40px; background: #0d0b10e8; border: 1px solid #7d6a3a;
    padding: 12px 16px; font-size: 13px; line-height: 1.5; pointer-events: auto; transform: scale(var(--hud)); transform-origin: bottom left; }
  #help.hidden { display: none; }
  #help table { border-collapse: collapse; }
  #help td { padding: 0 14px 0 0; }
  #help td:first-child { color: #b79d5c; }
  #help label { display: block; margin-top: 8px; cursor: pointer; color: #d9cda8; }
  #help .level { color: #c9b26a; font-size: 12px; margin-top: 8px; max-width: 320px; }
  #help .level:empty, #help .warn:empty { display: none; }
  #help .warn { color: #7a7260; font-size: 11px; margin-top: 6px; max-width: 320px; }
  #died, #won, #complete { position: absolute; left: 0; right: 0; top: 38%; text-align: center; opacity: 0; }
  #died .big { font-size: 78px; letter-spacing: 12px; color: #7a0f0f; text-shadow: 0 0 30px #000;
    background: linear-gradient(90deg, transparent, #000000b0 30%, #000000b0 70%, transparent); padding: 14px 0; }
  #died .small, #won .small, #complete .small { font-size: 16px; color: #a89f86; margin-top: 16px; opacity: 0; letter-spacing: 2px; }
  #died.show { opacity: 1; transition: opacity var(--died-fade) ease-in var(--died-delay); }
  #died.show .small { opacity: 1; transition: opacity 1s linear var(--died-hint-delay); }
  #won .big, #complete .big { font-size: 40px; letter-spacing: 10px; color: #c9b26a; text-shadow: 0 0 20px #000; }
  #complete .big { font-size: 54px; color: #b39a58;
    background: linear-gradient(90deg, transparent, #000000a0 30%, #000000a0 70%, transparent); padding: 12px 0; }
  #won.show, #complete.show { opacity: 1; transition: opacity 2s ease-in 1s; }
  #won.show .small, #complete.show .small { opacity: 1; transition: opacity 1s linear 3s; }
  #tutPrompt { position: absolute; left: 50%; top: 84px; transform: translateX(-50%) scale(var(--hud)); transform-origin: top center;
    padding: 9px 22px; background: #0d0b10d8; border: 1px solid #7d6a3a; color: #e8dcb8; font-size: 18px; letter-spacing: 1px;
    text-shadow: 0 0 6px #000; white-space: nowrap; transition: border-color 0.2s, color 0.2s; }
  #tutPrompt.hidden { display: none; }
  #tutPrompt.done { border-color: #8fbf6a; color: #c8f0a8; }
  #tutStep { color: #8f866c; font-size: 13px; margin-right: 14px; letter-spacing: 2px; }
  #tutDone { position: absolute; left: 0; right: 0; top: 36%; text-align: center; font-size: 46px; letter-spacing: 10px;
    color: #c9b26a; text-shadow: 0 0 20px #000; opacity: 0; transition: opacity 0.6s; }
  #tutDone.show { opacity: 1; }
  #rested { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-size: 34px; letter-spacing: 10px;
    color: #e0b060; text-shadow: 0 0 18px #000; opacity: 0; transition: opacity 0.8s; }
  #rested.show { opacity: 1; transition: opacity 0.4s; }
  #prompt, #confirm { position: absolute; left: 0; right: 0; bottom: 18%; text-align: center; font-size: 15px; color: #d9cda8;
    text-shadow: 0 0 6px #000; letter-spacing: 2px; opacity: 0; transition: opacity 0.3s; }
  #confirm { bottom: 24%; color: #e8c080; }
  #prompt.show, #confirm.show { opacity: 1; }
</style>
<script>
  // Load guard (plain script, runs even if the game module never does): if the game fails to start
  // (offline CDN, a data error, a crash at load), show a readable message instead of a dead menu.
  window.__bootError = function (msg) {
    if (window.__bootShown) return;   // keep the first, most specific message
    window.__bootShown = true;
    var show = function () {
      var box = document.getElementById('bootError');
      if (!box) return;
      box.querySelector('.msg').textContent = msg;
      box.classList.remove('hidden');
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show); else show();
  };
  window.addEventListener('error', function (ev) {
    if (!window.__arenaReady) window.__bootError('The game failed to start:\n' + (ev.message || 'a script error') + '.');
  });
  setTimeout(function () {
    if (!window.__arenaReady) window.__bootError('The game did not load.\nIt needs an internet connection once to download Three.js from cdn.jsdelivr.net. Check your connection, then reload the page.');
  }, 10000);
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" class="hidden">
  <div id="eTags"></div>
  <div id="pBars">
    <div class="bar" id="pHp"><div class="trail" id="pHpTrail"></div><div class="hp" id="pHpFill"></div></div>
    <div class="bar" id="pSt"><div class="st" id="pStFill"></div></div>
    <div id="pFlasks"></div>
    <div id="pSouls">Souls <b id="pSoulsN">0</b></div>
  </div>
  <div id="eBars">
    <div id="eName"></div>
    <div class="bar" id="eHp"><div class="trail" id="eHpTrail"></div><div class="hp" id="eHpFill"></div></div>
    <div class="bar hidden" id="ePost"><div class="po" id="ePostFill"></div></div>
  </div>
  <div id="tutPrompt" class="hidden"><span id="tutStep"></span><span id="tutText"></span></div>
  <div id="tutDone">TUTORIAL COMPLETE</div>
  <div id="rested">RESTED</div>
  <div id="prompt"></div>
  <div id="confirm"></div>
  <div id="died"><div class="big">YOU DIED</div><div class="small">Returning to the last bonfire&hellip;</div></div>
  <div id="won"><div class="big">ENEMY FELLED</div><div class="small" id="wonHint"></div></div>
  <div id="complete"><div class="big">LEVEL COMPLETE</div><div class="small" id="completeHint"></div></div>
  <div id="help" class="hidden">
    <table id="helpTable"></table>
    <label><input type="checkbox" id="hbToggle" checked> <span id="hbLabel">Show hitboxes</span></label>
    <div class="level" id="helpLevel"></div>
    <div class="warn" id="helpWarn"></div>
  </div>
  <div id="helpHint"></div>
</div>

<div id="menu">
  <div id="menuBox">
    <h1 id="menuTitle">COMBAT ARENA 3D</h1>
    <div class="sub" id="menuSub"></div>
    <div id="menuList"></div>
    <div class="hint" id="menuHint"></div>
  </div>
</div>

<div id="fade"></div>
<div id="bootError" class="hidden"><div class="box"><h2>COMBAT ARENA 3D</h2><div class="msg"></div></div></div>

<script type="module" onerror="window.__bootError('The game did not load.\nIt needs an internet connection once to download Three.js from cdn.jsdelivr.net. Check your connection, then reload the page.')">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ============================================================================
// 0. Shared helpers
// ============================================================================
// Defined before everything else so that any code, including level building, can use them.
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
const turnToward = (cur, target, maxStep) => cur + clamp(angDiff(target, cur), -maxStep, maxStep);
const isInFront = (b, x, z) => (x - b.x) * Math.sin(b.yaw) + (z - b.z) * Math.cos(b.yaw) > 0;
const BODY_HEIGHT = 1.8;   // a humanoid at scale 1; collision height = BODY_HEIGHT * scale, so it always matches the model
const warned = new Set();
const warnOnce = msg => { if (!warned.has(msg)) { warned.add(msg); console.warn(msg); } };

// Flat geometry for room-style levels. A rect is [x0, x1, z0, z1]; a box is { x0, x1, z0, z1 }.
const inRect = (r, x, z) => x >= r[0] && x <= r[1] && z >= r[2] && z <= r[3];
const insideRooms = (rooms, x, z, m = 0) => rooms.some(({ rect: r }) => x >= r[0] + m && x <= r[1] - m && z >= r[2] + m && z <= r[3] - m);
// Fraction (0..1) along the segment from (x, z) by (dx, dz) where it first enters box b grown by m; Infinity if never.
function segBox(x, z, dx, dz, b, m = 0) {
  let t0 = 0, t1 = 1;
  for (const [p, d, lo, hi] of [[x, dx, b.x0 - m, b.x1 + m], [z, dz, b.z0 - m, b.z1 + m]]) {
    if (Math.abs(d) < 1e-9) { if (p < lo || p > hi) return Infinity; continue; }
    let a = (lo - p) / d, c = (hi - p) / d;
    if (a > c) [a, c] = [c, a];
    t0 = Math.max(t0, a); t1 = Math.min(t1, c);
    if (t0 > t1) return Infinity;
  }
  return t0;
}
// Wall boxes around the union of the rooms: every stretch of a room's edge that no other room touches,
// plus the outer corners. Each box remembers its room (for its material).
function roomWalls(rooms) {
  const T = CONFIG.rooms.wallThickness, eps = 1e-6, out = [];
  const overlapsRoom = b => rooms.some(({ rect: o }) => b.x0 < o[1] - eps && b.x1 > o[0] + eps && b.z0 < o[3] - eps && b.z1 > o[2] + eps);
  const subtract = (a, b, cuts) => {   // parts of [a, b] not covered by the cuts
    let segs = [[a, b]];
    for (const [c0, c1] of cuts)
      segs = segs.flatMap(([s0, s1]) => c1 <= s0 || c0 >= s1 ? [[s0, s1]] : [[s0, c0], [c1, s1]].filter(([u, v]) => v - u > eps));
    return segs;
  };
  for (const room of rooms) {
    const [x0, x1, z0, z1] = room.rect, others = rooms.filter(o => o !== room).map(o => o.rect);
    const edges = [   // along: the axis the edge runs along; at: its fixed coordinate; out: outward side
      { along: 'x', at: z1, out: 1, lo: x0, hi: x1, touch: o => Math.abs(o[2] - z1) < eps, span: o => [o[0], o[1]] },
      { along: 'x', at: z0, out: -1, lo: x0, hi: x1, touch: o => Math.abs(o[3] - z0) < eps, span: o => [o[0], o[1]] },
      { along: 'z', at: x1, out: 1, lo: z0, hi: z1, touch: o => Math.abs(o[0] - x1) < eps, span: o => [o[2], o[3]] },
      { along: 'z', at: x0, out: -1, lo: z0, hi: z1, touch: o => Math.abs(o[1] - x0) < eps, span: o => [o[2], o[3]] },
    ];
    for (const e of edges) {
      for (const [a, b] of subtract(e.lo, e.hi, others.filter(e.touch).map(e.span))) {
        const t0 = e.out > 0 ? e.at : e.at - T;
        out.push(e.along === 'x' ? { x0: a, x1: b, z0: t0, z1: t0 + T, room } : { x0: t0, x1: t0 + T, z0: a, z1: b, room });
      }
    }
    for (const cx of [x0, x1]) for (const cz of [z0, z1]) {
      const bx = cx === x0 ? x0 - T : x1, bz = cz === z0 ? z0 - T : z1;
      const sq = { x0: bx, x1: bx + T, z0: bz, z1: bz + T, room };
      if (!overlapsRoom(sq)) out.push(sq);
    }
  }
  return out;
}

// ============================================================================
// 1. CONFIG
// ============================================================================
// Shared tuning. Per-character data (player, enemies, items) and level layouts live in section 2.
const CONFIG = {
  step: 1 / 60,          // fixed simulation timestep (s)
  maxSteps: 5,           // max simulation steps per rendered frame
  gravity: 30,
  input: { buffer: 0.2 },   // seconds a press is remembered; the clock stops during hit-pauses
  camera: {
    fov: 55, lookHeight: 1.35,
    followRate: 7,        // position smoothing (1/s)
    yawFollow: 0.85,      // how fast the camera swings behind the facing (rad/s at 90 deg off)
    leanRange: 11, leanAmount: 0.38, leanPullback: 1.4, leanRaise: 0.5,
    wallMargin: 0.3, gateMargin: 0.6, closeRaise: 1.6, floor: 0.6, ceilingMargin: 0.7,
  },
  zoom: { min: 2.6, max: 12, step: 0.8, default: 6.4, rate: 7, repeatDelay: 0.28, repeat: 0.09,
          heightRatio: 0.48 },   // camera height = distance * heightRatio
  mouse: { yawPerPx: 0.0006, pitchPerPx: 0.0005, holdTime: 1.6, pitchMin: -0.3, pitchMax: 0.7 },
  lock: { range: 16, breakRange: 21, lostTime: 1.0, turnRate: 12, camYawRate: 5, frame: 0.45,
          slack: 0.42, drift: 0.18,   // camera yaw slack (rad) and the slow drift inside it (1/s)
          autoRange: 9,               // first-encounter auto lock-on distance
          sizeDist: 0.6, sepDist: 0.28, maxExtra: 6, markerGap: 0.45 },
  player: {
    poiseResetTime: 4, staminaRegen: 36, staminaDelay: 0.75,
    walkSpeed: 4.3, accel: 34, decel: 28, turnRate: 14,
    airTurnMul: 0.4,       // turning while airborne, as a fraction of turnRate
    blockSpeedMul: 0.45,   // guarded shuffle: facing stays fixed (or on the lock target) while moving
    jumpVelocity: 8.2, airControl: 9, jumpCost: 14,
    jumpAttackAirControl: 0.6,   // multiplier on air control during a jump attack
    landKeep: 0.35,              // horizontal speed kept on a jump-attack landing
    rollCost: 27, rollTime: 0.62, rollIFrames: 0.3, rollSpeed: 9.2, rollSlow: 0.78,
    rollExitKeep: 0.3,           // speed kept when a roll ends
    lungeStart: 0.55,            // ground attacks lunge from this fraction of the wind-up
    hurtTime: 0.34, staggerTime: 0.9, knockFriction: 7, braceTime: 0.25, deathFade: 3.5,
    // Soft auto-aim when not locked on: swings snap to a nearby enemy roughly in the intended direction.
    autoTarget: { range: 3.6, cone: 1.75, angleWeight: 1.5 },
  },
  // Ground pound visuals (no gameplay effect). Pools are fixed; the oldest effect is reused first.
  groundPound: { maxRings: 6, maxCracks: 6, maxDust: 60, ringTime: 0.45, crackTime: 4, crackFade: 1.5,
                 dustLife: 0.9, shakeTime: 0.2 },
  block: { damageMul: 0.15, poiseMul: 0.2, knockMul: 0.35, staminaBase: 6, staminaPerDamage: 0.75,
           breakTime: 1.35, hitstop: 0.05 },
  // Parry window is anchored to the enemy's swing: it opens `lead` s before the active phase and
  // closes `grace` s into it. A press stays armed for `arm` s, so a press succeeds only in
  // [active - lead - arm, active + grace] — about a quarter second.
  parry: { cost: 12, arm: 0.1, lead: 0.12, grace: 0.03, time: 0.52, reach: 0.6, hitstop: 0.16,
           riposteTime: 1.1, riposteHitstop: 1.6, flashTime: 0.4, shakeTime: 0.22, shakeAmp: 0.08 },
  rest: { range: 2.4, time: 1.6, blockRange: 10, messageTime: 2.0, respawnOffset: 1.2 },
  // Death: the world slows to a stop, YOU DIED fades in, then the player returns to the last bonfire.
  // The overlay's CSS timings are set from these numbers at load, so they always line up.
  death: { slowTime: 1.4, respawnDelay: 4.8, textDelay: 0.6, textFade: 2.2, hintDelay: 2.6 },
  restartConfirmTime: 2.2,   // R must be pressed twice within this time to restart mid-fight
  bloodstain: { pickupRange: 1.3 },
  enemy: { hitstopScale: 0.0022, hitstopBase: 0.05, hitstopMax: 0.16, knockFriction: 7, accel: 14,
           windupTrack: 0.7,   // fraction of the wind-up during which the enemy still turns
           firstDelay: [0.6, 1.0],   // delay before a fresh enemy's first attack (an enemy can override)
           attackFacing: 0.4,        // must face the player within this angle (rad) to start an attack
           deathFade: 2.0, poiseResetTime: 5,
           riseTime: 1.5, leapVelocity: 6.5, leapSpeed: 6.5, leapTime: 0.5,
           patrolSpeedMul: 0.42, returnSpeedMul: 0.8, homeArrive: 0.6 },
  // How far each placement behaviour notices the player. The one place notice ranges are set.
  notice: { arena: 30, gated: 14, ambush: 7.8, patrol: 9, slumber: 5.5, dummy: 0, sparring: 0 },
  // Levels with `alert`: an enemy that notices the player wakes unaware enemies within `radius`
  // (with a clear line between them), and those pass it on in turn.
  alert: { radius: 10 },
  // Room-style levels: wall thickness, and the size of the stone pillars (solid) and braziers.
  rooms: { wallThickness: 1, pillarSize: 1.2, roomLight: 9, dimLight: 3.5, brazierSize: 0.7 },
  level: { leash: 22,        // give up the chase when the player is this far away...
           homeLeash: 30,    // ...or when dragged this far from home; then walk back home
           gateLiftTime: 1.6, gateLiftGap: 0.3, targetRange: 14, ambushDepth: 0.55 },
  tutorial: { doneTime: 0.9, completeTime: 3.0 },
  nextLevel: { delay: 4.5, fadeTime: 1.2 },   // level with `next`: wait after LEVEL COMPLETE, then fade to black and load it
  fx: { tintTime: 0.22, particleLife: 0.5, particleCount: 180, particleGravity: 12,

const POISE = Object.freeze({ STAGGER: 'poiseStagger', FLINCH: 'poiseFlinch', NONE: 'poiseNone' });   // results of applyPoise
const PLAYER_GROUPS = {
  free: new Set([PS.IDLE, PS.WALK]),                                     // may start any action
  airborne: new Set([PS.JUMP, PS.FALL]),
  attacking: new Set([PS.ATTACK, PS.JUMP_ATTACK]),
  noRegen: new Set([PS.ATTACK, PS.JUMP_ATTACK, PS.LAND, PS.BLOCK, PS.ROLL, PS.PARRY, PS.DEAD]),
  noLockFacing: new Set([PS.ROLL, PS.DEAD, PS.STAGGER, PS.REST, PS.LAND]),

const ENEMY_GROUPS = {
  unaware: new Set([ES.IDLE, ES.PATROL, ES.LURK, ES.RETURN]),           // has not noticed the player
  hidden: new Set([ES.LURK, ES.DORMANT]),                               // not a target yet

const IDLE_BLEND = { [ES.IDLE]: 1, [ES.CHASE]: 0.25, [ES.PATROL]: 0.25, [ES.LURK]: 0.25, [ES.RETURN]: 0.25 };
// Placement behaviours: the state an enemy starts in, and the state it returns to once back home.
const BEHAVIORS = {

  gated: { start: ES.IDLE, home: ES.IDLE },

  patrol: { start: ES.PATROL, home: ES.PATROL },   // walks a short path

// ============================================================================
// 2c. Registries: animations, weapons, idle styles
// ============================================================================
// Each name used in the data must exist here; validateData() checks, and lookups warn and fall back.
function lookup(registry, name, what, fallback) {
  if (name in registry) return registry[name];
  warnOnce(`Unknown ${what} "${name}", using "${fallback}".`);
  return registry[fallback];
}

// Attack animations: (rig, phase, p 0..1 through the phase, dir = mirror for alternating swings).
const ANIMS = {
  sweep(r, phase, p, dir) {
    const { armR, spin, tip, weapon } = r;
    if (phase === PHASE.STARTUP) { armR.rotation.x = lerp(-0.4, -1.7, ease(p)); spin.rotation.y = dir * lerp(0, -1.1, ease(p)); weapon.rotation.x = lerp(0.5, -0.1, ease(p)); }
    else if (phase === PHASE.ACTIVE) { armR.rotation.x = -1.5; spin.rotation.y = dir * lerp(-1.1, 1.2, p); tip.rotation.x = 0.12; weapon.rotation.x = lerp(-0.1, 0.9, p); }
    else { armR.rotation.x = lerp(-1.5, -0.4, ease(p)); spin.rotation.y = dir * lerp(1.2, 0, ease(p)); tip.rotation.x = lerp(0.12, 0, p); weapon.rotation.x = lerp(0.9, 0.5, ease(p)); }
  },
  overhead(r, phase, p) {
    const { armR, tip, weapon } = r;
    if (phase === PHASE.STARTUP) { armR.rotation.x = lerp(-0.4, -3.2, ease(p)); tip.rotation.x = lerp(0, -0.2, ease(p)); weapon.rotation.x = lerp(0.5, 0.1, ease(p)); }
    else if (phase === PHASE.ACTIVE) { armR.rotation.x = lerp(-3.2, -0.7, p); tip.rotation.x = lerp(-0.2, 0.3, p); weapon.rotation.x = lerp(0.1, 0.8, p); }
    else { armR.rotation.x = lerp(-0.7, -0.4, ease(p)); tip.rotation.x = lerp(0.3, 0, ease(p)); weapon.rotation.x = lerp(0.8, 0.5, ease(p)); }
  },
  stab(r, phase, p) {
    const { armR, spin, tip, weapon } = r;
    if (phase === PHASE.STARTUP) { armR.rotation.x = lerp(-0.4, -1.0, ease(p)); spin.rotation.y = lerp(0, -0.8, ease(p)); weapon.rotation.x = lerp(0.5, 1.5, ease(p)); }
    else if (phase === PHASE.ACTIVE) { armR.rotation.x = -1.5; spin.rotation.y = lerp(-0.8, 0.6, p); tip.rotation.x = 0.25; weapon.rotation.x = 1.5; }
    else { armR.rotation.x = lerp(-1.5, -0.4, ease(p)); spin.rotation.y = lerp(0.6, 0, ease(p)); tip.rotation.x = lerp(0.25, 0, p); weapon.rotation.x = lerp(1.5, 0.5, ease(p)); }
  },
  bash(r, phase, p) {
    const { armL, spin, tip } = r;
    if (phase === PHASE.STARTUP) { armL.rotation.x = lerp(-0.1, -1.4, ease(p)); spin.rotation.y = lerp(0, 0.7, ease(p)); tip.rotation.x = lerp(0, -0.1, p); }
    else if (phase === PHASE.ACTIVE) { armL.rotation.x = -1.5; spin.rotation.y = lerp(0.7, -0.6, p); tip.rotation.x = lerp(-0.1, 0.35, p); }
    else { armL.rotation.x = lerp(-1.5, -0.1, ease(p)); spin.rotation.y = lerp(-0.6, 0, ease(p)); tip.rotation.x = lerp(0.35, 0, ease(p)); }
  },
  stomp(r, phase, p) {
    const { armR, armL, tip, legL, kneeL } = r;
    if (phase === PHASE.STARTUP) { legL.rotation.x = lerp(0, -1.5, ease(p)); kneeL.rotation.x = lerp(0, 1.3, ease(p)); tip.rotation.x = lerp(0, -0.16, ease(p)); armR.rotation.x = lerp(-0.4, -2.6, ease(p)); armL.rotation.x = lerp(-0.1, -2.6, ease(p)); }
    else if (phase === PHASE.ACTIVE) { legL.rotation.x = lerp(-1.5, 0, p); kneeL.rotation.x = lerp(1.3, 0, p); tip.rotation.x = lerp(-0.16, 0.2, p); armR.rotation.x = armL.rotation.x = lerp(-2.6, -0.6, p); }
    else { tip.rotation.x = lerp(0.2, 0, ease(p)); armR.rotation.x = lerp(-0.6, -0.4, p); armL.rotation.x = lerp(-0.6, -0.1, p); }
  },
};

// Idle personalities, blended in by weight w (0..1). t is a per-enemy time with its own seed and tempo.
const IDLE_STYLES = {
  guard(r, t, w) {   // stands guard, shifts weight, now and then checks its weapon
    const shift = Math.sin(t * 0.9);
    r.spin.position.x += shift * 0.045 * w; r.tip.rotation.z += shift * 0.03 * w;
    r.legL.rotation.z += Math.max(0, shift) * 0.08 * w; r.legR.rotation.z -= Math.max(0, -shift) * 0.08 * w;
    const check = ease(Math.sin(t * 0.21) * 4 - 3);
    r.armR.rotation.x += -0.9 * check * w; r.weapon.rotation.z += 0.8 * check * w; r.head.rotation.x += 0.35 * check * w;
  },
  still(r, t, w) {   // heavy and still, slow breathing
    const breath = Math.sin(t * 1.1);
    r.spin.scale.y *= 1 + breath * 0.018 * w; r.spin.scale.x *= 1 + breath * 0.012 * w;
    r.tip.rotation.z += Math.sin(t * 0.3) * 0.008 * w;
  },
  twitch(r, t, w) {   // crouched, restless feet, sudden twitches, small pacing circle (visual offset only)
    const step = Math.sin(t * 4) * 0.12 * w;
    r.legL.rotation.x += step; r.legR.rotation.x -= step;
    r.crouch(0.16 * w); r.tip.rotation.x += 0.12 * w;
    const tw = Math.pow(Math.max(0, Math.sin(t * 2.3)), 12);
    r.head.rotation.y += Math.sin(t * 17) * 0.25 * tw * w; r.armR.rotation.x -= 0.4 * tw * w;
    r.root.position.x += Math.cos(t * 0.8) * 0.22 * w; r.root.position.z += Math.sin(t * 0.8) * 0.22 * w;
  },
  sway(r, t, w) {   // slow sway, club resting on the ground and dragging
    r.tip.rotation.z += Math.sin(t * 0.45) * 0.04 * w; r.tip.rotation.x += Math.sin(t * 0.31) * 0.025 * w;
    r.armR.rotation.x = lerp(r.armR.rotation.x, -0.05, w);
    r.weapon.rotation.x = lerp(r.weapon.rotation.x, 1.25, w);
    r.weapon.rotation.y += Math.sin(t * 0.45) * 0.12 * w;
  },
  none() {},
};

// ============================================================================
// 2d. Data check
// ============================================================================
// Verifies every cross-reference and the level ordering rules. Any problem stops the game at load
// with a readable list on screen, instead of a frozen screen or a soft-locked level later.
function validateData() {
  const errors = [];
  const need = (ok, msg) => { if (!ok) errors.push(msg); };
  const num = v => typeof v === 'number' && Number.isFinite(v);
  const checkAttack = (a, owner) => {
    const tag = `${owner} attack "${a && a.id}"`;
    need(a && typeof a.id === 'string', `${owner}: an attack has no id.`);
    if (!a) return;
    need(a.anim in ANIMS, `${tag}: unknown animation "${a.anim}" (known: ${Object.keys(ANIMS).join(', ')}).`);
    need(Array.isArray(a.hits) && a.hits.length > 0 && a.hits.every(h => num(h.startup) && (num(h.active) || h.active === Infinity)),
      `${tag}: "hits" must list { startup, active } for each strike.`);
    need(num(a.recovery) && num(a.damage) && num(a.poise) && num(a.knock), `${tag}: recovery, damage, poise and knock must be numbers.`);
    need(a.box && ['w', 'h', 'd', 'fwd', 'y'].every(k => num(a.box[k])), `${tag}: box needs w, h, d, fwd and y.`);
  };
  // Enemies
  const ids = new Set();
  for (const d of [...ENEMY_DEFS, ...TRAINING_DEFS]) {
    need(typeof d.id === 'string' && !ids.has(d.id), `Enemy "${d.name}": missing or duplicate id "${d.id}".`);
    ids.add(d.id);
    need(d.weapon in WEAPONS, `Enemy "${d.id}": unknown weapon "${d.weapon}".`);
    if (d.offhand) need(d.offhand in OFFHANDS, `Enemy "${d.id}": unknown off-hand "${d.offhand}".`);
    if (d.idle) need(d.idle in IDLE_STYLES, `Enemy "${d.id}": unknown idle style "${d.idle}".`);
    need(num(d.hp) && num(d.scale) && num(d.radius), `Enemy "${d.id}": hp, scale and radius must be numbers.`);
    for (const a of d.attacks) checkAttack(a, `Enemy "${d.id}"`);
  }
  // Player and items
  const M = PLAYER_DEF.moveset;
  for (const a of Object.values(M.attacks)) checkAttack(a, 'Player');
  for (const group of ['ground', 'air'])
    for (const [action, id] of Object.entries(M[group])) need(id in M.attacks, `Player moveset "${group}.${action}": no attack "${id}".`);
  for (const it of PLAYER_DEF.inventory) need(it.item in ITEMS, `Player inventory: unknown item "${it.item}".`);
  need(PLAYER_DEF.look.weapon in WEAPONS, `Player: unknown weapon "${PLAYER_DEF.look.weapon}".`);
  // Levels
  const levelIds = new Set();
  for (const L of LEVELS) {
    const where = `Level "${L.id}"`;
    need(typeof L.id === 'string' && !levelIds.has(L.id), `${where}: missing or duplicate id.`);
    levelIds.add(L.id);
    need(L.layout in BUILDERS, `${where}: unknown layout "${L.layout}".`);
    if (L.next) need(LEVELS.some(o => o.id === L.next), `${where}: next level "${L.next}" does not exist.`);
    if (L.layout === 'rooms') { validateRooms(L, where, need, num); continue; }
    const inX = x => num(x) && x > 0 && x < L.length, inZ = z => num(z) && Math.abs(z) < L.halfZ;
    need(inX(L.start.x) && inZ(L.start.z), `${where}: start point is outside the hall.`);
    const alcoves = new Set(L.alcoves.map(a => a.id));
    need(alcoves.size === L.alcoves.length, `${where}: duplicate alcove ids.`);
    for (const a of L.alcoves) need(inX(a.x) && (a.side === 1 || a.side === -1), `${where}: alcove "${a.id}" needs x inside the hall and side 1 or -1.`);
    let lastGate = 0;
    for (const g of L.gated) {
      const tag = `${where} zone "${g.id}"`;
      need(g.enemy in ENEMY_BY_ID, `${tag}: unknown enemy "${g.enemy}" (known: ${Object.keys(ENEMY_BY_ID).join(', ')}).`);
      need(num(g.trigger) && g.spawn && num(g.spawn.x) && num(g.spawn.z) && num(g.spawn.yaw) && num(g.gateX),
        `${tag}: needs trigger, spawn { x, z, yaw } and gateX.`);
      need(g.trigger < g.spawn.x && g.spawn.x < g.gateX, `${tag}: must be ordered trigger < spawn.x < gateX.`);
      need(g.trigger > lastGate, `${tag}: overlaps the previous zone (zones must be in order along the hall).`);
      need(g.gateX < L.length, `${tag}: gate is past the end of the hall.`);
      lastGate = g.gateX;
    }
    for (const s of L.dispersed) {
      const tag = `${where} enemy "${s.enemy}" (${s.behavior})`;
      need(s.enemy in ENEMY_BY_ID, `${tag}: unknown enemy "${s.enemy}".`);
      need(s.behavior in BEHAVIORS && !BEHAVIORS[s.behavior].training && s.behavior !== 'arena' && s.behavior !== 'gated',
        `${tag}: unknown or unusable behaviour "${s.behavior}" (use ambush, patrol or slumber).`);
      if (s.behavior === 'ambush') need(alcoves.has(s.alcove), `${tag}: unknown alcove "${s.alcove}".`);
      if (s.behavior === 'patrol') need(Array.isArray(s.path) && s.path.length === 2 && s.path.every(inX) && inZ(s.z), `${tag}: patrol needs path [x1, x2] and z inside the hall.`);
      if (s.behavior === 'slumber') need(inX(s.x) && inZ(s.z) && num(s.yaw), `${tag}: needs x, z and yaw inside the hall.`);
    }
    for (const b of L.bonfires) {
      need(inX(b.x) && inZ(b.z), `${where} bonfire "${b.id}": outside the hall.`);
      for (const side of [-1, 1]) {
        const rx = b.x + side * CONFIG.rest.respawnOffset;
        const z = L.gated.find(g => rx >= g.trigger && rx <= g.gateX);
        need(!z, `${where} bonfire "${b.id}": its respawn point (x ${rx.toFixed(1)}) is inside zone "${z && z.id}".`);
      }
    }
    for (const t of L.torches) need(inX(t.x), `${where}: a torch is outside the hall.`);
    if (L.script === 'tutorial') for (const k of ['dummy', 'sparring']) need(L.training && L.training[k] in ENEMY_BY_ID, `${where}: training.${k} must name an enemy.`);
  }
  // Arena and timings
  need(ARENA.layout in BUILDERS && ARENA.enemyStart && ARENA.playerStart, 'Arena: needs a layout, playerStart and enemyStart.');
  const D = CONFIG.death;
  need(D.textDelay + D.textFade <= D.respawnDelay && D.hintDelay < D.respawnDelay, 'CONFIG.death: the YOU DIED text must finish before the respawn.');
  return errors;
}
// Room-style level checks (see LEVEL_2).
function validateRooms(L, where, need, num) {
  const rectOk = r => Array.isArray(r) && r.length === 4 && r.every(num) && r[0] < r[1] && r[2] < r[3];
  for (const R of L.rooms) need(rectOk(R.rect), `${where} room "${R.id}": rect must be [x0, x1, z0, z1] with x0 < x1 and z0 < z1.`);
  if (!L.rooms.every(R => rectOk(R.rect))) return;
  const inside = (x, z) => num(x) && num(z) && insideRooms(L.rooms, x, z, 0.3);
  need(inside(L.start.x, L.start.z), `${where}: start point is outside the rooms.`);
  for (const w of roomWalls(L.rooms))
    need(!L.rooms.some(R => w.x0 < R.rect[1] - 1e-6 && w.x1 > R.rect[0] + 1e-6 && w.z0 < R.rect[3] - 1e-6 && w.z1 > R.rect[2] + 1e-6),
      `${where}: a wall cuts into a room near (${w.x0}, ${w.z0}); rooms must touch edge to edge, not overlap.`);
  const ids = new Set();
  for (const g of L.gated) {
    const tag = `${where} zone "${g.id}"`;
    need(!ids.has(g.id), `${tag}: duplicate id.`); ids.add(g.id);
    need(rectOk(g.trigger), `${tag}: trigger must be a rect [x0, x1, z0, z1].`);
    need(g.gate && num(g.gate.x) && num(g.gate.z) && num(g.gate.width) && (g.gate.along === 'x' || g.gate.along === 'z'),
      `${tag}: gate needs x, z, width and along ('x' or 'z').`);
    need(Array.isArray(g.enemies) && g.enemies.length > 0, `${tag}: needs at least one enemy.`);
    for (const m of g.enemies || []) {
      need(m.enemy in ENEMY_BY_ID, `${tag}: unknown enemy "${m.enemy}".`);
      need(!m.behavior || m.behavior === 'gated' || m.behavior === 'slumber', `${tag}: enemy behaviour must be gated or slumber.`);
      need(m.spawn && inside(m.spawn.x, m.spawn.z) && num(m.spawn.yaw), `${tag}: enemy "${m.enemy}" spawn is outside the rooms.`);
    }
  }
  for (const s of L.dispersed) {
    const tag = `${where} enemy "${s.enemy}" (${s.behavior})`;
    need(s.enemy in ENEMY_BY_ID, `${tag}: unknown enemy "${s.enemy}".`);
    need(s.behavior === 'patrol' || s.behavior === 'slumber', `${tag}: use patrol or slumber in a room level.`);
    if (s.behavior === 'patrol') need(Array.isArray(s.path) && s.path.length === 2 && s.path.every(x => inside(x, s.z)), `${tag}: patrol path is outside the rooms.`);
    if (s.behavior === 'slumber') need(inside(s.x, s.z) && num(s.yaw), `${tag}: needs x, z and yaw inside the rooms.`);
  }
  for (const b of L.bonfires) {
    need(inside(b.x, b.z) && b.spawn && inside(b.spawn.x, b.spawn.z), `${where} bonfire "${b.id}": it and its spawn must be inside the rooms.`);
    const z = b.spawn && L.gated.find(g => rectOk(g.trigger) && inRect(g.trigger, b.spawn.x, b.spawn.z));
    need(!z, `${where} bonfire "${b.id}": its spawn is inside zone "${z && z.id}".`);
  }
}

// ============================================================================
// 3. input
// ============================================================================
const ACTIONS = {
  up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
  jump: ['Space'], roll: ['ShiftLeft', 'ShiftRight'],
  light: ['KeyJ', 'Mouse0'], heavy: ['KeyK', 'Mouse2'],
  block: ['KeyL', 'ControlLeft', 'ControlRight'], parry: ['KeyE'],
  lock: ['KeyQ'], switchTarget: ['Tab'], rest: ['KeyF'], flask: ['KeyG'],
  zoomIn: ['Equal', 'NumpadAdd'], zoomOut: ['Minus', 'NumpadSubtract'],
};
// Keys handled directly by the key handler rather than through ACTIONS.
const SYSTEM_KEYS = { pause: 'Escape', restart: 'KeyR', hitboxes: 'KeyH', help: 'F1' };
// Menu navigation.
const MENU_KEYS = { up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'],
                    right: ['KeyD', 'ArrowRight'], confirm: ['Enter', 'KeyJ'], back: ['Escape'] };
const GAME_CODES = new Set([].concat(...Object.values(ACTIONS), Object.values(SYSTEM_KEYS)));

// Labels built from the live bindings: "[ j / LMB ]" (keyboard first, then mouse), or "[ Space ]".
const KEY_LABELS = { Space: 'Space', ShiftLeft: 'Shift', ShiftRight: 'Shift', ControlLeft: 'Ctrl', ControlRight: 'Ctrl',
  Tab: 'Tab', Escape: 'Esc', Enter: 'Enter', Equal: '=', Minus: '-', NumpadAdd: 'Num +', NumpadSubtract: 'Num -',
  ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', Mouse0: 'LMB', Mouse2: 'RMB' };
function keyLabel(code) {
  if (KEY_LABELS[code]) return KEY_LABELS[code];
  if (code.startsWith('Key')) return code.slice(3).toLowerCase();
  if (code.startsWith('Digit')) return code.slice(5);
  return code;
}
// extraMouse: a mouse input bound outside ACTIONS (the wheel), shown after the key.
function bindLabel(action, extraMouse) {
  const codes = ACTIONS[action];
  const key = codes.find(c => !c.startsWith('Mouse')), mouse = codes.find(c => c.startsWith('Mouse'));
  const parts = [keyLabel(key)];
  if (mouse) parts.push(keyLabel(mouse)); else if (extraMouse) parts.push(extraMouse);
  return `[ ${parts.join(' / ')} ]`;
}
const moveLabel = () => `[ ${['up', 'left', 'down', 'right'].map(a => keyLabel(ACTIONS[a][0])).join(' ')} ]`;
const systemLabel = name => `[ ${keyLabel(SYSTEM_KEYS[name])} ]`;
const menuLabel = name => MENU_KEYS[name].map(keyLabel).join('/');

const input = {
  held: new Set(),
  pressed: new Map(),   // code -> time of press (s); each press is consumed at most once
  now() { return performance.now() / 1000; },
  down(code) { if (!this.held.has(code)) { this.held.add(code); this.pressed.set(code, this.now()); } },
  up(code) { this.held.delete(code); },
  isHeld(action) { return ACTIONS[action].some(c => this.held.has(c)); },
  // True if the action was pressed within the buffer window. Does not consume.
  peek(action) {
    const t = this.now();
    return ACTIONS[action].some(c => this.pressed.has(c) && t - this.pressed.get(c) <= CONFIG.input.buffer);
  },
  consume(action) {
    if (!this.peek(action)) return false;
    for (const c of ACTIONS[action]) this.pressed.delete(c);
    return true;
  },
  // During a hit-pause the buffer clock stops: pending presses age by the frozen time, so none expire.
  hold(dt) { for (const [c, t] of this.pressed) this.pressed.set(c, t + dt); },
  clear() { this.held.clear(); this.pressed.clear(); },
};

// ============================================================================
// "Something happened" channel. Combat, items, bonfires and menus emit; effects, souls and the
// tutorial listen (see registerListeners in the bootstrap). Events:
//   strike {strike, attacker, target, at, blocked}  parry {target}  postureBreak {enemy}
//   enemyDeath {enemy}  playerDeath {player}  rest {bonfire}  gateOpened {gate}  levelComplete
//   itemUsed {item}  land {x, z, fx}  stainRecovered {x, z, souls}  alert {enemy, by}  lock  switchTarget  zoom {dir}
//   pause  resume
const events = {
  handlers: {}, anyHandlers: [],
  on(type, fn) { (this.handlers[type] || (this.handlers[type] = [])).push(fn); },
  onAny(fn) { this.anyHandlers.push(fn); },
  emit(type, data = {}) {
    for (const fn of this.handlers[type] || []) fn(data);
    for (const fn of this.anyHandlers) fn(type, data);
  },
};

const flames = [];   // { group, mesh, light, base, color, seed } flickered every frame
const dust = [];     // { group, points, origin, seeds } drifting motes near light sources

const MAT = {
  stone: new THREE.MeshStandardMaterial({ color: 0x3a3836, roughness: 0.95 }),
  edge: new THREE.MeshStandardMaterial({ color: 0x5a5650, roughness: 0.95 }),
  wall: new THREE.MeshStandardMaterial({ color: 0x45413d, roughness: 0.9 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x2a2826, roughness: 1 }),
  ceiling: new THREE.MeshStandardMaterial({ color: 0x0c0b0d, roughness: 1 }),
  iron: new THREE.MeshStandardMaterial({ color: 0x3b3a3c, roughness: 0.6, metalness: 0.5 }),
  log: new THREE.MeshStandardMaterial({ color: 0x241a12, roughness: 1 }),
  bonfireSword: new THREE.MeshStandardMaterial({ color: 0x55504a, metalness: 0.6, roughness: 0.5 }),
};
const addBox = (group, w, h, d, mat, x, y, z) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); group.add(m); return m;
};
// Floor with a lighter border strip marking the playable limit, and faint grid seams. Shared by every layout.
function addFloor(G, cx, cz, sizeX, sizeZ, border, grid) {
  addBox(G, sizeX, 0.5, sizeZ, MAT.stone, cx, -0.25, cz);
  const x0 = cx - sizeX / 2, x1 = cx + sizeX / 2, z0 = cz - sizeZ / 2, z1 = cz + sizeZ / 2;
  addBox(G, sizeX, 0.02, border, MAT.edge, cx, 0.01, z1 - border / 2);
  addBox(G, sizeX, 0.02, border, MAT.edge, cx, 0.01, z0 + border / 2);
  addBox(G, border, 0.02, sizeZ - border * 2, MAT.edge, x1 - border / 2, 0.01, cz);
  addBox(G, border, 0.02, sizeZ - border * 2, MAT.edge, x0 + border / 2, 0.01, cz);
  for (let x = x0 + grid; x < x1 - 0.01; x += grid) addBox(G, 0.06, 0.012, sizeZ - border * 2, MAT.dark, x, 0.006, cz);
  for (let z = z0 + grid; z < z1 - 0.01; z += grid) addBox(G, sizeX - border * 2, 0.012, 0.06, MAT.dark, cx, 0.006, z);
}
function addDust(group, x, y, z, spread, count) {
  const pos = new Float32Array(count * 3), seeds = [];
  for (let i = 0; i < count; i++) seeds.push({ x: rand(-spread, spread), y: rand(-1, 1.6), z: rand(-spread, spread), s: rand(0, 100), v: rand(0.15, 0.4) });
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const points = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffd9a0, size: 0.035, transparent: true, opacity: 0.4, depthWrite: false }));
  group.add(points);
  dust.push({ group, points, origin: { x, y, z }, seeds });
}
function addFlame(group, x, y, z, size, light, color = 0xffa040) {
  const mesh = new THREE.Mesh(new THREE.ConeGeometry(0.28 * size, 0.95 * size, 7),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, fog: false }));
  mesh.position.set(x, y, z); group.add(mesh);
  if (light) group.add(light);
  flames.push({ group, mesh, light, base: light ? light.intensity : 0, color: light ? light.color.clone() : null, seed: rand(0, 50) });
}
function addBonfire(group, x, z, intensity) {
  for (let i = 0; i < 5; i++) {
    const log = addBox(group, 0.14, 0.14, 0.95, MAT.log, x, 0.12, z);
    log.rotation.y = i * Math.PI / 2.5; log.rotation.x = 0.25;
  }
  const ash = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.85, 0.08, 14), MAT.dark);
  ash.position.set(x, 0.04, z); group.add(ash);
  addBox(group, 0.05, 1.3, 0.09, MAT.bonfireSword, x, 0.7, z).rotation.z = 0.18;
  const light = new THREE.PointLight(0xff8a3c, intensity, 0, 1.0);
  light.position.set(x, 1.4, z);
  addFlame(group, x, 0.62, z, 1, light);
  addDust(group, x, 1.4, z, 2.2, 16);
}
// Iron portcullis spanning the hall at x; returns the group that lifts.
function buildPortcullis(group, x, width, height) {
  const g = new THREE.Group(); g.position.x = x;
  const barGeo = new THREE.BoxGeometry(0.12, height, 0.12);
  for (let z = -width / 2 + 0.25; z <= width / 2 - 0.2; z += 0.5) {
    const b = new THREE.Mesh(barGeo, MAT.iron); b.position.set(0, height / 2, z); g.add(b);
  }
  const railGeo = new THREE.BoxGeometry(0.14, 0.12, width);
  for (let y = 0.6; y < height; y += 1.1) { const r = new THREE.Mesh(railGeo, MAT.iron); r.position.set(0, y, 0); g.add(r); }
  group.add(g); return g;
}

// Layout builders: each returns { group, gates: [{ id, x, mesh, liftHeight }] } in the order of the level's gated list.
function buildArena(A) {
  const G = new THREE.Group(), R = A.pillarRing;
  addFloor(G, 0, 0, A.halfX * 2, A.halfZ * 2, A.border, A.grid);
  const t = A.wallThickness, h = A.wallHeight;
  addBox(G, A.halfX * 2 + t * 2, h, t, MAT.wall, 0, h / 2, A.halfZ + t / 2);
  addBox(G, A.halfX * 2 + t * 2, h, t, MAT.wall, 0, h / 2, -A.halfZ - t / 2);
  addBox(G, t, h, A.halfZ * 2, MAT.wall, A.halfX + t / 2, h / 2, 0);
  addBox(G, t, h, A.halfZ * 2, MAT.wall, -A.halfX - t / 2, h / 2, 0);
  addBox(G, A.outerGround, 0.5, A.outerGround, MAT.dark, 0, -0.3, 0);
  const pillar = (x, z, ph) => {
    addBox(G, R.base, 0.5, R.base, MAT.wall, x, 0.25, z);
    addBox(G, R.size, ph, R.size, MAT.wall, x, ph / 2, z);
    addBox(G, R.base, 0.5, R.base, MAT.wall, x, ph + 0.25, z);
  };
  const px = A.halfX + R.inset, pz = A.halfZ + R.inset;
  for (let x = -px; x <= px + 0.1; x += (px * 2) / 5) { pillar(x, -pz, 8 + Math.abs(x) % 3); pillar(x, pz, 7 + Math.abs(x * 1.7) % 4); }
  for (let z = -pz + 6.6; z < pz - 1; z += 6.6) { pillar(-px, z, 9); pillar(px, z, 6.5 + Math.abs(z) % 3); }
  for (const b of A.bonfires) addBonfire(G, b.x, b.z, A.bonfireLight);
  return { group: G, gates: [] };
}
function buildHall(L) {
  const S = { ...HALL_STYLE, ...(L.style || {}) };
  const G = new THREE.Group(), gates = [];
  const len = L.length, hz = L.halfZ, wh = L.wallHeight, aw = L.alcoveWidth / 2, ah = S.alcoveHeight;
  addBox(G, len + 2, 0.5, (hz + L.alcoveDepth + 1) * 2, MAT.stone, len / 2, -0.25, 0);   // floor under the alcoves too
  addFloor(G, len / 2, 0, len, hz * 2, S.border, S.grid);
  addBox(G, len, 0.012, 0.06, MAT.dark, len / 2, 0.006, 0);
  // Side walls, broken by alcoves.
  for (const side of [1, -1]) {
    const gaps = L.alcoves.filter(a => a.side === side).map(a => [a.x - aw, a.x + aw]).sort((a, b) => a[0] - b[0]);
    let from = -1;
    for (const [g0, g1] of [...gaps, [len + 1, len + 1]]) {
      if (g0 > from) addBox(G, g0 - from, wh, 1, MAT.wall, (from + g0) / 2, wh / 2, side * (hz + 0.5));
      from = g1;
    }
    for (const [g0, g1] of gaps) {
      const d = L.alcoveDepth;
      addBox(G, g1 - g0 + 2, ah, 1, MAT.wall, (g0 + g1) / 2, ah / 2, side * (hz + d + 0.5));
      addBox(G, 1, ah, d, MAT.wall, g0 - 0.5, ah / 2, side * (hz + d / 2));
      addBox(G, 1, ah, d, MAT.wall, g1 + 0.5, ah / 2, side * (hz + d / 2));
      addBox(G, g1 - g0 + 2, 0.3, d + 1, MAT.ceiling, (g0 + g1) / 2, ah, side * (hz + d / 2));
      addBox(G, g1 - g0, wh - ah, 1, MAT.wall, (g0 + g1) / 2, ah + (wh - ah) / 2, side * (hz + 0.5));
    }
  }
  addBox(G, 1, wh, hz * 2 + 2, MAT.wall, -0.5, wh / 2, 0);
  addBox(G, 1, wh, hz * 2 + 2, MAT.wall, len + 0.5, wh / 2, 0);
  addBox(G, len + 2, 0.5, hz * 2 + 2, MAT.ceiling, len / 2, wh + 0.25, 0);
  // Thin pillars along both walls for rhythm (decorative, no collision).
  const nearGap = x => L.alcoves.some(a => Math.abs(a.x - x) < aw + 1) || L.gated.some(g => Math.abs(g.gateX - x) < 1.5);
  for (let x = S.pillarStart; x < len - 1; x += S.pillarEvery) {
    for (const side of [1, -1]) {
      if (nearGap(x)) continue;
      addBox(G, S.pillarSize, wh, S.pillarSize, MAT.wall, x, wh / 2, side * (hz - 0.25));
      addBox(G, 0.75, 0.3, 0.75, MAT.dark, x, 0.15, side * (hz - 0.25));
      addBox(G, 0.75, 0.3, 0.75, MAT.dark, x, wh - 0.6, side * (hz - 0.25));
    }
  }
  // Gates: lintel in the wall above, portcullis below. Each gate object is built from its zone.
  for (const g of L.gated) {
    addBox(G, 1.2, wh - L.gateHeight, hz * 2, MAT.wall, g.gateX, L.gateHeight + (wh - L.gateHeight) / 2, 0);
    gates.push({ id: g.id, x: g.gateX, mesh: buildPortcullis(G, g.gateX, hz * 2, L.gateHeight),
                 liftHeight: L.gateHeight - CONFIG.level.gateLiftGap });
  }
  // Far end: solid wall with a closed exit gate.
  addBox(G, 0.4, S.exitGate.height + 0.2, S.exitGate.width + 0.6, MAT.ceiling, len - 0.05, (S.exitGate.height + 0.2) / 2, 0);
  buildPortcullis(G, len - 0.3, S.exitGate.width, S.exitGate.height);
  for (const b of L.bonfires) addBonfire(G, b.x, b.z, S.bonfireLight);
  const T = S.torch;
  for (const t of L.torches) {
    const z = t.side * (hz - 0.15);
    addBox(G, 0.12, 0.5, 0.12, MAT.iron, t.x, T.mountHeight, z);
    const light = new THREE.PointLight(T.color, T.intensity, T.range, 1.0);
    light.position.set(t.x, T.lightHeight, t.side * (hz - 0.7));
    addFlame(G, t.x, T.flameHeight, z, T.flameSize, light);
    addDust(G, t.x, T.mountHeight, t.side * (hz - 1.6), 1.6, 10);
  }
  return { group: G, gates };
}
// Room-style levels: each room gets its own floor, wall and light colours. Pillars are solid.
// Also returns `solids`: the wall and pillar boxes bodies and the camera collide with.
function buildRooms(L) {
  const G = new THREE.Group(), gates = [], solids = [], C = CONFIG.rooms, wh = L.wallHeight;
  const mats = new Map();
  const matsFor = room => {
    if (!mats.has(room)) mats.set(room, {
      floor: new THREE.MeshStandardMaterial({ color: room.floor, roughness: 0.95 }),
      wall: new THREE.MeshStandardMaterial({ color: room.wall, roughness: 0.9 }),
    });
    return mats.get(room);
  };
  for (const room of L.rooms) {
    const [x0, x1, z0, z1] = room.rect, w = x1 - x0, d = z1 - z0, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, M = matsFor(room);
    addBox(G, w, 0.5, d, M.floor, cx, -0.25, cz);
    for (let x = x0 + 4; x < x1 - 0.01; x += 4) addBox(G, 0.06, 0.012, d, MAT.dark, x, 0.006, cz);
    for (let z = z0 + 4; z < z1 - 0.01; z += 4) addBox(G, w, 0.012, 0.06, MAT.dark, cx, 0.006, z);
    addBox(G, w, 0.5, d, MAT.ceiling, cx, wh + 0.25, cz);
    const light = new THREE.PointLight(room.light, room.dim ? C.dimLight : C.roomLight, Math.max(w, d) * 1.3, 1.0);
    light.position.set(cx, wh - 1.5, cz); G.add(light);
    for (const [px, pz] of room.pillars || []) {
      const s = C.pillarSize;
      addBox(G, s, wh, s, M.wall, px, wh / 2, pz);
      addBox(G, s + 0.4, 0.4, s + 0.4, MAT.dark, px, 0.2, pz);
      addBox(G, s + 0.4, 0.4, s + 0.4, MAT.dark, px, wh - 0.5, pz);
      solids.push({ x0: px - s / 2, x1: px + s / 2, z0: pz - s / 2, z1: pz + s / 2 });
    }
    for (const [bx, bz] of room.braziers || []) {
      addBox(G, 0.5, 1.0, 0.5, MAT.iron, bx, 0.5, bz);
      addBox(G, 0.8, 0.15, 0.8, MAT.iron, bx, 1.05, bz);
      addFlame(G, bx, 1.45, bz, C.brazierSize, null, new THREE.Color(room.light).lerp(new THREE.Color(0xffffff), 0.35).getHex());
    }
  }
  for (const b of roomWalls(L.rooms)) {
    addBox(G, b.x1 - b.x0, wh, b.z1 - b.z0, matsFor(b.room).wall, (b.x0 + b.x1) / 2, wh / 2, (b.z0 + b.z1) / 2);
    solids.push(b);
  }
  // Gates: a lintel above, a portcullis below; the closed portcullis is a solid box across the doorway.
  const t = L.gateThickness, gh = L.gateHeight;
  for (const z of L.gated) {
    const g = z.gate, alongX = g.along === 'x';
    addBox(G, alongX ? g.width : 1.2, wh - gh, alongX ? 1.2 : g.width, MAT.wall, g.x, gh + (wh - gh) / 2, g.z);
    const mesh = buildPortcullis(G, g.x, g.width, gh);
    mesh.position.z = g.z; if (alongX) mesh.rotation.y = Math.PI / 2;
    const box = alongX ? { x0: g.x - g.width / 2, x1: g.x + g.width / 2, z0: g.z - t / 2, z1: g.z + t / 2 }
                       : { x0: g.x - t / 2, x1: g.x + t / 2, z0: g.z - g.width / 2, z1: g.z + g.width / 2 };
    gates.push({ id: z.id, x: g.x, z: g.z, box, mesh, liftHeight: gh - CONFIG.level.gateLiftGap });
  }
  for (const b of L.bonfires) addBonfire(G, b.x, b.z, HALL_STYLE.bonfireLight);
  return { group: G, gates, solids };
}
const BUILDERS = { arena: buildArena, hall: buildHall, rooms: buildRooms };

// The geometry of the current level. Built when the level starts and torn down when another one does.
let stage = null;
function loadStage(def) {
  if (stage && stage.id === def.id) return stage;
  if (stage) {
    scene.remove(stage.group);
    stage.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.isMesh && o.material && !Object.values(MAT).includes(o.material)) o.material.dispose(); });
    for (let i = flames.length - 1; i >= 0; i--) if (flames[i].group === stage.group) flames.splice(i, 1);
    for (let i = dust.length - 1; i >= 0; i--) if (dust[i].group === stage.group) dust.splice(i, 1);
  }
  const built = BUILDERS[def.layout](def);
  scene.add(built.group);
  applyAtmosphere(def);
  stage = { id: def.id, ...built };
  return stage;
}

// Walkable space for the current level: a rectangle, side alcoves and closed gates.
function makeWorld(def, st) {
  if (def.layout === 'arena')
    return { minX: -def.halfX, maxX: def.halfX, halfZ: def.halfZ, ceiling: Infinity, alcoves: [], gates: [], gateThickness: 0, bonfires: def.bonfires };
  if (def.layout === 'rooms')   // `solids`: walls and pillars; closed gates are added to them where needed
    return { rooms: def.rooms, solids: st.solids, ceiling: def.wallHeight, bonfires: def.bonfires,
             gates: st.gates.map(g => ({ ...g, open: false, lift: 0 })) };
  return { minX: 0, maxX: def.length, halfZ: def.halfZ, ceiling: def.wallHeight, gateThickness: def.gateThickness, bonfires: def.bonfires,
           gates: st.gates.map(g => ({ ...g, open: false, lift: 0 })),
           alcoves: def.alcoves.map(a => ({ x0: a.x - def.alcoveWidth / 2, x1: a.x + def.alcoveWidth / 2, side: a.side, depth: def.alcoveDepth })) };
}
let world = null;

const WARN_COLOR = new THREE.Color(0xff3a1a);
const HURT_COLOR = new THREE.Color(0xff1010);
const HIT_COLOR = new THREE.Color(0xffffff);
const CRACK_COLOR = new THREE.Color(0xffc060);
const UNIT_BOX = new THREE.BoxGeometry(1, 1, 1);
const shadowGeo = new THREE.CircleGeometry(1, 20);

// Humanoid built from primitives. Local +Z is forward; the weapon arm is on -X.
const HIP = 0.95, LEG_SEG = 0.45;   // hip pivot height; thigh and shin length
class Rig {
  constructor({ scale, bulk, color, weapon, weaponColor, offhand }) {
    const W = lookup(WEAPONS, weapon, 'weapon', 'sword');
    const body = new THREE.MeshStandardMaterial({ color, roughness: 0.65, metalness: 0.05, transparent: true });
    const dark = new THREE.MeshStandardMaterial({ color: new THREE.Color(color).multiplyScalar(0.6), roughness: 0.8, metalness: 0.05, transparent: true });
    this.weaponBase = new THREE.Color(weaponColor ?? W.color);
    this.weaponMat = new THREE.MeshStandardMaterial({ color: this.weaponBase, roughness: 0.4, metalness: 0.2, transparent: true });
    this.bodyMats = [body, dark];
    this.mats = [body, dark, this.weaponMat];
    const part = (parent, geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; };
    const pivot = (parent, x, y, z) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; };
    this.root = new THREE.Group();
    this.tip = pivot(this.root, 0, 0, 0);          // tips over at the feet
    this.spin = pivot(this.tip, 0, HIP, 0);        // twists / tumbles at the hips
    part(this.spin, new THREE.BoxGeometry(0.56, 0.72, 0.32), body, 0, 0.32, 0);
    part(this.spin, new THREE.BoxGeometry(0.5, 0.14, 0.3), dark, 0, -0.05, 0);
    this.head = pivot(this.spin, 0, 0.72, 0);
    part(this.head, new THREE.SphereGeometry(0.17, 14, 10), body, 0, 0.12, 0);
    this.legL = pivot(this.spin, 0.15, -0.05, 0);
    this.legR = pivot(this.spin, -0.15, -0.05, 0);
    // Thigh + shin with a knee, so lowering the hips bends the legs instead of sinking the feet.
    this.kneeL = pivot(this.legL, 0, -LEG_SEG, 0);
    this.kneeR = pivot(this.legR, 0, -LEG_SEG, 0);
    for (const leg of [this.legL, this.legR]) part(leg, new THREE.BoxGeometry(0.2, LEG_SEG + 0.02, 0.22), dark, 0, -LEG_SEG / 2, 0);
    for (const knee of [this.kneeL, this.kneeR]) part(knee, new THREE.BoxGeometry(0.18, LEG_SEG + 0.02, 0.2), dark, 0, -LEG_SEG / 2, 0);
    this.armL = pivot(this.spin, 0.37, 0.6, 0);
    this.armR = pivot(this.spin, -0.37, 0.6, 0);
    for (const arm of [this.armL, this.armR]) part(arm, new THREE.BoxGeometry(0.16, 0.62, 0.16), body, 0, -0.31, 0);
    this.weapon = pivot(this.armR, 0, -0.6, 0);
    W.build((geo, mat, x, y, z) => part(this.weapon, geo, mat, x, y, z), this.weaponMat, dark);
    if (offhand) {
      const O = lookup(OFFHANDS, offhand, 'off-hand', 'shield');
      const mat = new THREE.MeshStandardMaterial({ color: O.color, roughness: 0.5, metalness: 0.4, transparent: true });
      this.mats.push(mat);
      O.build((geo, m, x, y, z) => part(this.armL, geo, m, x, y, z), mat);
    }
    this.root.scale.set(scale * bulk, scale, scale * bulk);
    this.shadow = new THREE.Mesh(shadowGeo, new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45, depthWrite: false }));
    this.shadow.rotation.x = -Math.PI / 2;

// Where an attack is at time t: { phase, hitIndex, p (0..1 through the phase), done }.

    t -= h.startup;

// 5. Player
// ============================================================================
// Inventory: { itemId: { count, max } }, created from the player definition.
const makeInventory = list => Object.fromEntries(list.map(it => [it.item, { count: it.count, max: it.max }]));

  constructor(def, x, z, yaw, carry) {

    this.radius = def.radius; this.height = BODY_HEIGHT * def.look.scale;
    this.maxHp = def.stats.maxHp; this.maxStamina = def.stats.maxStamina; this.maxPoise = def.stats.maxPoise;
    this.inventory = carry ? carry.inventory : makeInventory(def.inventory);
    this.souls = 0;
    this.x = x; this.y = 0; this.z = z; this.yaw = yaw;
    this.vx = this.vy = this.vz = 0; this.kx = this.kz = 0;
    this.hp = this.maxHp; this.stamina = this.maxStamina; this.poise = this.maxPoise;
    this.staminaDelay = 0; this.poiseTimer = 0; this.tint = 0; this.flash = 0; this.brace = 0; this.walkPhase = 0;

        if (this.stateTime >= this.stunTime) {
          if (this.state === PS.STAGGER) this.poise = this.maxPoise;
          this.setState(PS.IDLE);
        }
        break;
      }
      case PS.DEAD: approachVel(this, 0, 0, C.decel * dt); break;
    }
    // Locked on: keep facing the target, except while committed to a roll or a swing already released.
    const released = (this.state === PS.ATTACK && this.attackPhase() !== PHASE.STARTUP) || (this.state === PS.JUMP_ATTACK && this.hitbox);
    if (face !== null && !this.in('noLockFacing') && !released)
      this.yaw = turnToward(this.yaw, Math.atan2(lock.x - this.x, lock.z - this.z), CONFIG.lock.turnRate * dt);

    integrateBody(this, dt, C.knockFriction);
    if (this.y <= 0 && this.in('airborne') && this.vy <= 0 && this.stateTime > 0) this.setState(PS.IDLE);
    if (this.y <= 0 && this.state === PS.JUMP_ATTACK && this.vy <= 0 && this.stateTime > 0) {
      // Touchdown: a swing still in wind-up strikes on impact; the hitbox lingers for impactTime.
      const a = this.attack;
      if (!this.hitbox) this.hitbox = new Hitbox(this, a.box, this.payload);
      this.landHit = false; this.landTime = a.recovery;
      this.vx *= C.landKeep; this.vz *= C.landKeep;
      this.setState(PS.LAND);
      events.emit('land', { x: this.x, z: this.z, fx: a.air.fx });
    }
    this.walkPhase += Math.hypot(this.vx, this.vz) * dt * 2.6;
  }

  // Damage, block, guard break, hurt and stagger from one strike. Returns { blocked, died }.
  takeHit(strike, from) {
    const B = CONFIG.block, C = CONFIG.player;
    const dx = this.x - from.x, dz = this.z - from.z, d = Math.hypot(dx, dz) || 1;
    let damage = strike.damage, poise = strike.poise, knock = strike.knock, blocked = false, guardBroken = false;
    if (this.state === PS.BLOCK && isInFront(this, from.x, from.z)) {
      this.spend(B.staminaBase + strike.damage * B.staminaPerDamage);
      if (this.stamina <= 0) guardBroken = true;
      else { blocked = true; damage *= B.damageMul; poise *= B.poiseMul; knock *= B.knockMul; }
    }
    this.hp = Math.max(0, this.hp - damage);
    this.kx += dx / d * knock; this.kz += dz / d * knock;
    if (blocked) this.brace = 1; else this.tint = 1;
    if (this.hp <= 0) { this.hitbox = null; this.setState(PS.DEAD); return { blocked, died: true }; }
    if (guardBroken) { this.hitbox = null; this.stunTime = B.breakTime; this.poise = this.maxPoise; this.setState(PS.STAGGER); return { blocked: false }; }
    if (blocked) {
      if (poise > 0) { this.poise = Math.max(1, this.poise - poise); this.poiseTimer = 0; }
      return { blocked: true };
    }
    const r = applyPoise(this, poise, this.isCommitted(), this.maxPoise);
    if (r !== POISE.NONE) {   // a jump attack still in its air wind-up is cancelled too
      this.hitbox = null;
      this.stunTime = r === POISE.STAGGER ? C.staggerTime : C.hurtTime;
      this.setState(r === POISE.STAGGER ? PS.STAGGER : PS.HURT);
    }
    return { blocked: false };
  }

  pose(tt, ctx) {
    const r = this.rig, C = CONFIG.player;
    r.reset(); r.setOpacity(1);
    switch (this.state) {
      case PS.IDLE: r.spin.scale.y = 1 + Math.sin(ctx.t * 1.6) * 0.012; r.armL.rotation.z = 0.04; break;
      case PS.WALK: r.walk(this.walkPhase, 0.6); break;
      case PS.JUMP: case PS.FALL:
        r.legL.rotation.x = -0.5; r.legR.rotation.x = 0.3; r.kneeL.rotation.x = 0.9; r.kneeR.rotation.x = 0.5; r.armL.rotation.x = -0.9; r.armR.rotation.x = -0.9; break;
      case PS.ROLL: {
        const p = clamp(tt / C.rollTime, 0, 1), tuck = Math.sin(p * Math.PI);
        r.spin.rotation.x = p * Math.PI * 2;
        r.spin.scale.setScalar(1 - 0.35 * tuck); r.spin.position.y = HIP - 0.4 * tuck;
        r.legL.rotation.x = r.legR.rotation.x = -1.2 * tuck; r.kneeL.rotation.x = r.kneeR.rotation.x = 2.0 * tuck; r.armL.rotation.x = r.armR.rotation.x = -1.2 * tuck;
        break;
      }
      case PS.ATTACK: {
        const tl = attackTimeline(this.attack, tt);
        poseAttack(r, this.attack, tl.phase, tl.p, tl.hitIndex);
        break;
      }
      case PS.JUMP_ATTACK: {
        const a = this.attack;
        if (tt < this.activeAt) poseAttack(r, a, PHASE.STARTUP, tt / a.hits[0].startup);   // wind-up in the air
        else poseAttack(r, a, PHASE.ACTIVE, ease((tt - this.activeAt) / 0.2));            // driving down
        r.legL.rotation.x += -0.7; r.kneeL.rotation.x = 1.1; r.legR.rotation.x += 0.15; r.kneeR.rotation.x = 0.9;
        break;
      }
      case PS.LAND: {
        const k = 1 - ease(tt / Math.max(this.landTime, 0.01));
        poseAttack(r, this.attack, PHASE.ACTIVE, 1);
        r.crouch(0.08 + 0.3 * k); r.lean(0.3 * k);
        break;
      }
      case PS.BLOCK:
        r.walk(this.walkPhase, 0.3 * clamp(Math.hypot(this.vx, this.vz) / 2, 0, 1));   // short guarded steps
        r.armR.rotation.set(-1.45, 0, -0.5); r.weapon.rotation.set(0.2, 0, 1.2); r.armL.rotation.x = -1.3; r.tip.rotation.x = 0.06; break;
      case PS.PARRY: {
        // Quick outward deflection, then an exposed recovery.
        const out = ease(tt / 0.12), back = ease((tt - 0.12) / (CONFIG.parry.time - 0.12));
        const k = out * (1 - back);
        r.armR.rotation.set(lerp(-0.4, -1.7, k), 0, -0.6 * k); r.spin.rotation.y = 0.9 * k;
        r.weapon.rotation.set(lerp(0.5, 0.1, k), 0, 1.0 * k); r.armL.rotation.x = -0.6 * k;
        break;
      }
      case PS.USE_ITEM: {
        const k = Math.sin(clamp(tt / this.usingItem.useTime, 0, 1) * Math.PI);
        r.armL.rotation.set(-2.3 * k, 0, -0.5 * k); r.head.rotation.x = -0.4 * k; break;
      }
      case PS.REST: {
        const k = Math.sin(clamp(tt / CONFIG.rest.time, 0, 1) * Math.PI);
        r.kneel(k); r.lean(0.2 * k); r.head.rotation.x = 0.4 * k; break;
      }
      case PS.HURT: case PS.STAGGER: flinchPose(r, this.state === PS.STAGGER, tt / this.stunTime, tt); break;
      case PS.DEAD: deathPose(r, tt, C.deathFade); break;
    }
    if (this.brace > 0) { r.crouch(0.12 * this.brace); r.tip.rotation.x -= 0.14 * this.brace; }
    r.applyLag(ctx.yaw, Math.hypot(this.vx, this.vz), ctx.dt);
    if (this.state === PS.JUMP_ATTACK && !this.hitbox) r.setWarning(1);   // same telegraph colour as enemy wind-ups
    else r.setFlash(Math.max(this.flash, this.riposte > 0 ? 0.3 : 0));
    r.setTint(HURT_COLOR, this.tint * 0.9);
  }
}

// ============================================================================
// 6. Enemy
// ============================================================================
// opts: x, z, yaw, behavior (a key of BEHAVIORS), notice, leash, homeLeash, path
class Enemy {
  constructor(def, opts) {
    const E = CONFIG.enemy, B = lookup(BEHAVIORS, opts.behavior, 'behaviour', 'gated');
    this.def = def;
    this.rig = new Rig({ scale: def.scale, bulk: def.bulk, color: def.color, weapon: def.weapon, offhand: def.offhand });
    this.radius = def.radius; this.height = BODY_HEIGHT * def.scale;
    this.behavior = opts.behavior; this.notice = opts.notice;
    this.leash = opts.leash ?? Infinity; this.homeLeash = opts.homeLeash ?? Infinity;
    this.home = { x: opts.x, z: opts.z, yaw: opts.yaw, state: B.home };
    this.path = opts.path || null; this.pathZ = opts.z; this.pathDir = 1;
    this.x = opts.x; this.y = 0; this.z = opts.z; this.yaw = opts.yaw;
    this.vx = this.vy = this.vz = 0; this.kx = this.kz = 0;
    this.hp = def.hp; this.poise = def.poise; this.poiseTimer = 0; this.tint = 0; this.walkPhase = 0;
    this.posture = 0; this.chainTime = Infinity;   // boss posture and time since the last landed hit
    this.guardMeter = 0; this.guardTime = 0;         // guard or stagger meter, and time since it last filled
    this.crack = 0;                                  // visual: posture-break flash
    this.recoil = 0; this.recoilF = 0; this.recoilS = 0;   // visual: knockback lean in local axes
    this.seed = rand(0, 1000); this.tempo = rand(0.85, 1.2);   // idle personality offsets
    this.rewarded = false;                           // death already announced (souls granted)
    this.training = !!B.training;                    // tutorial dummy: rooted, never dies
    this.immovable = this.training;
    this.discovered = this.training;                 // has had its one-time auto lock-on (dummies never do)
    this.state = B.start; this.stateTime = 0;
    const fd = def.firstDelay || E.firstDelay;
    this.cooldown = rand(fd[0], fd[1]); this.next = null; this.attack = null; this.hitIndex = 0; this.hitbox = null;
    this.savePrev();
  }
  savePrev() { this.px = this.x; this.py = this.y; this.pz = this.z; this.pyaw = this.yaw; }
  setState(s) { this.state = s; this.stateTime = 0; }
  in(group) { return ENEMY_GROUPS[group].has(this.state); }
  alive() { return this.state !== ES.DEAD; }
  awake() { return !this.in('hidden'); }   // visible and engaged enough to be a target
  isCommitted() { return this.state === ES.ACTIVE; }
  // Shield up: guarding enemies hold it whenever they are not attacking, reeling or down.
  // The shield drops as soon as it picks an attack and closes in to use it (and stays down through the swing).
  guarding() {
    if (!this.def.guard || !ENEMY_GROUPS.guarding.has(this.state)) return false;
    // Lowered only in the last stretch before a swing (within reach of the chosen attack, plus a step).
    return !(this.state === ES.CHASE && this.next && this.playerDist <= this.next.range + this.def.guard.lowerReach);
  }
  // Woken by another enemy's alert. Returns true if this changed anything.
  wake() {
    if (this.training || !this.alive()) return false;
    if (this.state === ES.DORMANT) this.setState(ES.RISE);
    else if (this.in('unaware')) this.setState(ES.CHASE);
    else return false;
    return true;
  }

  update(dt, player) {
    const d = this.def, E = CONFIG.enemy;
    this.stateTime += dt;
    this.tint = Math.max(0, this.tint - dt / CONFIG.fx.tintTime);
    this.crack = Math.max(0, this.crack - dt / CONFIG.fx.crackTime);
    this.recoil = Math.max(0, this.recoil - dt / CONFIG.fx.recoilTime);
    this.chainTime += dt;
    if (this.training) { this.updateTraining(dt); return; }
    const M = d.guard || d.stagger;
    if (M && this.state !== ES.BROKEN && (this.guardTime += dt) > M.decayDelay)
      this.guardMeter = Math.max(0, this.guardMeter - M.decay * dt);
    tickPoise(this, dt, E.poiseResetTime, d.poise);
    // Posture holds while the boss is open from a parry, so the riposte window can build on it.
    if (d.posture && this.state !== ES.BROKEN && this.state !== ES.PARRIED && !player.isAttacking())
      this.posture = Math.max(0, this.posture - d.posture.decay * dt);
    const dx = player.x - this.x, dz = player.z - this.z, dist = Math.hypot(dx, dz) || 1e-6;
    this.playerDist = dist;
    const toPlayer = Math.atan2(dx, dz);
    const playerAlive = player.alive();
    const sees = playerAlive && dist < this.notice && !gateBetween(this, player);
    let tx = 0, tz = 0;

    switch (this.state) {
      case ES.IDLE:
        if (sees) this.setState(ES.CHASE);
        break;
      case ES.PATROL: {
        if (sees) { this.setState(ES.CHASE); break; }
        const goal = this.path[this.pathDir > 0 ? 1 : 0], gx = goal - this.x, gz = this.pathZ - this.z, gd = Math.hypot(gx, gz);
        if (gd < 0.3) this.pathDir *= -1;
        else {
          const sp = d.speed * E.patrolSpeedMul;
          tx = gx / gd * sp; tz = gz / gd * sp;
          this.yaw = turnToward(this.yaw, Math.atan2(gx, gz), d.turnRate * dt);
        }
        break;
      }
      case ES.LURK:   // hidden in an alcove until the player passes close
        if (sees) {
          this.yaw = toPlayer; this.vy = E.leapVelocity;
          this.vx = dx / dist * E.leapSpeed; this.vz = dz / dist * E.leapSpeed;
          this.setState(ES.LEAP);
        }
        break;
      case ES.LEAP:
        tx = this.vx; tz = this.vz;
        if (this.stateTime >= E.leapTime && this.y <= 0) { this.cooldown = d.cooldown[0]; this.setState(ES.CHASE); }
        break;
      case ES.DORMANT:   // lying on the floor
        if (sees) this.setState(ES.RISE);
        break;
      case ES.RISE:
        if (this.stateTime >= E.riseTime) { this.cooldown = d.cooldown[0]; this.setState(ES.CHASE); }
        break;
      case ES.RETURN: {   // lost the player: walk back home, then resume the home behaviour
        if (sees) { this.setState(ES.CHASE); break; }
        const hx = this.home.x - this.x, hz = this.home.z - this.z, hd = Math.hypot(hx, hz);
        if (hd < E.homeArrive) { this.yaw = this.home.yaw; this.setState(this.home.state); break; }
        const sp = d.speed * E.returnSpeedMul;
        tx = hx / hd * sp; tz = hz / hd * sp;
        this.yaw = turnToward(this.yaw, Math.atan2(hx, hz), d.turnRate * dt);
        break;
      }
      case ES.CHASE: {
        const farFromHome = Math.hypot(this.x - this.home.x, this.z - this.home.z) > this.homeLeash;
        if (!playerAlive || dist > this.leash || farFromHome || gateBetween(this, player)) { this.next = null; this.setState(ES.RETURN); break; }
        this.yaw = turnToward(this.yaw, toPlayer, d.turnRate * dt);
        this.cooldown -= dt;
        if (this.cooldown <= 0 && !this.next) this.next = d.attacks[Math.floor(Math.random() * d.attacks.length)];
        const want = this.next ? this.next.range : d.holdRange;
        if (dist > want) { tx = dx / dist * d.speed; tz = dz / dist * d.speed; }
        else if (this.next && Math.abs(angDiff(toPlayer, this.yaw)) < E.attackFacing) {
          this.attack = this.next; this.next = null; this.hitIndex = 0; this.setState(ES.WINDUP);
        }
        break;
      }
      case ES.WINDUP: {
        const hit = this.attack.hits[this.hitIndex];
        if (this.stateTime < hit.startup * E.windupTrack) this.yaw = turnToward(this.yaw, toPlayer, d.trackRate * dt);
        if (this.stateTime >= hit.startup) this.strike();
        break;
      }
      case ES.ACTIVE: {
        tx = Math.sin(this.yaw) * this.attack.lunge; tz = Math.cos(this.yaw) * this.attack.lunge;
        this.endStrikeWhenDone();
        break;
      }
      case ES.RECOVER:
        if (this.stateTime >= this.attack.recovery) { this.cooldown = rand(d.cooldown[0], d.cooldown[1]); this.setState(ES.CHASE); }
        break;
      case ES.HURT:
        if (this.stateTime >= d.flinchTime) { this.cooldown = Math.max(this.cooldown, d.cooldown[0]); this.setState(ES.CHASE); }
        break;
      case ES.STAGGER:
        if (this.stateTime >= d.staggerTime) { this.poise = d.poise; this.cooldown = d.cooldown[0]; this.setState(ES.CHASE); }
        break;
      case ES.PARRIED:
        if (this.stateTime >= d.parriedTime) { this.poise = d.poise; this.cooldown = d.cooldown[0]; this.setState(ES.CHASE); }
        break;
      case ES.BROKEN:
        if (this.stateTime >= (d.posture || d.guard || d.stagger).breakTime) { this.posture = 0; this.guardMeter = 0; this.cooldown = d.cooldown[0]; this.setState(ES.CHASE); }
        break;
      case ES.DEAD: break;
    }

    approachVel(this, tx, tz, E.accel * dt);
    integrateBody(this, dt, E.knockFriction);
    this.walkPhase += Math.hypot(this.vx, this.vz) * dt * 2.6 / d.scale;
  }
  // The strike timeline shared by all enemies: windup -> active (per hit) -> recover.
  strike() { this.hitbox = new Hitbox(this, this.attack.box, makeStrike(this.attack)); this.setState(ES.ACTIVE); }
  endStrikeWhenDone() {
    if (this.stateTime < this.attack.hits[this.hitIndex].active) return;
    this.hitbox = null;
    if (this.hitIndex + 1 < this.attack.hits.length) { this.hitIndex++; this.setState(ES.WINDUP); }
    else this.setState(ES.RECOVER);
  }
  // Training dummies stay rooted. The sparring variant loops one slow, telegraphed swing.
  updateTraining() {
    if (!this.def.attacks.length) return;
    switch (this.state) {
      case ES.IDLE: if (this.stateTime >= this.def.restTime) { this.attack = this.def.attacks[0]; this.hitIndex = 0; this.setState(ES.WINDUP); } break;
      case ES.WINDUP: if (this.stateTime >= this.attack.hits[this.hitIndex].startup) this.strike(); break;
      case ES.ACTIVE: this.endStrikeWhenDone(); break;
      case ES.RECOVER: if (this.stateTime >= this.attack.recovery) this.setState(ES.IDLE); break;
      case ES.PARRIED: if (this.stateTime >= this.def.parriedTime) this.setState(ES.IDLE); break;
    }
  }

  // Boss posture: add, and break when full. Returns true if this broke the posture.
  addPosture(amount) {
    const P = this.def.posture;
    if (!P || this.state === ES.BROKEN) return false;
    this.posture = Math.min(P.max, this.posture + amount);
    if (this.posture < P.max) return false;
    this.hitbox = null; this.next = null; this.crack = 1;
    this.setState(ES.BROKEN);
    return true;
  }
  // A successful parry ends the current attack and leaves the enemy open. Returns true on a posture break.
  getParried() {
    this.hitbox = null; this.next = null;
    if (this.def.posture) {
      this.chainTime = 0;   // a parry starts a hit chain: the riposte builds posture straight away
      if (this.addPosture(this.def.posture.parry)) return true;
    }
    this.setState(ES.PARRIED);
    return false;
  }

  // One strike from `from`. Returns { broke (posture), died }.
  takeHit(strike, from) {
    const dx = this.x - from.x, dz = this.z - from.z, d = Math.hypot(dx, dz) || 1;
    const kx = dx / d * strike.knock, kz = dz / d * strike.knock;
    const s = Math.sin(this.yaw), c = Math.cos(this.yaw);
    this.recoil = 1; this.recoilF = (dx * s + dz * c) / d; this.recoilS = (dz * s - dx * c) / d;
    this.tint = 1;
    if (this.training) { this.hp = Math.max(1, this.hp - strike.damage); return { broke: false, died: false }; }   // flash and recoil only
    const def = this.def, P = def.posture;
    if (this.guarding() && Math.abs(angDiff(Math.atan2(from.x - this.x, from.z - this.z), this.yaw)) < def.guard.arc)
      return this.blockHit(strike, kx, kz);
    this.hp = Math.max(0, this.hp - strike.damage * (P && this.state === ES.BROKEN ? P.damageMul : 1));
    this.kx += kx; this.kz += kz;
    if (this.hp <= 0) { this.hitbox = null; this.next = null; this.setState(ES.DEAD); return { broke: false, died: true }; }
    if (P) {
      // Bosses ignore interrupts; only chained hits build posture.
      const chained = this.chainTime <= P.chainGap;
      this.chainTime = 0;
      if (this.in('unaware') || this.state === ES.DORMANT) this.setState(ES.CHASE);
      return { broke: chained && this.addPosture(strike.postureDmg), died: false };
    }
    if (this.in('shrugsHits') || this.state === ES.BROKEN) return { broke: false, died: false };   // a broken guard: no flinch
    if (this.state === ES.DORMANT) { this.setState(ES.RISE); return { broke: false, died: false }; }
    const unaware = this.in('unaware');
    const M = def.stagger || def.guard;
    if (M) {   // stagger/guard meter instead of poise: hits never interrupt until the meter fills
      if (unaware) this.setState(ES.CHASE);
      return { broke: this.fillMeter(M, strike.attackId), died: false };
    }
    const r = applyPoise(this, strike.poise, this.isCommitted(), def.poise);
    if (r === POISE.STAGGER) { this.hitbox = null; this.next = null; this.setState(ES.STAGGER); }
    else if (r === POISE.FLINCH && def.flinchTime > 0 && this.in('canFlinch')) this.setState(ES.HURT);
    else if (unaware) this.setState(ES.CHASE);
    return { broke: false, died: false };
  }

  // A strike taken on the shield: reduced damage, little push, and it fills the guard meter
  // (heavy attacks more than light ones). A full meter breaks the guard.
  blockHit(strike, kx, kz) {
    const G = this.def.guard;
    this.hp = Math.max(0, this.hp - strike.damage * G.damageMul);
    this.kx += kx * G.knockMul; this.kz += kz * G.knockMul;
    this.tint = 0.3;
    if (this.hp <= 0) { this.hitbox = null; this.next = null; this.setState(ES.DEAD); return { broke: false, died: true }; }
    if (this.in('unaware')) this.setState(ES.CHASE);
    if (this.fillMeter(G, strike.attackId)) return { broke: true, died: false };
    return { broke: false, died: false, blocked: true };
  }
  // Shared by the shield guard and the stagger meter (`guardMeter` holds either): heavy attacks fill
  // more than light ones; a full meter breaks the enemy (kneels, open) for M.breakTime. Returns true on a break.
  fillMeter(M, attackId) {
    this.guardTime = 0;
    this.guardMeter = Math.min(M.max, this.guardMeter + (M.breakers.includes(attackId) ? M.heavy : M.light));
    if (this.guardMeter < M.max - 1e-6) return false;
    this.hitbox = null; this.next = null; this.crack = 1;
    this.setState(ES.BROKEN);
    return true;
  }

  // Idle personality layered on top of the base pose, weighted by how idle the enemy is.
  idleLayer(r, ctx, w) {
    if (w <= 0.001) return;
    const t = ctx.t * this.tempo + this.seed;
    // Head turns toward the player now and then.
    const look = ease((Math.sin(t * 0.37) - 0.2) * 1.5);
    const rel = angDiff(Math.atan2(ctx.px - this.x, ctx.pz - this.z), this.yaw);
    r.head.rotation.y += clamp(rel, -1.0, 1.0) * look * w;
    lookup(IDLE_STYLES, this.def.idle || 'none', 'idle style', 'none')(r, t, w);
  }

  pose(tt, ctx) {
    const r = this.rig, d = this.def, E = CONFIG.enemy;

// What a landed attack carries, built the same way for both sides.
function makeStrike(attack, riposte = false) {

    const dx = target.x - o.x, dz = target.z - o.z;
    const lz = dx * s + dz * c - b.fwd, lx = dz * s - dx * c;
