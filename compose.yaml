services:
  souls:
    image: ${GAME_IMAGE:-ghcr.io/aleixribera/3d-souls-low:latest}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${GAME_PORT:-3080}:3000"
    environment:
      MAX_PLAYERS: "${MAX_PLAYERS:-16}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
